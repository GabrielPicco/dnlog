                        title="Adicionar coluna"
                      >+</button>
                    </div>
                  )}
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                  {(() => {
                    // VISTA SISTEMA: andar B (cima) renderiza primeiro com suas N profundidades, depois andar A (baixo)
                    // Para cada andar, profundidade=0 (fundo) vem ANTES de profundidade=1 (frente) na vista? Não.
                    // Vamos seguir: cima (andar B) → linha B-fundo, linha B-frente / baixo (andar A) → linha A-fundo, linha A-frente
                    // Na grade visual, cada linha é UMA fileira de N BBs lado a lado.
                    // l vai de andares-1 até 0 (andar de cima primeiro)
                    // dentro de cada andar, prof=1 (fundo/T) vem antes de prof=0 (frente/F)
                    const linhas = [];
                    for (let l = carreta.andares - 1; l >= 0; l--) {
                      const profMax = carreta.profundidade;
                      for (let prof = profMax - 1; prof >= 0; prof--) {
                        // prof=1 (T) primeiro, depois prof=0 (F)
                        linhas.push({ l, prof, profSuffix: prof === 0 ? 'F' : 'T' });
                      }
                    }
                    // Rótulo da linha: B = andar de cima, A = andar de baixo. Com profundidade indicamos posição interna.
                    return linhas.map((row, rowIdx) => {
                      const andarLabel = row.l === 1 ? 'B' : 'A'; // 1 = cima, 0 = baixo
                      const profLabel = row.profSuffix === 'T' ? 'fundo' : 'frente';
                      return (
                        <div key={`${row.l}-${row.profSuffix}`} style={{ display: 'flex', gap: 3, alignItems: 'center' }}>
                          {carreta.andares > 1 && (
                            <div style={{
                              width: 24, textAlign: 'center', fontSize: 10, fontWeight: 800,
                              color: row.l === 1 ? 'var(--blue)' : 'var(--accent-light)',
                              fontFamily: 'JetBrains Mono, monospace',
                              display: 'flex', flexDirection: 'column', alignItems: 'center', lineHeight: 1
                            }}>
                              <span>{andarLabel}</span>
                              {carreta.profundidade === 2 && (
                                <span style={{ fontSize: 7, color: 'var(--text-dim)', textTransform: 'uppercase', marginTop: 1, fontWeight: 600 }}>
                                  {profLabel}
                                </span>
                              )}
                            </div>
                          )}
                          {Array.from({ length: carreta.colunas }).map((_, c) => {
                            const key = `L${row.l}C${c}${row.profSuffix}`;
                            const valor = carreta.celulas[key];
                            const lote = valor ? loteByIdx[valor] : null;
                            const cor = lote ? lote.cor : (valor ? CORES_PARADAS[(valor - 1) % CORES_PARADAS.length] : null);
                            return (
                              <button
                                key={c}
                                onClick={() => handleSlotClick(carretaIdx, row.l, c, row.prof)}
                                disabled={readonly}
                                style={{
                                  width: 32, height: 32, padding: 0,
                                  background: cor ? cor + '60' : 'var(--bg-card)',
                                  border: '1.5px solid ' + (cor || 'var(--border)'),
                                  borderRadius: 3,
                                  cursor: readonly ? 'default' : 'pointer',
                                  color: cor || 'var(--text-muted)',
                                  fontFamily: 'JetBrains Mono, monospace',
                                  fontWeight: 800, fontSize: 10,
                                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                                  flexShrink: 0,
                                  transition: 'transform 0.1s'
                                }}
                                title={lote
                                  ? `Andar ${andarLabel}-${profLabel} L${c+1} · Parada ${lote.paradaOrdem} (${lote.cliente}) · Lote ${lote.loteCodigo}`
                                  : valor ? `Andar ${andarLabel}-${profLabel} L${c+1} · Parada ${valor}`
                                  : `Andar ${andarLabel}-${profLabel} L${c+1} · Vazio`}
                                onMouseEnter={e => { if (!readonly) e.currentTarget.style.transform = 'scale(1.08)'; }}
                                onMouseLeave={e => { if (!readonly) e.currentTarget.style.transform = 'scale(1)'; }}
                              >
                                {lote ? lote.label : (valor || '')}
                              </button>
                            );
                          })}
                        </div>
                      );
                    });
                  })()}
                </div>
                {/* Rodas */}
                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 4 }}>
                  <div style={{ width: 12, height: 12, background: '#000', borderRadius: 6, border: '2px solid #444' }}></div>
                  <div style={{ width: 12, height: 12, background: '#000', borderRadius: 6, border: '2px solid #444' }}></div>
                  <div style={{ width: 12, height: 12, background: '#000', borderRadius: 6, border: '2px solid #444' }}></div>
                  <div style={{ width: 12, height: 12, background: '#000', borderRadius: 6, border: '2px solid #444' }}></div>
                </div>
              </div>
            </React.Fragment>
          ))}
        </div>

        {/* Status */}
        <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px dashed var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, flexWrap: 'wrap', fontSize: 11 }}>
          <div style={{ color: 'var(--text-muted)' }}>
            Capacidade do veículo: <strong style={{ color: 'var(--text)' }}>{capacidadeTotal}</strong> posições · Total da carga: <strong style={{ color: 'var(--accent-light)' }}>{totalEsperado} un.</strong>
            {totalEsperado > capacidadeTotal && (
              <span style={{ marginLeft: 8, color: 'var(--red)', fontWeight: 700 }}>
                <i className="ti ti-alert-triangle" style={{ verticalAlign: -1 }}></i> Carga excede capacidade!
              </span>
            )}
          </div>
          <div style={{ color: marcadosTotal === totalEsperado ? 'var(--green)' : 'var(--orange)' }}>
            Marcados no mapa: <strong style={{ fontFamily: 'JetBrains Mono, monospace' }}>{marcadosTotal}</strong> / {totalEsperado} un.
            {marcadosTotal === totalEsperado && <i className="ti ti-check" style={{ marginLeft: 4, verticalAlign: -1 }}></i>}
          </div>
        </div>

        {/* Legenda da vista sistema (só se andares=2 e/ou profundidade=2) */}
        {mapaNormalizado.carretas[0].andares > 1 && mapaNormalizado.carretas[0].profundidade > 1 && (
          <div style={{ marginTop: 10, padding: 10, background: 'var(--bg-card)', borderRadius: 6, fontSize: 11, color: 'var(--text-muted)', lineHeight: 1.6, border: '1px solid var(--border)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}>
              <i className="ti ti-info-circle" style={{ color: 'var(--accent-light)' }}></i>
              <strong style={{ color: 'var(--text)' }}>Como ler a vista sistema:</strong>
            </div>
            <div style={{ marginLeft: 4 }}>
              <div><span style={{ color: 'var(--blue)', fontFamily: 'JetBrains Mono, monospace', fontWeight: 800 }}>B</span> = andar de cima (sobreposto) · <span style={{ color: 'var(--accent-light)', fontFamily: 'JetBrains Mono, monospace', fontWeight: 800 }}>A</span> = andar de baixo (lastro do caminhão)</div>
              <div>Cada andar tem 2 linhas: <strong>fundo</strong> (BB atrás) e <strong>frente</strong> (BB visível do lado). No PDF saem 2 vistas — superior e lateral.</div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

// MAPA DE CARGA - VERSÃO PARA IMPRESSÃO

// ============================================================
// HELPERS DE LOTE NO MAPA (usados pelo MapaCargaPrint)
// ============================================================

// Dado um mapa preenchido + paradas, distribui códigos de lote nas células
// seguindo a mesma ordem física usada no preenchimento automático.
// Retorna { "carretaIdx:L0C0F": { codigo, item, sem_lote } }
// Cada célula já guarda o idx do lote (pintura por lote). Mapeia o valor da
// célula para os dados do lote (código, parada, cor) usando a mesma lista da edição.
const distribuirLotesNasCelulas = (mapaNorm, oe) => {
  const resultado = {};
  const lotes = getLotesCarga(oe);
  const byIdx = {};
  lotes.forEach(l => { byIdx[l.idx] = l; });
  mapaNorm.carretas.forEach((carreta, carretaIdx) => {
    Object.entries(carreta.celulas || {}).forEach(([key, valor]) => {
      const lote = byIdx[valor];
      resultado[`${carretaIdx}:${key}`] = lote
        ? { codigo: lote.loteCodigo, item: lote.cultivar, sem_lote: !!lote.semLote, paradaOrdem: lote.paradaOrdem }
        : { codigo: '?', item: '?', sem_lote: true, paradaOrdem: valor };
    });
  });
  return resultado;
};

// Encurta código de lote para caber na célula impressa: NEO2026276804 → "NEO804"
const lotesCurto = (codigo) => {
  if (!codigo || codigo === '—' || codigo === '?') return codigo || '·';
  const m = codigo.match(/^([A-Z]+)(\d+)$/);
  if (m) {
    const letras = m[1].slice(0, 3);
    const finalNum = m[2].slice(-3);
    return `${letras}${finalNum}`;
  }
  return codigo.slice(0, 6);
};

// ============================================================
// MAPA DE CARGA — VERSÃO PARA IMPRESSÃO
// Mostra DUAS visualizações: VISTA SUPERIOR (planta baixa, olhando de cima)
// e VISTA LATERAL (perfil do caminhão, olhando do lado).
// ============================================================
const MapaCargaPrint = ({ oe, mapa }) => {
  const mapaNorm = migrarMapa(mapa);
  if (!mapaNorm || !mapaNorm.carretas || bbsMarcadosNoMapa(mapaNorm) === 0) return null;
  const paradas = getParadas(oe);
  const template = TEMPLATES_VEICULO[mapaNorm.template] || TEMPLATES_VEICULO.personalizado;

  const coresImpressao = [
    { bg: '#D4F4DD', border: '#2BA85F', label: '#1F6B3A' },
    { bg: '#D5E6FF', border: '#3B82F6', label: '#1E40AF' },
    { bg: '#E8DCFF', border: '#7C3AED', label: '#5B21B6' },
    { bg: '#FFF3CC', border: '#F59E0B', label: '#92400E' },
    { bg: '#FFD9EC', border: '#EC4899', label: '#9D174D' },
    { bg: '#D4F4E5', border: '#10B981', label: '#065F46' },
  ];

  const lotesPorCelula = distribuirLotesNasCelulas(mapaNorm, oe);
  const loteByIdxPrint = {};
  getLotesCarga(oe).forEach(l => { loteByIdxPrint[l.idx] = l; });

  // Lotes únicos por parada (legenda detalhada)
  const lotesPorParada = paradas.map(p => {
    const lotesSet = new Map();
    p.itens.forEach(it => {
      if (it.lotes_alocados && it.lotes_alocados.length > 0) {
        it.lotes_alocados.forEach(la => {
          const k = la.lote_codigo;
          lotesSet.set(k, (lotesSet.get(k) || 0) + la.qtd_bb);
        });
      }
    });
    return { parada: p, lotes: Array.from(lotesSet.entries()).map(([codigo, qtd]) => ({ codigo, qtd })) };
  });

  // ============================================================================
  // CELULA helper (para reutilizar em ambas as vistas)
  // ============================================================================
  const Celula = ({ valor, lote, largura, altura, fontSize, mostrarParada, prefixoCamada }) => {
    // A cor/parada vem do lote (cada célula guarda o idx do lote).
    const paradaNum = lote ? lote.paradaOrdem : valor;
    const cor = paradaNum ? coresImpressao[(paradaNum - 1) % coresImpressao.length] : null;
    return (
      <div style={{
        width: largura, height: altura,
        background: cor ? cor.bg : 'white',
        border: '1px solid ' + (cor ? cor.border : '#CCC'),
        borderRadius: 2,
        display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
        color: cor ? cor.label : '#999',
        fontFamily: 'JetBrains Mono, monospace',
        gap: 1, padding: 1, boxSizing: 'border-box', position: 'relative'
      }}>
        {/* Prefixo L/R no canto superior esquerdo */}
        {prefixoCamada && valor && (
          <div style={{
            position: 'absolute', top: 1, left: 2,
            fontSize: 7, fontWeight: 800, opacity: 0.85,
            color: prefixoCamada === 'R' ? '#1E40AF' : '#1F6B3A',
            lineHeight: 1
          }}>
            {prefixoCamada}
          </div>
        )}
        {mostrarParada && paradaNum && (
          <div style={{ fontSize: 6, fontWeight: 700, opacity: 0.7, lineHeight: 1 }}>P{paradaNum}</div>
        )}
        <div style={{ fontSize: fontSize, fontWeight: 800, lineHeight: 1 }}>
          {lote ? lotesCurto(lote.codigo) : (valor ? '?' : '·')}
        </div>
      </div>
    );
  };

  return (
    <>
      {/* VISTA SUPERIOR (planta baixa) */}
      <div className="doc-block-wide" style={{ pageBreakInside: 'avoid' }}>
        <div className="doc-block-header">
          <i className="ti ti-layout-grid"></i> MAPA DE CARGA · {template.nome.toUpperCase()} · VISTA SUPERIOR (planta baixa)
        </div>
        <div style={{ padding: '14px', background: '#FAFAF8' }}>
          <div style={{ fontSize: 9, color: '#555', marginBottom: 10, textAlign: 'center', fontWeight: 600, letterSpacing: '0.05em' }}>
            Como se você estivesse olhando o caminhão DE CIMA · cada célula tem prefixo <strong style={{ color: '#1E40AF' }}>R</strong> (Remontado · andar de cima visível) ou <strong style={{ color: '#1F6B3A' }}>L</strong> (Lastro · andar de baixo, sem volume remontado em cima)
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            {/* Cabine */}
            <div style={{
              width: 50,
              height: (mapaNorm.carretas[0].profundidade) * 30 + 22,
              background: '#EFEFEC', border: '2px solid #1A1A1A',
              borderRadius: '8px 3px 3px 8px',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              flexShrink: 0, fontSize: 8, color: '#555', fontWeight: 700
            }}>CABINE</div>
            {mapaNorm.carretas.map((carreta, carretaIdx) => (
              <React.Fragment key={carretaIdx}>
                {carretaIdx > 0 && (
                  <div style={{ width: 18, alignSelf: 'center', textAlign: 'center', fontSize: 9, fontWeight: 700, color: '#555' }}>—⛓—</div>
                )}
                <div style={{ flex: 'none', border: '2px solid #1A1A1A', borderRadius: 3, padding: 5, background: 'white' }}>
                  <div style={{ fontSize: 7, color: '#555', textAlign: 'center', fontWeight: 700, letterSpacing: '0.05em', marginBottom: 4 }}>
                    CARRETA {carretaIdx + 1} {carretaIdx === 0 ? '· ← FRENTE · TRASEIRA →' : ''} · VISTA SUPERIOR
                  </div>
                  {/* Renderiza: pra cada profundidade, uma linha com N colunas (vista de cima)
                      Em cada célula: se tem volume no andar B (cima), mostra esse (Remontado).
                      Se só tem A (baixo), mostra o do Lastro. */}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                    {Array.from({ length: carreta.profundidade }).map((_, profIdx) => {
                      const prof = carreta.profundidade - 1 - profIdx; // 1, 0 (fundo primeiro)
                      const profSuffix = prof === 0 ? 'F' : 'T';
                      const profLabel = prof === 0 ? 'frente' : 'fundo';
                      const lCima = carreta.andares - 1; // andar B
                      const lBaixo = 0; // andar A
                      const temDoisAndares = carreta.andares > 1;
                      return (
                        <div key={prof} style={{ display: 'flex', gap: 2, alignItems: 'center' }}>
                          {carreta.profundidade > 1 && (
                            <span style={{ fontSize: 7, fontWeight: 700, color: '#555', width: 28, textAlign: 'center', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                              {profLabel}
                            </span>
                          )}
                          {Array.from({ length: carreta.colunas }).map((_, c) => {
                            const keyCima = `L${lCima}C${c}${profSuffix}`;
                            const keyBaixo = `L${lBaixo}C${c}${profSuffix}`;
                            const valorCima = carreta.celulas[keyCima];
                            const valorBaixo = temDoisAndares ? carreta.celulas[keyBaixo] : null;
                            // Lógica: vê o BB de cima se existir, senão o de baixo
                            const ehRemontado = !!valorCima;
                            const valorMostrar = valorCima || valorBaixo;
                            const keyMostrar = valorCima ? keyCima : keyBaixo;
                            const lote = valorMostrar ? lotesPorCelula[`${carretaIdx}:${keyMostrar}`] : null;
                            const prefixoCamada = temDoisAndares ? (ehRemontado ? 'R' : (valorBaixo ? 'L' : '')) : '';
                            return <Celula
                              key={c}
                              valor={valorMostrar}
                              lote={lote}
                              largura={42}
                              altura={28}
                              fontSize={8}
                              mostrarParada={true}
                              prefixoCamada={prefixoCamada}
                            />;
                          })}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
      </div>

      {/* VISTA LATERAL (perfil) — só se andares > 1 */}
      {mapaNorm.carretas[0].andares > 1 && (
        <div className="doc-block-wide" style={{ pageBreakInside: 'avoid' }}>
          <div className="doc-block-header">
            <i className="ti ti-rotate-2"></i> MAPA DE CARGA · VISTA LATERAL (perfil)
          </div>
          <div style={{ padding: '14px', background: '#FAFAF8' }}>
            <div style={{ fontSize: 9, color: '#555', marginBottom: 10, textAlign: 'center', fontWeight: 600, letterSpacing: '0.05em' }}>
              Como se você estivesse olhando o caminhão DE LADO · mostra apenas a fileira da frente · A = andar de baixo · B = andar de cima
              {mapaNorm.carretas[0].profundidade === 2 && ' · os volumes do fundo estão atrás (não visíveis nesta vista)'}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
              <div style={{
                width: 50,
                height: mapaNorm.carretas[0].andares * 30 + 22,
                background: '#EFEFEC', border: '2px solid #1A1A1A',
                borderRadius: '8px 3px 3px 8px',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                flexShrink: 0, fontSize: 8, color: '#555', fontWeight: 700
              }}>CABINE</div>
              {mapaNorm.carretas.map((carreta, carretaIdx) => (
                <React.Fragment key={carretaIdx}>
                  {carretaIdx > 0 && (
                    <div style={{ width: 18, alignSelf: 'center', textAlign: 'center', fontSize: 9, fontWeight: 700, color: '#555' }}>—⛓—</div>
                  )}
                  <div style={{ flex: 'none', border: '2px solid #1A1A1A', borderRadius: 3, padding: 5, background: 'white' }}>
                    <div style={{ fontSize: 7, color: '#555', textAlign: 'center', fontWeight: 700, letterSpacing: '0.05em', marginBottom: 4 }}>
                      CARRETA {carretaIdx + 1} · APENAS VOLUMES DA FRENTE
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                      {Array.from({ length: carreta.andares }).reverse().map(_unused => null)}
                      {/* Renderiza de cima para baixo: andar B → andar A */}
                      {Array.from({ length: carreta.andares }).map((_, idx) => {
                        const l = carreta.andares - 1 - idx; // andar de cima primeiro
                        const andarLabel = l === 1 ? 'B' : 'A';
                        // Sempre mostra a profundidade 0 (frente) — a parte visível do lado
                        const profSuffix = 'F';
                        return (
                          <div key={l} style={{ display: 'flex', gap: 2, alignItems: 'center' }}>
                            <span style={{
                              fontSize: 9, fontWeight: 800, width: 16, textAlign: 'center',
                              color: l === 1 ? '#1E40AF' : '#1F6B3A',
                              fontFamily: 'JetBrains Mono, monospace'
                            }}>{andarLabel}</span>
                            {Array.from({ length: carreta.colunas }).map((_, c) => {
                              const key = `L${l}C${c}${profSuffix}`;
                              const valor = carreta.celulas[key];
                              const lote = valor ? lotesPorCelula[`${carretaIdx}:${key}`] : null;
                              return <Celula key={c} valor={valor} lote={lote} largura={42} altura={28} fontSize={8} mostrarParada={true} />;
                            })}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* LEGENDA DE PARADAS E LOTES */}
      <div className="doc-block-wide" style={{ pageBreakInside: 'avoid' }}>
        <div className="doc-block-header"><i className="ti ti-list"></i> LEGENDA · CÓDIGO DO LOTE (formato abreviado)</div>
        <div style={{ padding: '12px 14px', background: '#FAFAF8' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {lotesPorParada.map(({ parada: p, lotes }) => {
              const cor = coresImpressao[(p.ordem_carga - 1) % coresImpressao.length];
              let numNoMapa = 0;
              mapaNorm.carretas.forEach(c => {
                Object.values(c.celulas).forEach(v => { if ((loteByIdxPrint[v]?.paradaOrdem ?? v) === p.ordem_carga) numNoMapa++; });
              });
              return (
                <div key={p.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, fontSize: 9, paddingBottom: 5, borderBottom: '1px dashed #DDD' }}>
                  <span style={{
                    width: 22, height: 22, background: cor.bg, border: '1.5px solid ' + cor.border,
                    borderRadius: 2, fontSize: 11, fontWeight: 800, color: cor.label,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontFamily: 'JetBrains Mono, monospace', flexShrink: 0
                  }}>P{p.ordem_carga}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, color: '#1A1A1A' }}>{p.cliente}</div>
                    <div style={{ fontSize: 8, color: '#555', marginTop: 1 }}>
                      {numNoMapa} un. no mapa · {p.itens.reduce((a,i) => a + i.qtd_bb, 0)} un. total
                    </div>
                    {lotes.length > 0 && (
                      <div style={{ marginTop: 4, display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                        {lotes.map(l => (
                          <span key={l.codigo} style={{
                            display: 'inline-flex', alignItems: 'center', gap: 3,
                            padding: '1px 5px', background: '#F5F5F2', border: '1px solid #DDD',
                            borderRadius: 2, fontSize: 8, fontFamily: 'JetBrains Mono, monospace'
                          }}>
                            <strong>{l.codigo === 'SEM_LOTE' ? 'A definir' : l.codigo}</strong>
                            <span style={{ color: '#777' }}>({lotesCurto(l.codigo === 'SEM_LOTE' ? '—' : l.codigo)})</span>
                            <span style={{ color: '#444' }}>· {l.qtd} un.</span>
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{ marginTop: 8, paddingTop: 6, borderTop: '1px solid #1A1A1A', fontSize: 8, color: '#666', lineHeight: 1.5 }}>
            <strong style={{ color: '#1A1A1A' }}>Como interpretar:</strong>{' '}
            A <strong>vista superior</strong> é a planta baixa do caminhão visto de cima. Cada célula tem prefixo:
            {' '}<strong style={{ color: '#1E40AF' }}>R</strong> = volume <strong>Remontado</strong> (andar superior, é o que você vê do alto);
            {' '}<strong style={{ color: '#1F6B3A' }}>L</strong> = volume do <strong>Lastro</strong> (andar inferior, visível só onde não há remontado em cima).
            A <strong>vista lateral</strong> é o caminhão visto de lado, mostrando apenas os volumes da fileira da frente (os do fundo ficam atrás, ocultos).
            Cada célula traz o número da parada (P1, P2...) e o código abreviado do lote (3 letras + 3 dígitos do fim).
            Os códigos completos estão listados acima por parada.
          </div>
        </div>
      </div>
    </>
  );
};

const Embarques = ({ ctx }) => {
  const [filtroStatus, setFiltroStatus] = useState('TODOS');
  const [filtroModalidade, setFiltroModalidade] = useState('TODAS');
  const [filtroFaturado, setFiltroFaturado] = useState('TODOS'); // TODOS, FATURADAS, NAO_FATURADAS
  const [filtroPeriodo, setFiltroPeriodo] = useState('30d');
  const [busca, setBusca] = useState('');
  const [ordenacao, setOrdenacao] = useState('data_desc');
  const [oeExpandida, setOeExpandida] = useState(null);

  const ordens = ctx.state.ordens;

  // Aplica filtros
  const filtradas = useMemo(() => {
    let resultado = ordens;

    if (filtroPeriodo !== 'todos') {
      const dias = filtroPeriodo === '7d' ? 7 : filtroPeriodo === '30d' ? 30 : 90;
      const limite = new Date();
      limite.setDate(limite.getDate() - dias);
      resultado = resultado.filter(oe => {
        const dataOE = new Date(oe.criado_em || oe.data_prevista);
        return dataOE >= limite;
      });
    }

    if (filtroStatus !== 'TODOS') resultado = resultado.filter(oe => oe.status === filtroStatus);
    if (filtroModalidade !== 'TODAS') resultado = resultado.filter(oe => oe.modalidade === filtroModalidade);
    if (filtroFaturado === 'FATURADAS') resultado = resultado.filter(oe => oe.faturada);
    else if (filtroFaturado === 'NAO_FATURADAS') resultado = resultado.filter(oe => !oe.faturada);

    if (busca) {
      const q = busca.toLowerCase();
      resultado = resultado.filter(oe => {
        if (oe.numero.toLowerCase().includes(q)) return true;
        if ((oe.motorista_nome || '').toLowerCase().includes(q)) return true;
        if ((oe.veiculo_placa || '').toLowerCase().includes(q)) return true;
        // Busca em clientes (todas as paradas)
        const paradas = getParadas(oe);
        if (paradas.some(p => (p.cliente || '').toLowerCase().includes(q))) return true;
        // Busca em lotes
        const todosLotes = getAllItens(oe).flatMap(it => (it.lotes_alocados || []).map(la => la.lote_codigo));
        if (todosLotes.some(l => l.toLowerCase().includes(q))) return true;
        return false;
      });
    }

    // Ordenação
    const copia = [...resultado];
    if (ordenacao === 'data_desc') copia.sort((a, b) => (b.data_prevista || '').localeCompare(a.data_prevista || ''));
    else if (ordenacao === 'data_asc') copia.sort((a, b) => (a.data_prevista || '').localeCompare(b.data_prevista || ''));
    else if (ordenacao === 'status') {
      const ordemStatus = ['PROGRAMADA', 'EM_CONFERENCIA', 'EMBARCADA', 'EM_TRANSITO', 'ENTREGUE', 'CANCELADA'];
      copia.sort((a, b) => ordemStatus.indexOf(a.status) - ordemStatus.indexOf(b.status));
    }
    else if (ordenacao === 'valor_desc') copia.sort((a, b) => totalValor(b) - totalValor(a));
    return copia;
  }, [ordens, filtroStatus, filtroModalidade, filtroFaturado, filtroPeriodo, busca, ordenacao]);

  // Stats agregadas
  const stats = useMemo(() => {
    const total = filtradas.length;
    const valorTotal = filtradas.reduce((a, oe) => a + totalValor(oe), 0);
    const bbsTotal = filtradas.reduce((a, oe) => a + totalBBs(oe), 0);
    const entregues = filtradas.filter(oe => oe.status === 'ENTREGUE').length;
    const faturadas = filtradas.filter(oe => oe.faturada).length;
    return { total, valorTotal, bbsTotal, entregues, faturadas };
  }, [filtradas]);

  const exportarCSV = () => {
    const linhas = ['Numero;Status;Modalidade;Data prevista;Hora;Clientes;Pedido(s);Lotes;BBs;Valor;Motorista;Placa;Doca;Conferido em;Observacoes'];
    filtradas.forEach(oe => {
      const paradas = getParadas(oe);
      const clientes = paradas.map(p => p.cliente).join(' | ');
      const pedidos = paradas.map(p => p.pedido_numero).join(' | ');
      const lotes = getAllItens(oe).flatMap(it => (it.lotes_alocados || []).map(la => la.lote_codigo)).join(',');
      const linha = [
        oe.numero, oe.status, oe.modalidade,
        oe.data_prevista || '', oe.hora_prevista || '',
        clientes, pedidos, lotes,
        totalBBs(oe), totalValor(oe).toFixed(2),
        oe.motorista_nome || '', oe.veiculo_placa || '', oe.doca || '',
        oe.embarcada_em || '', (oe.observacoes || '').replace(/\n/g, ' ')
      ].map(c => String(c).replace(/;/g, ',')).join(';');
      linhas.push(linha);
    });
    const csv = linhas.join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `embarques_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb">
            <i className="ti ti-home"></i>
            <span>Consulta de embarques</span>
          </div>
          <h1 className="page-title">Consulta de embarques</h1>
          <p className="page-subtitle">Histórico operacional · {filtradas.length} {filtradas.length === 1 ? 'OE' : 'OEs'} no filtro atual</p>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button className="btn btn-ghost" onClick={exportarCSV} disabled={filtradas.length === 0}>
            <i className="ti ti-file-export"></i> Exportar CSV
          </button>
          {ctx.podeEditar && (
            <button className="btn btn-primary" onClick={() => { ctx.setEditingOE(null); ctx.setScreen('nova-oe'); }}>
              <i className="ti ti-plus"></i> Nova OE
            </button>
          )}
        </div>
      </div>

      {/* STATS RÁPIDAS */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, marginBottom: 16 }}>
        <div className="kpi-card">
          <div className="kpi-icon" style={{ background: 'var(--accent-glow)', color: 'var(--accent-light)' }}>
            <i className="ti ti-truck"></i>
          </div>
          <div>
            <div className="kpi-label">Embarques no período</div>
            <div className="kpi-value mono">{stats.total}</div>
          </div>
        </div>
        <div className="kpi-card">
          <div className="kpi-icon" style={{ background: 'var(--green-bg)', color: 'var(--green)' }}>
            <i className="ti ti-receipt"></i>
          </div>
          <div>
            <div className="kpi-label">Faturadas</div>
            <div className="kpi-value mono">{stats.faturadas}<span style={{ fontSize: 11, color: 'var(--text-muted)', fontWeight: 400 }}> / {stats.total}</span></div>
          </div>
        </div>
        <div className="kpi-card">
          <div className="kpi-icon" style={{ background: 'var(--blue-bg)', color: 'var(--blue)' }}>
            <i className="ti ti-package"></i>
          </div>
          <div>
            <div className="kpi-label">Unidades movimentadas</div>
            <div className="kpi-value mono">{fmtNum(stats.bbsTotal)}</div>
          </div>
        </div>
        <div className="kpi-card">
          <div className="kpi-icon" style={{ background: 'var(--purple-bg, rgba(167,139,250,0.15))', color: 'var(--purple, #A78BFA)' }}>
            <i className="ti ti-cash"></i>
          </div>
          <div>
            <div className="kpi-label">Valor total</div>
            <div className="kpi-value mono" style={{ fontSize: 16 }}>{fmtMoney(stats.valorTotal)}</div>
          </div>
        </div>
      </div>

      {/* FILTROS */}
      <div className="panel" style={{ marginBottom: 12 }}>
        <div style={{ padding: '12px 16px', display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
          <div className="search-box" style={{ flex: 1, minWidth: 200 }}>
            <i className="ti ti-search"></i>
            <input value={busca} onChange={e => setBusca(e.target.value)} placeholder="Buscar OE, cliente, motorista, placa, lote..." />
          </div>
          <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
            <span style={{ fontSize: 10, color: 'var(--text-muted)', fontWeight: 700, textTransform: 'uppercase' }}>Período:</span>
            <div style={{ display: 'flex', gap: 2, background: 'var(--bg-card)', borderRadius: 5, padding: 2 }}>
              {[['7d', '7d'], ['30d', '30d'], ['90d', '90d'], ['todos', 'Tudo']].map(([v, l]) => (
                <button key={v} onClick={() => setFiltroPeriodo(v)} style={{
                  background: filtroPeriodo === v ? 'var(--accent)' : 'transparent',
                  color: filtroPeriodo === v ? 'white' : 'var(--text-muted)',
                  border: 'none', padding: '4px 9px', borderRadius: 3, fontSize: 11,
                  fontFamily: 'inherit', cursor: 'pointer', fontWeight: 700
                }}>{l}</button>
              ))}
            </div>
          </div>
          <select value={filtroStatus} onChange={e => setFiltroStatus(e.target.value)} className="input" style={{ width: 'auto', padding: '5px 8px', fontSize: 12 }}>
            <option value="TODOS">Todos os status</option>
            <option value="PROGRAMADA">Programada</option>
            <option value="EM_CONFERENCIA">Em conferência</option>
            <option value="EMBARCADA">Embarcada</option>
            <option value="EM_TRANSITO">Em trânsito</option>
            <option value="ENTREGUE">Entregue</option>
            <option value="CANCELADA">Cancelada</option>
          </select>
          <select value={filtroModalidade} onChange={e => setFiltroModalidade(e.target.value)} className="input" style={{ width: 'auto', padding: '5px 8px', fontSize: 12 }}>
            <option value="TODAS">Todas modalidades</option>
            <option value="ESTOQUE_PROPRIO">Estoque próprio</option>
            <option value="TRIANGULAR">Triangular</option>
          </select>
          <select value={filtroFaturado} onChange={e => setFiltroFaturado(e.target.value)} className="input" style={{ width: 'auto', padding: '5px 8px', fontSize: 12 }}>
            <option value="TODOS">Faturadas e não</option>
            <option value="FATURADAS">Só faturadas</option>
            <option value="NAO_FATURADAS">Não faturadas</option>
          </select>
          <select value={ordenacao} onChange={e => setOrdenacao(e.target.value)} className="input" style={{ width: 'auto', padding: '5px 8px', fontSize: 12 }}>
            <option value="data_desc">Data ↓ (mais recente)</option>
            <option value="data_asc">Data ↑ (mais antiga)</option>
            <option value="status">Por status</option>
            <option value="valor_desc">Maior valor</option>
          </select>
        </div>
      </div>

      {/* TABELA */}
      <div className="panel">
        {filtradas.length === 0 ? (
          <div className="empty" style={{ padding: 40 }}>
            <i className="ti ti-truck-off"></i>
            <div style={{ fontSize: 14, color: 'var(--text)' }}>Nenhum embarque encontrado</div>
            <div style={{ fontSize: 12, marginTop: 4 }}>Ajuste os filtros ou crie uma nova OE</div>
          </div>
        ) : (
          <div style={{ overflowX: 'auto' }}>
            <table className="table-tight" style={{ width: '100%', minWidth: 1100 }}>
              <thead>
                <tr>
                  <th style={{ width: 30 }}></th>
                  <th>OE</th>
                  <th>Data prevista</th>
                  <th>Cliente(s)</th>
                  <th>Modalidade</th>
                  <th>Status</th>
                  <th>Faturada</th>
                  <th className="num">Qtd</th>
                  <th className="num">Valor</th>
                  <th>Motorista</th>
                  <th>Placa</th>
                  <th>Lotes</th>
                  <th style={{ width: 80 }}>Ações</th>
                </tr>
              </thead>
              <tbody>
                {filtradas.map(oe => {
                  const paradas = getParadas(oe);
                  const expandida = oeExpandida === oe.id;
                  const lotesSet = new Set();
                  getAllItens(oe).forEach(it => (it.lotes_alocados || []).forEach(la => {
                    if (la.lote_codigo && la.lote_codigo !== 'SEM_LOTE') lotesSet.add(la.lote_codigo);
                  }));
                  const lotesArr = Array.from(lotesSet);
                  return (
                    <React.Fragment key={oe.id}>
                      <tr
                        style={{ cursor: 'pointer', background: expandida ? 'var(--bg-hover)' : 'transparent' }}
                        onClick={() => setOeExpandida(expandida ? null : oe.id)}
                      >
                        <td style={{ textAlign: 'center', color: 'var(--text-muted)' }}>
                          <i className={`ti ${expandida ? 'ti-chevron-down' : 'ti-chevron-right'}`} style={{ fontSize: 12 }}></i>
                        </td>
                        <td className="mono cell-primary" style={{ fontWeight: 700 }}>{oe.numero}</td>
                        <td className="mono cell-muted" style={{ fontSize: 11 }}>
                          {fmtDate(oe.data_prevista)} <span style={{ color: 'var(--text-dim)' }}>{oe.hora_prevista}</span>
                        </td>
                        <td style={{ fontSize: 12 }}>
                          {paradas.length === 1 ? paradas[0].cliente : (
                            <span>
                              <strong>{paradas[0].cliente}</strong>
                              <span style={{ color: 'var(--text-muted)', fontSize: 11 }}> +{paradas.length - 1} parada{paradas.length > 2 ? 's' : ''}</span>
                            </span>
                          )}
                        </td>
                        <td>
                          <span className={`chip ${oe.modalidade === 'TRIANGULAR' ? 'chip-blue' : 'chip-accent'}`} style={{ fontSize: 10 }}>
                            <i className={`ti ${oe.modalidade === 'TRIANGULAR' ? 'ti-arrows-shuffle' : 'ti-building-warehouse'}`}></i>
                            {oe.modalidade === 'TRIANGULAR' ? ' Triangular' : ' Próprio'}
                          </span>
                        </td>
                        <td><StatusChip status={oe.status} /></td>
                        <td onClick={e => e.stopPropagation()}>
                          {(() => {
                            const podeFaturar = ['EMBARCADA', 'EM_TRANSITO', 'ENTREGUE'].includes(oe.status);
                            if (oe.faturada) {
                              return (
                                <button
                                  onClick={() => {
                                    if (!ctx.podeEditar) { alert('Apenas operadores/gestores podem desfaturar'); return; }
                                    if (!confirm(`Desfaturar OE ${oe.numero}?\n\nIsso vai REVERTER a baixa do saldo no pedido. Use quando a NF foi emitida errada.`)) return;
                                    ctx.desfaturarOE(oe.id);
                                  }}
                                  className="chip"
                                  style={{
                                    background: 'var(--green)', color: 'white', fontSize: 10, fontWeight: 700,
                                    border: 'none', cursor: ctx.podeEditar ? 'pointer' : 'default',
                                    fontFamily: 'inherit', padding: '3px 8px', borderRadius: 3
                                  }}
                                  title={ctx.podeEditar ? "Clique para desfaturar (reverte a baixa)" : "Faturada"}
                                >
                                  <i className="ti ti-receipt-2"></i> Faturada
                                  {oe.nf_numero && <span style={{ marginLeft: 4, opacity: 0.85, fontWeight: 400 }}>NF {oe.nf_numero}</span>}
                                </button>
                              );
                            }
                            if (podeFaturar && ctx.podeEditar) {
                              return (
                                <button
                                  onClick={() => {
                                    const nf = prompt(
                                      `Marcar ${oe.numero} como faturada?\n\n` +
                                      `Isso vai BAIXAR o saldo do(s) pedido(s) vinculado(s) em ${totalBBs(oe)} un.\n` +
                                      `Use isso quando a NF for emitida no SAP.\n\n` +
                                      `Número da NF-e (opcional):`,
                                      ''
                                    );
                                    if (nf === null) return; // cancelou
                                    ctx.faturarOE(oe.id, nf.trim());
                                  }}
                                  className="chip"
                                  style={{
                                    background: 'transparent',
                                    color: 'var(--orange)',
                                    fontSize: 10, fontWeight: 700,
                                    border: '1px dashed var(--orange)',
                                    cursor: 'pointer',
                                    fontFamily: 'inherit', padding: '2px 7px', borderRadius: 3
                                  }}
                                  title="Marcar como faturada (baixa saldo do pedido)"
                                >
                                  <i className="ti ti-receipt"></i> Marcar
                                </button>
                              );
                            }
                            if (podeFaturar) {
                              return <span style={{ fontSize: 10, color: 'var(--orange)' }}><i className="ti ti-clock"></i> Pendente</span>;
                            }
                            return <span style={{ fontSize: 10, color: 'var(--text-dim)' }}>—</span>;
                          })()}
                        </td>
                        <td className="num mono" style={{ fontWeight: 700 }}>{totalBBs(oe)}</td>
                        <td className="num mono cell-primary" style={{ fontSize: 11 }}>{fmtMoney(totalValor(oe))}</td>
                        <td style={{ fontSize: 11 }}>{oe.motorista_nome || '—'}</td>
                        <td className="mono" style={{ fontSize: 11 }}>{oe.veiculo_placa || '—'}</td>
                        <td style={{ fontSize: 10, color: 'var(--text-muted)' }}>
                          {lotesArr.length === 0 ? <span style={{ color: 'var(--orange)' }}>—</span> :
                            lotesArr.length <= 2 ? lotesArr.map(l => <div key={l} className="mono">{l}</div>) :
                            <span><span className="mono">{lotesArr[0]}</span><span style={{ color: 'var(--text-dim)' }}> +{lotesArr.length - 1}</span></span>
                          }
                        </td>
                        <td onClick={e => e.stopPropagation()}>
                          <div style={{ display: 'flex', gap: 4 }}>
                            <button
                              className="btn btn-ghost"
                              style={{ padding: '3px 7px', fontSize: 11 }}
                              onClick={() => { ctx.setViewingOE(oe); ctx.setScreen('detalhe-oe'); }}
                              title="Ver detalhes"
                            ><i className="ti ti-eye"></i></button>
                          </div>
                        </td>
                      </tr>
                      {expandida && (
                        <tr style={{ background: 'var(--bg-card)' }}>
                          <td colSpan="13" style={{ padding: '12px 18px' }}>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 14 }}>
                              {/* Paradas */}
                              <div>
                                <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700, marginBottom: 6 }}>
                                  {paradas.length > 1 ? 'PARADAS' : 'CLIENTE'}
                                </div>
                                {paradas.map(p => (
                                  <div key={p.id} style={{ fontSize: 11, marginBottom: 4, display: 'flex', gap: 6, alignItems: 'flex-start' }}>
                                    {paradas.length > 1 && (
                                      <span style={{
                                        width: 16, height: 16, borderRadius: 8, background: 'var(--accent)', color: 'white',
                                        fontSize: 9, fontWeight: 700, fontFamily: 'JetBrains Mono, monospace',
                                        display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: 1
                                      }}>{p.ordem_carga}</span>
                                    )}
                                    <div>
                                      <div style={{ fontWeight: 600 }}>{p.cliente}</div>
                                      <div style={{ color: 'var(--text-muted)', fontSize: 10 }}>
                                        <span className="mono">{p.pedido_numero}</span> · {p.itens.reduce((a, i) => a + i.qtd_bb, 0)} un.
                                      </div>
                                    </div>
                                  </div>
                                ))}
                              </div>
                              {/* Lotes detalhados */}
                              <div>
                                <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700, marginBottom: 6 }}>
                                  LOTES ({lotesArr.length})
                                </div>
                                {lotesArr.length === 0 ? (
                                  <span style={{ fontSize: 11, color: 'var(--orange)' }}>Nenhum lote informado</span>
                                ) : (
                                  <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                                    {getAllItens(oe).flatMap(it => (it.lotes_alocados || []).map(la => (
                                      <div key={`${it.codigo}-${la.lote_codigo}`} className="mono" style={{ fontSize: 10 }}>
                                        <span style={{ color: 'var(--accent-light)', fontWeight: 700 }}>{la.lote_codigo}</span>
                                        <span style={{ color: 'var(--text-muted)' }}> · {it.codigo} · {la.qtd_bb} {it.unidade || it.embalagem || 'un'}</span>
                                        {la.controle_paralelo && <span className="chip chip-blue" style={{ fontSize: 8, marginLeft: 4, padding: '0 4px' }}>CTRL PAR.</span>}
                                      </div>
                                    )))}
                                  </div>
                                )}
                              </div>
                              {/* Logística */}
                              <div>
                                <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700, marginBottom: 6 }}>LOGÍSTICA</div>
                                <div style={{ fontSize: 11, lineHeight: 1.6 }}>
                                  <div><strong>Transportadora:</strong> {oe.transportadora_nome || '—'}</div>
                                  <div><strong>Doca:</strong> {oe.doca || '—'}</div>
                                  <div><strong>Veículo:</strong> {oe.veiculo_tipo || '—'}</div>
                                  {oe.veiculo_reboque && <div><strong>Reboque:</strong> <span className="mono">{oe.veiculo_reboque}</span></div>}
                                  <div><strong>CPF motorista:</strong> <span className="mono">{oe.motorista_cpf || '—'}</span></div>
                                </div>
                              </div>
                              {/* Status / Datas */}
                              <div>
                                <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700, marginBottom: 6 }}>HISTÓRICO</div>
                                <div style={{ fontSize: 11, lineHeight: 1.6 }}>
                                  <div><strong>Criada:</strong> {fmtDateTime(oe.criado_em)}</div>
                                  <div><strong>Por:</strong> {oe.criado_por}</div>
                                  {oe.embarcada_em && <div><strong>Conferida:</strong> {fmtDateTime(oe.embarcada_em)}</div>}
                                  {oe.entregue_em && <div><strong>Entregue:</strong> {fmtDateTime(oe.entregue_em)}</div>}
                                  {oe.observacoes && <div style={{ marginTop: 4, padding: 6, background: 'var(--bg-elev)', borderRadius: 4, color: 'var(--text-muted)' }}><strong>Obs:</strong> {oe.observacoes}</div>}
                                </div>
                              </div>
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
};

// ============================================================
// DETALHE DO PEDIDO — inspeciona um pedido sem criar OE
// ============================================================
const DetalhePedido = ({ ctx }) => {
  const pedidoBase = ctx.viewingPedido;
  if (!pedidoBase) {
    return (
      <div className="empty" style={{ padding: 40 }}>
        <i className="ti ti-file-off"></i>
        <div style={{ fontSize: 14, color: 'var(--text)' }}>Nenhum pedido selecionado</div>
        <button className="btn btn-primary" style={{ marginTop: 12 }} onClick={() => ctx.setScreen('pedidos')}>
          <i className="ti ti-arrow-left"></i> Voltar para Pedidos
        </button>
      </div>
    );
  }

  // Pega o pedido com saldos atualizados do contexto
  const pedido = ctx.pedidos.find(p => p.numero === pedidoBase.numero) || pedidoBase;

  // Cálculo de urgência (reaproveita lógica)
  const calcUrgencia = (dataEntrega) => {
    if (!dataEntrega) return { categoria: 'sem_prazo', label: 'Sem prazo', cor: 'var(--text-muted)' };
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const entrega = new Date(dataEntrega); entrega.setHours(0, 0, 0, 0);
    const dias = Math.round((entrega - hoje) / (1000 * 60 * 60 * 24));
    if (dias < 0) return { categoria: 'atrasado', label: `${Math.abs(dias)}d atrasado`, cor: 'var(--red)' };
    if (dias === 0) return { categoria: 'hoje', label: 'Hoje', cor: 'var(--orange)' };
    if (dias <= 3) return { categoria: 'urgente', label: `${dias}d`, cor: 'var(--orange)' };
    if (dias <= 7) return { categoria: '7d', label: `${dias}d`, cor: 'var(--blue)' };
    return { categoria: 'futuro', label: `${dias}d`, cor: 'var(--text-muted)' };
  };
  const u = calcUrgencia(pedido.data_entrega);

  // OEs que consomem este pedido (qualquer parada com pedido_numero ou pedidos_numeros)
  const oesVinculadas = useMemo(() => {
    return ctx.state.ordens.filter(oe => {
      const paradas = getParadas(oe);
      return paradas.some(p =>
        p.pedido_numero === pedido.numero ||
        (p.pedidos_numeros && p.pedidos_numeros.includes(pedido.numero))
      );
    });
  }, [ctx.state.ordens, pedido.numero]);

  // Quanto cada OE consumiu deste pedido
  const consumoPorOE = (oe) => {
    const paradas = getParadas(oe);
    let bb = 0, valor = 0;
    paradas.forEach(p => {
      const ehDestePedido = p.pedido_numero === pedido.numero ||
        (p.pedidos_numeros && p.pedidos_numeros.includes(pedido.numero));
      if (!ehDestePedido) return;
      p.itens.forEach(it => {
        // Item da parada multi-pedido tem pedido_numero próprio (formato novo)
        if (it.pedido_numero && it.pedido_numero !== pedido.numero) return;
        bb += it.qtd_bb;
        valor += it.qtd_bb * it.valor_unitario;
      });
    });
    return { bb, valor };
  };

  // Totais agregados
  const totalBBsPedido = pedido.itens.reduce((a, i) => a + i.qtd_bb, 0);
  const totalEntregueBase = pedido.itens.reduce((a, i) => a + (i.qtd_entregue_total || i.qtd_entregue || 0), 0);
  const totalEmOE = oesVinculadas
    .filter(oe => oe.status !== 'CANCELADA' && oe.status !== 'RASCUNHO' && !oe.faturada)
    .reduce((a, oe) => a + consumoPorOE(oe).bb, 0);
  const totalSaldoBB = pedido.qtd_saldo_bb;
  const valorTotalPedido = pedido.itens.reduce((a, i) => a + (i.qtd_bb * i.valor_unitario), 0);

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb">
            <i className="ti ti-home"></i>
            <span style={{cursor:'pointer', color:'var(--accent-light)'}} onClick={() => ctx.setScreen('pedidos')}>Pedidos SAP</span>
            <span>·</span>
            <span>{pedido.numero}</span>
          </div>
          <h1 className="page-title">{pedido.numero}</h1>
          <p className="page-subtitle">
            <strong>{pedido.cliente}</strong>
            {pedido.vendedor && <> · Vendedor: {pedido.vendedor}</>}
          </p>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button className="btn btn-ghost" onClick={() => ctx.setScreen('pedidos')}>
            <i className="ti ti-arrow-left"></i> Voltar
          </button>
          {ctx.podeEditar && pedido.tem_saldo && (
            <button
              className="btn btn-primary"
              onClick={() => {
                ctx.setEditingOE({ pedido_numero: pedido.numero, cliente: pedido.cliente });
                ctx.setScreen('nova-oe');
              }}
            >
              <i className="ti ti-plus"></i> Criar OE deste pedido
            </button>
          )}
        </div>
      </div>

      {/* STATUS + DATAS */}
      <div className="panel" style={{ marginBottom: 14 }}>
        <div style={{ padding: '14px 18px', display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700, marginBottom: 4 }}>Status</div>
            {pedido.tem_saldo
              ? <span className="chip chip-green" style={{ fontSize: 12 }}><i className="ti ti-circle-check"></i> Aberto · {pedido.qtd_saldo_bb} un. pendente{pedido.qtd_saldo_bb !== 1 ? 's' : ''}</span>
              : <span className="chip chip-neutral" style={{ fontSize: 12 }}><i className="ti ti-check"></i> Atendido (saldo zerado)</span>
            }
          </div>
          <div>
            <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700, marginBottom: 4 }}>Emissão</div>
            <div style={{ fontSize: 13 }} className="mono">{fmtDate(pedido.data_emissao)}</div>
          </div>
          <div>
            <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700, marginBottom: 4 }}>Entrega prevista</div>
            <div style={{ fontSize: 13, color: u.cor, fontWeight: u.categoria === 'atrasado' || u.categoria === 'hoje' ? 700 : 500 }} className="mono">
              {pedido.data_entrega ? (
                <>
                  {fmtDate(pedido.data_entrega)}
                  <span style={{ fontSize: 11, marginLeft: 6 }}>
                    {u.categoria === 'atrasado' && <i className="ti ti-alert-octagon" style={{ marginRight: 2 }}></i>}
                    {u.categoria === 'hoje' && <i className="ti ti-flame" style={{ marginRight: 2 }}></i>}
                    ({u.label})
                  </span>
                </>
              ) : '—'}
            </div>
          </div>
          {pedido.local_entrega && (
            <div style={{ flex: 1, minWidth: 200 }}>
              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700, marginBottom: 4 }}>Local de entrega</div>
              <div style={{ fontSize: 13 }}>{pedido.local_entrega}</div>
            </div>
          )}
        </div>
      </div>

      {/* KPIs */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 12, marginBottom: 14 }}>
        <div className="kpi-card">
          <div className="kpi-icon" style={{ background: 'var(--accent-glow)', color: 'var(--accent-light)' }}>
            <i className="ti ti-package"></i>
          </div>
          <div>
            <div className="kpi-label">BBs do pedido</div>
            <div className="kpi-value mono">{totalBBsPedido}</div>
          </div>
        </div>
        <div className="kpi-card">
          <div className="kpi-icon" style={{ background: 'var(--green-bg)', color: 'var(--green)' }}>
            <i className="ti ti-check"></i>
          </div>
          <div>
            <div className="kpi-label">Entregues / faturados</div>
            <div className="kpi-value mono">{totalEntregueBase}</div>
          </div>
        </div>
        <div className="kpi-card">
          <div className="kpi-icon" style={{ background: 'var(--blue-bg)', color: 'var(--blue)' }}>
            <i className="ti ti-truck-loading"></i>
          </div>
          <div>
            <div className="kpi-label">Em OE ativa</div>
            <div className="kpi-value mono">{totalEmOE}</div>
          </div>
        </div>
        <div className="kpi-card">
          <div className="kpi-icon" style={{ background: pedido.tem_saldo ? 'var(--orange-bg)' : 'var(--bg-card)', color: pedido.tem_saldo ? 'var(--orange)' : 'var(--text-muted)' }}>
            <i className="ti ti-clock"></i>
          </div>
          <div>
            <div className="kpi-label">Saldo aberto</div>
            <div className="kpi-value mono">{totalSaldoBB}</div>
          </div>
        </div>
        <div className="kpi-card">
          <div className="kpi-icon" style={{ background: 'var(--purple-bg, rgba(167,139,250,0.15))', color: 'var(--purple, #A78BFA)' }}>
            <i className="ti ti-cash"></i>
          </div>
          <div>
            <div className="kpi-label">Valor total</div>
            <div className="kpi-value mono" style={{ fontSize: 14 }}>{fmtMoney(valorTotalPedido)}</div>
            <div style={{ fontSize: 10, color: 'var(--text-muted)', marginTop: 2 }}>Aberto: <strong>{fmtMoney(pedido.saldo_aberto)}</strong></div>
          </div>
        </div>
      </div>

      {/* TABELA DE ITENS */}
      <div className="panel" style={{ marginBottom: 14 }}>
        <div className="panel-header">
          <div>
            <div className="panel-title">Itens do pedido</div>
            <div className="panel-sub">{pedido.itens.length} {pedido.itens.length === 1 ? 'item' : 'itens'} · clique numa linha para ver o detalhe</div>
          </div>
        </div>
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', minWidth: 1000 }}>
            <thead>
              <tr>
                <th>Código</th>
                <th>Descrição</th>
                <th>Cultivar</th>
                <th>Peneira</th>
                <th>UND</th>
                <th className="num">QTD pedida</th>
                <th className="num">Entregue</th>
                <th className="num">Em OE</th>
                <th className="num">Saldo</th>
                <th className="num">Vlr unit.</th>
                <th className="num">Total item</th>
              </tr>
            </thead>
            <tbody>
              {pedido.itens.map(it => {
                const entregue = it.qtd_entregue_total || it.qtd_entregue || 0;
                // Quanto deste item está em OE ativa
                let emOE = 0;
                oesVinculadas
                  .filter(oe => oe.status !== 'CANCELADA' && oe.status !== 'RASCUNHO' && !oe.faturada)
                  .forEach(oe => {
                    getParadas(oe).forEach(p => {
                      const ehDestePedido = p.pedido_numero === pedido.numero ||
                        (p.pedidos_numeros && p.pedidos_numeros.includes(pedido.numero));
                      if (!ehDestePedido) return;
                      p.itens.forEach(iOE => {
                        if (iOE.pedido_numero && iOE.pedido_numero !== pedido.numero) return;
                        if (iOE.codigo === it.codigo) emOE += iOE.qtd_bb;
                      });
                    });
                  });
                const totalItem = it.qtd_bb * it.valor_unitario;
                return (
                  <tr key={it.codigo}>
                    <td className="mono cell-primary">{it.codigo}</td>
                    <td style={{ fontSize: 12 }}>{it.descricao}</td>
                    <td style={{ fontSize: 12 }}>
                      {it.cultivar_nome || '—'}
                      {it.obtentor && <span style={{ color: 'var(--text-muted)', fontSize: 10, display: 'block' }}>{it.obtentor}</span>}
                    </td>
                    <td className="mono" style={{ fontSize: 11 }}>{it.peneira || it.tsi || '—'}</td>
                    <td className="mono" style={{ fontSize: 11 }}>{it.embalagem || it.unidade || '—'}</td>
                    <td className="num mono" style={{ fontWeight: 700 }}>{it.qtd_bb}</td>
                    <td className="num mono" style={{ color: entregue > 0 ? 'var(--green)' : 'var(--text-dim)' }}>{entregue}</td>
                    <td className="num mono" style={{ color: emOE > 0 ? 'var(--blue)' : 'var(--text-dim)' }}>{emOE}</td>
                    <td className="num mono" style={{ color: it.saldo > 0 ? 'var(--orange)' : 'var(--text-dim)', fontWeight: 700 }}>
                      {it.saldo === 0 && <i className="ti ti-check" style={{ marginRight: 3, color: 'var(--green)' }}></i>}
                      {it.saldo}
                    </td>
                    <td className="num mono cell-muted" style={{ fontSize: 11 }}>{fmtMoney(it.valor_unitario)}</td>
                    <td className="num mono cell-primary">{fmtMoney(totalItem)}</td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr style={{ background: 'var(--bg-card)', fontWeight: 700, borderTop: '2px solid var(--border-strong)' }}>
                <td colSpan="4" style={{ textAlign: 'right', padding: '10px 12px', color: 'var(--text-muted)', fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.05em' }}>TOTAIS</td>
                <td className="num mono" style={{ padding: '10px 12px' }}>{totalBBsPedido}</td>
                <td className="num mono" style={{ padding: '10px 12px', color: 'var(--green)' }}>{totalEntregueBase}</td>
                <td className="num mono" style={{ padding: '10px 12px', color: 'var(--blue)' }}>{totalEmOE}</td>
                <td className="num mono" style={{ padding: '10px 12px', color: 'var(--orange)', fontWeight: 800 }}>{totalSaldoBB}</td>
                <td></td>
                <td className="num mono cell-primary" style={{ padding: '10px 12px', fontSize: 13 }}>{fmtMoney(valorTotalPedido)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      {/* OEs VINCULADAS */}
      {oesVinculadas.length > 0 && (
        <div className="panel">
          <div className="panel-header">
            <div>
              <div className="panel-title">OEs vinculadas a este pedido</div>
              <div className="panel-sub">{oesVinculadas.length} {oesVinculadas.length === 1 ? 'OE' : 'OEs'} consomem este pedido</div>
            </div>
          </div>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', minWidth: 900 }}>
              <thead>
                <tr>
                  <th>OE</th>
                  <th>Data prevista</th>

                      <td className="num mono" style={{ fontWeight: 700 }}>{cons.bb}</td>
                      <td className="num mono cell-primary" style={{ fontSize: 11 }}>{fmtMoney(cons.valor)}</td>

                      <td className="mono" style={{ fontSize: 11 }}>{oe.veiculo_placa ? `${oe.veiculo_placa}${oe.veiculo_placa_uf ? '/' + oe.veiculo_placa_uf : ''}` : '—'}</td>
                      <td style={{ color: 'var(--text-dim)', textAlign: 'right', paddingRight: 12 }}>
                        <i className="ti ti-chevron-right"></i>
                      </td>
                    </tr>

            </table>
          </div>
        </div>
      )}

      {oesVinculadas.length === 0 && (
        <div className="empty" style={{ padding: 30 }}>
          <i className="ti ti-truck-off"></i>
          <div style={{ fontSize: 13, color: 'var(--text)' }}>Nenhuma OE criada para este pedido ainda</div>
          {ctx.podeEditar && pedido.tem_saldo && (
            <button
              className="btn btn-primary"
              style={{ marginTop: 12 }}
              onClick={() => {
                ctx.setEditingOE({ pedido_numero: pedido.numero, cliente: pedido.cliente });
                ctx.setScreen('nova-oe');
              }}
            >
              <i className="ti ti-plus"></i> Criar primeira OE
            </button>
          )}
        </div>
      )}
    </div>
  );
};

// ============================================================
// TRIANGULARES — fluxo simplificado em 3 etapas
// Etapa 1: Agendamento (já vem pronto da criação da OE)
// Etapa 2: Troca de nota (registra NF do fornecedor)
// Etapa 3: Liberação (horário saída + observações)
// ============================================================
// ============================================================
// Validação da CHAVE DE ACESSO da NF-e (44 dígitos) — offline.
// Confere tamanho + dígito verificador (módulo 11) e extrai UF, data,
// CNPJ do emitente, modelo, série e número. Permite cruzar o CNPJ da
// chave com o CNPJ do fornecedor para pegar erro de digitação.
// ============================================================
const UF_COD_NFE = { '11':'RO','12':'AC','13':'AM','14':'RR','15':'PA','16':'AP','17':'TO','21':'MA','22':'PI','23':'CE','24':'RN','25':'PB','26':'PE','27':'AL','28':'SE','29':'BA','31':'MG','32':'ES','33':'RJ','35':'SP','41':'PR','42':'SC','43':'RS','50':'MS','51':'MT','52':'GO','53':'DF' };
function validarChaveNFe(chaveRaw, cnpjFornecedor) {
  const chave = (chaveRaw || '').replace(/\D/g, '');
  if (!chave) return { vazio: true, valido: false, erros: [], info: {}, chave: '' };
  const erros = [];
  if (chave.length !== 44) erros.push(`Tem ${chave.length} dígito(s) — a chave precisa de 44`);
  const info = {};
  if (chave.length === 44) {
    // Dígito verificador (módulo 11, pesos 2..9 da direita p/ esquerda)
    const base = chave.slice(0, 43);
    let peso = 2, soma = 0;
    for (let i = base.length - 1; i >= 0; i--) { soma += parseInt(base[i], 10) * peso; peso = peso === 9 ? 2 : peso + 1; }
    const resto = soma % 11;
    const dvCalc = (resto === 0 || resto === 1) ? 0 : 11 - resto;
    if (dvCalc !== parseInt(chave[43], 10)) erros.push('Dígito verificador inválido (provável erro de digitação)');
    // Extrai os campos da chave
    info.uf = UF_COD_NFE[chave.slice(0, 2)] || chave.slice(0, 2);
    info.emissao = `${chave.slice(4, 6)}/20${chave.slice(2, 4)}`;
    info.cnpj = chave.slice(6, 20);
    info.cnpjFmt = info.cnpj.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
    info.modelo = chave.slice(20, 22);
    info.serie = String(parseInt(chave.slice(22, 25), 10));
    info.numero = String(parseInt(chave.slice(25, 34), 10));
    if (info.modelo !== '55' && info.modelo !== '65') erros.push(`Modelo ${info.modelo} não é NF-e (55) nem NFC-e (65)`);
    if (cnpjFornecedor) {
      const cf = (cnpjFornecedor || '').replace(/\D/g, '');
      if (cf.length === 14) {
        info.cnpjConfere = cf === info.cnpj;
        if (!info.cnpjConfere) erros.push('CNPJ da chave ≠ CNPJ do fornecedor selecionado');
      }
    }
  }
  return { vazio: false, valido: erros.length === 0 && chave.length === 44, erros, info, chave };
}

const Triangulares = ({ ctx }) => {
  const [filtroAba, setFiltroAba] = useState('ATIVAS'); // ATIVAS, NOTA_PENDENTE, AGUARDA_LIB, LIBERADAS_HOJE
  const [oeAberta, setOeAberta] = useState(null); // OE selecionada para fluxo
  const [etapaForm, setEtapaForm] = useState(2); // 1, 2 ou 3

  // Formulários (estado controlado da modal)
  const [nfFornecedor, setNfFornecedor] = useState('');
  const [nfChave, setNfChave] = useState('');
  const [nfData, setNfData] = useState(todayISO());
  const [nfValor, setNfValor] = useState('');
  const [qtdsConferem, setQtdsConferem] = useState(true);
  const [obsNF, setObsNF] = useState('');

  const [horaSaida, setHoraSaida] = useState('');
  const [obsLiberacao, setObsLiberacao] = useState('');

  // Helpers
  const ehHoje = (dataISO) => {
    if (!dataISO) return false;
    const d = new Date(dataISO);
    const h = new Date();
    return d.getFullYear() === h.getFullYear() && d.getMonth() === h.getMonth() && d.getDate() === h.getDate();
  };

  // Filtra só triangulares
  const triangulares = ctx.state.ordens.filter(o => o.modalidade === 'TRIANGULAR');
  const aguardandoNF = triangulares.filter(o => o.status === 'PROGRAMADA');
  const aguardandoLib = triangulares.filter(o => o.status === 'NOTA_TROCADA');
  const liberadasHoje = triangulares.filter(o =>
    ['EMBARCADA', 'EM_TRANSITO', 'ENTREGUE'].includes(o.status) && ehHoje(o.embarcada_em)
  );

  const lista = useMemo(() => {
    if (filtroAba === 'NOTA_PENDENTE') return aguardandoNF;
    if (filtroAba === 'AGUARDA_LIB') return aguardandoLib;
    if (filtroAba === 'LIBERADAS_HOJE') return liberadasHoje;
    return [...aguardandoNF, ...aguardandoLib];
  }, [filtroAba, aguardandoNF.length, aguardandoLib.length, liberadasHoje.length]);

  const cnt = {
    ativas: aguardandoNF.length + aguardandoLib.length,
    notaPendente: aguardandoNF.length,
    aguardaLib: aguardandoLib.length,
    liberadasHoje: liberadasHoje.length
  };

  // CNPJ do fornecedor selecionado (cruza com o CNPJ embutido na chave da NF-e)
  const fornCnpjTriang = (() => {
    if (!oeAberta) return '';
    const lista = DADOS_FORNECEDORES || [];
    const f = lista.find(x => x.codigo === oeAberta.fornecedor_codigo) || lista.find(x => x.nome === oeAberta.fornecedor_nome);
    return f ? (f.cnpj || '') : '';
  })();
  const chaveInfo = validarChaveNFe(nfChave, fornCnpjTriang);

  // Abrir fluxo de uma OE
  const abrirFluxo = (oe) => {
    setOeAberta(oe);
    // Pré-popula formulários se já existirem dados parciais
    setNfFornecedor(oe.nf_fornecedor || '');
    setNfChave(oe.nf_fornecedor_chave || '');
    setNfData(oe.nf_fornecedor_data || todayISO());
    setNfValor(oe.nf_fornecedor_valor || '');
    setQtdsConferem(oe.nf_qtds_conferem !== false);
    setObsNF(oe.nf_observacao || '');
    setHoraSaida(oe.hora_saida || new Date().toTimeString().slice(0, 5));
    setObsLiberacao(oe.obs_liberacao || '');
    // Decide etapa inicial: se aguardando NF → etapa 2; se NF feita → etapa 3
    if (oe.status === 'PROGRAMADA') setEtapaForm(2);
    else if (oe.status === 'NOTA_TROCADA') setEtapaForm(3);
    else setEtapaForm(1);
  };

  const fecharFluxo = () => {
    setOeAberta(null);
  };

  // Confirma etapa 2 (NF do fornecedor)
  const confirmarNF = () => {
    if (!nfFornecedor.trim()) {
      alert('Informe o número da NF do fornecedor antes de continuar.');
      return;
    }
    if (!qtdsConferem) {
      if (!confirm('As quantidades NÃO conferem com o pedido.\n\nDeseja registrar mesmo assim? Recomenda-se NÃO liberar até resolver com o fornecedor.')) return;
    }
    ctx.atualizarOE(oeAberta.id, {
      status: 'NOTA_TROCADA',
      nf_fornecedor: nfFornecedor.trim(),
      nf_fornecedor_chave: (nfChave || '').replace(/\D/g, ''),
      nf_fornecedor_data: nfData,
      nf_fornecedor_valor: nfValor || null,
      nf_qtds_conferem: qtdsConferem,
      nf_observacao: obsNF.trim(),
      nf_trocada_em: new Date().toISOString(),
      nf_trocada_por: ctx.perfilAtivo
    });
    // Atualiza a OE local pra refletir (status + dados da NF) sem precisar reabrir
    setOeAberta(o => ({
      ...o,
      status: 'NOTA_TROCADA',
      nf_fornecedor: nfFornecedor.trim(),
      nf_fornecedor_chave: (nfChave || '').replace(/\D/g, ''),
      nf_fornecedor_data: nfData,
      nf_fornecedor_valor: nfValor || null,
      nf_qtds_conferem: qtdsConferem
    }));
    setEtapaForm(3);
  };

  // Confirma etapa 3 (Liberação)
  const confirmarLiberacao = () => {
    // Trava: só libera depois que a NF do fornecedor foi registrada (etapa 2).
    if (!oeAberta.nf_fornecedor || oeAberta.status === 'PROGRAMADA') {

      setEtapaForm(2);
      return;
    }
    if (!horaSaida) {
      alert('Informe o horário de saída do veículo.');
      return;
    }
    ctx.atualizarOE(oeAberta.id, {
      status: 'EMBARCADA',
      embarcada_em: new Date().toISOString(),
      hora_saida: horaSaida,
      obs_liberacao: obsLiberacao.trim(),
      liberado_em: new Date().toISOString(),
      liberado_por: ctx.perfilAtivo
    });
    fecharFluxo();
  };

  // Estilo aba
  const abaStyle = (id, cor) => ({
    background: filtroAba === id ? (cor || 'var(--bg-hover)') : 'transparent',
    color: filtroAba === id ? 'var(--text)' : 'var(--text-muted)',

    padding: '8px 14px',
    fontSize: 12,
    fontFamily: 'inherit',
    cursor: 'pointer',
    fontWeight: 600,
    borderBottom: '2px solid ' + (filtroAba === id ? (cor || 'var(--accent)') : 'transparent'),
    display: 'flex',
    alignItems: 'center',
    gap: 6
  });

  const Badge = ({ children, active, cor }) => (
    <span style={{
      background: active ? (cor || 'var(--accent)') : 'var(--bg-card)',
      color: active ? 'white' : 'var(--text-muted)',
      fontSize: 10, fontWeight: 700, padding: '1px 6px', borderRadius: 8,
      fontFamily: 'JetBrains Mono, monospace'
    }}>{children}</span>
  );

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb"><i className="ti ti-home"></i> Operação · Triangulares</div>
          <h1 className="page-title">Operações triangulares</h1>
          <p className="page-subtitle">Fluxo simplificado: <strong>agendamento → troca de nota → liberação</strong></p>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <span className="chip chip-blue"><i className="ti ti-arrows-shuffle"></i> Fornecedor → Cliente</span>
        </div>
      </div>

      {/* KPIs */}
      <div className="metrics">
        <div className="metric">
          <div className="metric-label"><i className="ti ti-file-invoice"></i> Aguardando NF</div>
          <div className="metric-value" style={{ color: 'var(--orange)' }}>{cnt.notaPendente}</div>
          <div className="metric-delta">Esperando nota do fornecedor</div>
        </div>
        <div className="metric">
          <div className="metric-label"><i className="ti ti-truck"></i> Aguardando liberação</div>
          <div className="metric-value" style={{ color: 'var(--blue)' }}>{cnt.aguardaLib}</div>
          <div className="metric-delta">NF trocada, falta liberar saída</div>
        </div>
        <div className="metric">
          <div className="metric-label"><i className="ti ti-check"></i> Liberadas hoje</div>
          <div className="metric-value" style={{ color: 'var(--green)' }}>{cnt.liberadasHoje}</div>
          <div className="metric-delta">Veículos liberados no dia</div>
        </div>
        <div className="metric">
          <div className="metric-label"><i className="ti ti-arrows-shuffle"></i> Total triangulares</div>
          <div className="metric-value">{triangulares.length}</div>
          <div className="metric-delta">Histórico geral</div>
        </div>
      </div>

      {/* Painel principal */}
      <div className="panel">
        <div className="panel-header" style={{ padding: 0, borderBottom: '1px solid var(--border)' }}>
          <div style={{ display: 'flex', gap: 0, padding: '0 4px', flex: 1, overflowX: 'auto' }}>
            <button onClick={() => setFiltroAba('ATIVAS')} style={abaStyle('ATIVAS', 'var(--accent)')}>
              <i className="ti ti-list-check"></i> Ativas
              <Badge active={filtroAba === 'ATIVAS'} cor="var(--accent)">{cnt.ativas}</Badge>
            </button>
            <button onClick={() => setFiltroAba('NOTA_PENDENTE')} style={abaStyle('NOTA_PENDENTE', 'var(--orange)')}>
              <i className="ti ti-file-invoice"></i> Aguardando NF
              <Badge active={filtroAba === 'NOTA_PENDENTE'} cor="var(--orange)">{cnt.notaPendente}</Badge>
            </button>
            <button onClick={() => setFiltroAba('AGUARDA_LIB')} style={abaStyle('AGUARDA_LIB', 'var(--blue)')}>
              <i className="ti ti-truck"></i> Aguardando liberação
              <Badge active={filtroAba === 'AGUARDA_LIB'} cor="var(--blue)">{cnt.aguardaLib}</Badge>
            </button>
            <button onClick={() => setFiltroAba('LIBERADAS_HOJE')} style={abaStyle('LIBERADAS_HOJE', 'var(--green)')}>
              <i className="ti ti-check"></i> Liberadas hoje
              <Badge active={filtroAba === 'LIBERADAS_HOJE'} cor="var(--green)">{cnt.liberadasHoje}</Badge>
            </button>
          </div>
        </div>

        {lista.length === 0 ? (
          <div className="empty" style={{ padding: 40 }}>
            <i className="ti ti-arrows-shuffle"></i>
            <div style={{ fontSize: 14, color: 'var(--text)', marginBottom: 4 }}>
