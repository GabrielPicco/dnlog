// CALENDÁRIO DE EMBARQUES
// ============================================================
const Calendario = ({ ctx }) => {
  const [data, setData] = useState(new Date());
  const [diaSelecionado, setDiaSelecionado] = useState(null);

  const ano = data.getFullYear();
  const mes = data.getMonth();
  const primeiroDia = new Date(ano, mes, 1).getDay();
  const diasNoMes = new Date(ano, mes + 1, 0).getDate();
  const diasMesAnterior = new Date(ano, mes, 0).getDate();
  const hoje = todayISO();

  const eventos = useMemo(() => {
    const map = {};
    ctx.state.ordens.forEach(oe => {
      if (oe.status === 'CANCELADA') return;
      const dt = oe.data_prevista;
      if (!dt) return;
      if (!map[dt]) map[dt] = [];
      map[dt].push(oe);
    });
    return map;
  }, [ctx.state.ordens]);

  const cells = [];
  // dias do mês anterior
  for (let i = primeiroDia - 1; i >= 0; i--) {
    cells.push({ day: diasMesAnterior - i, otherMonth: true, date: null });
  }
  // dias do mês atual
  for (let i = 1; i <= diasNoMes; i++) {
    const iso = `${ano}-${String(mes+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    cells.push({ day: i, otherMonth: false, date: iso });
  }
  // completar última semana
  while (cells.length % 7 !== 0) {
    cells.push({ day: cells.length - (primeiroDia + diasNoMes) + 1, otherMonth: true, date: null });
  }

  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  const eventColor = (status) => ({
    'PROGRAMADA': 'cev-blue',
    'EM_CONFERENCIA': 'cev-orange',
    'EMBARCADA': 'cev-purple',
    'EM_TRANSITO': 'cev-purple',
    'ENTREGUE': 'cev-green'
  })[status] || 'cev-blue';

  const navegar = (delta) => {
    const d = new Date(data);
    d.setMonth(d.getMonth() + delta);
    setData(d);
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb"><i className="ti ti-home"></i> Operação · Calendário</div>
          <h1 className="page-title">Calendário de embarques</h1>
          <p className="page-subtitle">Programação de saídas por dia · clique em uma OE para ver detalhes</p>
        </div>
        <button className="btn btn-primary" onClick={() => { ctx.setEditingOE(null); ctx.setScreen('nova-oe'); }}>
          <i className="ti ti-plus"></i> Nova OE
        </button>
      </div>

      <div className="calendar">
        <div className="calendar-header">
          <div className="calendar-nav">
            <button onClick={() => navegar(-1)}><i className="ti ti-chevron-left"></i></button>
            <span className="calendar-month">{meses[mes]} {ano}</span>
            <button onClick={() => navegar(1)}><i className="ti ti-chevron-right"></i></button>
            <button onClick={() => setData(new Date())} style={{ width: 'auto', padding: '0 12px', fontSize: 12, marginLeft: 8 }}>Hoje</button>
          </div>
          <div style={{ display: 'flex', gap: 12, fontSize: 11, color: 'var(--text-muted)' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><div style={{ width: 10, height: 10, borderRadius: 2, background: 'var(--blue)' }}></div> Programada</span>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><div style={{ width: 10, height: 10, borderRadius: 2, background: 'var(--orange)' }}></div> Conferência</span>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><div style={{ width: 10, height: 10, borderRadius: 2, background: 'var(--purple)' }}></div> Em rota</span>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><div style={{ width: 10, height: 10, borderRadius: 2, background: 'var(--green)' }}></div> Entregue</span>
          </div>
        </div>

        <div className="calendar-grid">
          {['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(d => (
            <div key={d} className="calendar-dayhead">{d}</div>
          ))}
          {cells.map((c, idx) => {
            const evs = c.date ? (eventos[c.date] || []) : [];
            return (
              <div
                key={idx}
                className={`calendar-cell ${c.otherMonth ? 'other-month' : ''} ${c.date === hoje ? 'today' : ''}`}
                onClick={() => c.date && setDiaSelecionado(c.date)}
              >
                <div className="calendar-day-num">{c.day}</div>
                <div className="calendar-events">
                  {evs.slice(0,3).map(oe => (
                    <div
                      key={oe.id}
                      className={`calendar-event ${eventColor(oe.status)}`}
                      onClick={(e) => { e.stopPropagation(); ctx.setViewingOE(oe); ctx.setScreen('detalhe-oe'); }}
                      title={`${oe.numero} · ${oe.cliente}`}
                    >
                      {oe.hora_prevista || ''} {oe.cliente.split(' ')[0]}
                    </div>
                  ))}
                  {evs.length > 3 && (
                    <div style={{ fontSize: 10, color: 'var(--text-muted)', padding: '1px 4px' }}>
                      +{evs.length - 3} mais
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {diaSelecionado && (
        <div className="modal-backdrop" onClick={() => setDiaSelecionado(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <div style={{ fontSize: 15, fontWeight: 700 }}>Embarques de {fmtDate(diaSelecionado)}</div>
                <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>
                  {(eventos[diaSelecionado] || []).length} OE{(eventos[diaSelecionado] || []).length !== 1 ? 's' : ''} programada{(eventos[diaSelecionado] || []).length !== 1 ? 's' : ''}
                </div>
              </div>
              <button className="btn btn-ghost" style={{ padding: '4px 8px' }} onClick={() => setDiaSelecionado(null)}>
                <i className="ti ti-x"></i>
              </button>
            </div>
            <div className="modal-body">
              {(eventos[diaSelecionado] || []).length === 0 ? (
                <div className="empty">
                  <i className="ti ti-calendar-off"></i>
                  <div>Nenhuma OE para esta data</div>
                </div>
              ) : (
                (eventos[diaSelecionado] || []).map(oe => (
                  <div
                    key={oe.id}
                    onClick={() => { ctx.setViewingOE(oe); ctx.setScreen('detalhe-oe'); setDiaSelecionado(null); }}
                    style={{
                      padding: 14, border: '1px solid var(--border)', borderRadius: 8, marginBottom: 8,
                      cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12
                    }}
                  >
                    <div style={{ flex: 1 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
                        <span className="mono cell-primary">{oe.numero}</span>
                        <StatusChip status={oe.status} />
                      </div>
                      <div style={{ fontSize: 13 }}>{oe.cliente}</div>
                      <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }}>
                        {oe.hora_prevista} · {oe.motorista_nome} · {oe.veiculo_placa} · {totalBBs(oe)} un.
                      </div>
                    </div>
                    <i className="ti ti-chevron-right" style={{ color: 'var(--text-dim)' }}></i>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ============================================================
// CONFERÊNCIA (FILA)
// ============================================================
const Conferencia = ({ ctx }) => {
  const [filtroAba, setFiltroAba] = useState('FILA'); // FILA (aguardando+em_conf), AGUARDANDO, EM_CONF, CONFERIDAS, TODAS

  // Função: a OE foi conferida HOJE? (baseado em embarcada_em)
  const ehHoje = (dataISO) => {
    if (!dataISO) return false;
    const d = new Date(dataISO);
    const h = new Date();
    return d.getFullYear() === h.getFullYear() && d.getMonth() === h.getMonth() && d.getDate() === h.getDate();
  };

  // Listas base — exclui triangulares (são auto-conferidas pelo fornecedor)
  const todasOrdens = ctx.state.ordens.filter(o => o.modalidade !== 'TRIANGULAR');
  const ordensAguardando = todasOrdens.filter(o => o.status === 'PROGRAMADA');
  const ordensEmConf = todasOrdens.filter(o => o.status === 'EM_CONFERENCIA');
  const ordensConferidasHoje = todasOrdens.filter(o =>
    ['EMBARCADA', 'EM_TRANSITO', 'ENTREGUE'].includes(o.status) && ehHoje(o.embarcada_em)
  );

  // Lista exibida conforme aba ativa
  const lista = useMemo(() => {
    if (filtroAba === 'AGUARDANDO') return ordensAguardando;
    if (filtroAba === 'EM_CONF') return ordensEmConf;
    if (filtroAba === 'CONFERIDAS') return ordensConferidasHoje;
    if (filtroAba === 'TODAS') return [...ordensAguardando, ...ordensEmConf, ...ordensConferidasHoje];
    // FILA padrão: aguardando + em conferência
    return [...ordensAguardando, ...ordensEmConf];
  }, [filtroAba, ordensAguardando, ordensEmConf, ordensConferidasHoje]);

  // Contagens pra mostrar nas abas
  const cnt = {
    fila: ordensAguardando.length + ordensEmConf.length,
    aguardando: ordensAguardando.length,
    emConf: ordensEmConf.length,
    conferidas: ordensConferidasHoje.length,
    todas: ordensAguardando.length + ordensEmConf.length + ordensConferidasHoje.length
  };

  // Estilo da aba
  const abaStyle = (id, cor) => ({
    background: filtroAba === id ? (cor || 'var(--bg-hover)') : 'transparent',
    color: filtroAba === id ? 'var(--text)' : 'var(--text-muted)',
    border: 'none',
    padding: '8px 14px',
    fontSize: 12,
    fontFamily: 'inherit',
    cursor: 'pointer',
    fontWeight: 600,
    borderBottom: '2px solid ' + (filtroAba === id ? (cor || 'var(--accent)') : 'transparent'),
    display: 'flex',
    alignItems: 'center',
    gap: 6
  });

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb"><i className="ti ti-home"></i> Operação · Conferência</div>
          <h1 className="page-title">Conferência de embarques</h1>
          <p className="page-subtitle">Checagem física e coleta de amostra · interface otimizada para tablet</p>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <span className="chip chip-green"><span className="status-dot"></span> Tempo real</span>
        </div>
      </div>

      <div className="metrics">
        <div className="metric">
          <div className="metric-label"><i className="ti ti-clock"></i> Aguardando</div>
          <div className="metric-value" style={{ color: 'var(--orange)' }}>{cnt.aguardando}</div>
          <div className="metric-delta">OEs prontas para checar</div>
        </div>
        <div className="metric">
          <div className="metric-label"><i className="ti ti-loader"></i> Em conferência</div>
          <div className="metric-value" style={{ color: 'var(--blue)' }}>{cnt.emConf}</div>
          <div className="metric-delta">Conferentes ativos</div>
        </div>
        <div className="metric">
          <div className="metric-label"><i className="ti ti-check"></i> Conferidas hoje</div>
          <div className="metric-value" style={{ color: 'var(--green)' }}>{cnt.conferidas}</div>
          <div className="metric-delta">Liberadas no dia</div>
        </div>
        <div className="metric">
          <div className="metric-label"><i className="ti ti-flask"></i> Amostras</div>
          <div className="metric-value">{ctx.state.ordens.filter(o => o.amostra_coletada).length}</div>
          <div className="metric-delta">Total no histórico</div>
        </div>
      </div>

      <div className="panel">
        <div className="panel-header" style={{ padding: 0, borderBottom: '1px solid var(--border)' }}>
          {/* Abas de filtro */}
          <div style={{ display: 'flex', gap: 0, padding: '0 4px', flex: 1, overflowX: 'auto' }}>
            <button onClick={() => setFiltroAba('FILA')} style={abaStyle('FILA', 'var(--accent)')}>
              <i className="ti ti-list-check"></i> Fila do dia
              <span style={{
                background: filtroAba === 'FILA' ? 'var(--accent)' : 'var(--bg-card)',
                color: filtroAba === 'FILA' ? 'white' : 'var(--text-muted)',
                fontSize: 10, fontWeight: 700, padding: '1px 6px', borderRadius: 8,
                fontFamily: 'JetBrains Mono, monospace'
              }}>{cnt.fila}</span>
            </button>
            <button onClick={() => setFiltroAba('AGUARDANDO')} style={abaStyle('AGUARDANDO', 'var(--orange)')}>
              <i className="ti ti-clock"></i> Aguardando
              <span style={{
                background: filtroAba === 'AGUARDANDO' ? 'var(--orange)' : 'var(--bg-card)',
                color: filtroAba === 'AGUARDANDO' ? 'white' : 'var(--text-muted)',
                fontSize: 10, fontWeight: 700, padding: '1px 6px', borderRadius: 8,
                fontFamily: 'JetBrains Mono, monospace'
              }}>{cnt.aguardando}</span>
            </button>
            <button onClick={() => setFiltroAba('EM_CONF')} style={abaStyle('EM_CONF', 'var(--blue)')}>
              <i className="ti ti-loader"></i> Em conferência
              <span style={{
                background: filtroAba === 'EM_CONF' ? 'var(--blue)' : 'var(--bg-card)',
                color: filtroAba === 'EM_CONF' ? 'white' : 'var(--text-muted)',
                fontSize: 10, fontWeight: 700, padding: '1px 6px', borderRadius: 8,
                fontFamily: 'JetBrains Mono, monospace'
              }}>{cnt.emConf}</span>
            </button>
            <button onClick={() => setFiltroAba('CONFERIDAS')} style={abaStyle('CONFERIDAS', 'var(--green)')}>
              <i className="ti ti-check"></i> Conferidas hoje
              <span style={{
                background: filtroAba === 'CONFERIDAS' ? 'var(--green)' : 'var(--bg-card)',
                color: filtroAba === 'CONFERIDAS' ? 'white' : 'var(--text-muted)',
                fontSize: 10, fontWeight: 700, padding: '1px 6px', borderRadius: 8,
                fontFamily: 'JetBrains Mono, monospace'
              }}>{cnt.conferidas}</span>
            </button>
            <button onClick={() => setFiltroAba('TODAS')} style={abaStyle('TODAS')}>
              <i className="ti ti-list"></i> Todas do dia
              <span style={{
                background: filtroAba === 'TODAS' ? 'var(--text-muted)' : 'var(--bg-card)',
                color: filtroAba === 'TODAS' ? 'white' : 'var(--text-muted)',
                fontSize: 10, fontWeight: 700, padding: '1px 6px', borderRadius: 8,
                fontFamily: 'JetBrains Mono, monospace'
              }}>{cnt.todas}</span>
            </button>
          </div>
        </div>
        {lista.length === 0 ? (
          <div className="empty" style={{ padding: 40 }}>
            <i className={`ti ${filtroAba === 'CONFERIDAS' ? 'ti-clipboard-off' : 'ti-clipboard-check'}`}></i>
            <div style={{ fontSize: 14, color: 'var(--text)', marginBottom: 4 }}>
              {filtroAba === 'CONFERIDAS' && 'Nenhuma OE conferida hoje ainda'}
              {filtroAba === 'AGUARDANDO' && 'Nenhuma OE aguardando'}
              {filtroAba === 'EM_CONF' && 'Nenhuma OE em conferência no momento'}
              {filtroAba === 'FILA' && 'Fila vazia · nenhuma OE pra conferir'}
              {filtroAba === 'TODAS' && 'Nenhuma OE no dia'}
            </div>
            <div style={{ fontSize: 12 }}>
              {filtroAba === 'CONFERIDAS' ? 'Quando uma OE for liberada, ela aparece aqui.' : 'Quando uma OE for criada como "Programada", aparece aqui.'}
            </div>
          </div>
        ) : (
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', minWidth: 980 }}>
              <thead>
                <tr>
                  <th>OE</th>
                  <th>Status</th>
                  <th>Cliente(s)</th>
                  <th>Motorista</th>
                  <th>Placa</th>
                  <th className="num">Qtd</th>
                  <th>Data prevista</th>
                  <th>Doca</th>
                  <th style={{ width: 130 }}>Ação</th>
                </tr>
              </thead>
              <tbody>
                {lista.map(oe => {
                  const paradas = getParadas(oe);
                  const isProgramada = oe.status === 'PROGRAMADA';
                  const isEmConf = oe.status === 'EM_CONFERENCIA';
                  const isConferida = ['EMBARCADA', 'EM_TRANSITO', 'ENTREGUE'].includes(oe.status);
                  const iniciar = () => {
                    if (isConferida) {
                      // Já conferida → só visualizar
                      ctx.setViewingOE(oe);
                      ctx.setScreen('detalhe-oe');
                      return;
                    }
                    if (isProgramada) {
                      ctx.atualizarOE(oe.id, { status: 'EM_CONFERENCIA', em_conferencia_em: new Date().toISOString() });
                    }
                    ctx.setConferenceOE(oe);
                    ctx.setScreen('conferencia-detalhe');
                  };
                  return (
                    <tr key={oe.id} onClick={iniciar} style={{ cursor: 'pointer', opacity: isConferida ? 0.85 : 1 }}>
                      <td className="mono cell-primary" style={{ fontWeight: 700 }}>{oe.numero}</td>
                      <td>
                        {isProgramada && <span className="chip chip-orange" style={{ fontSize: 10 }}><i className="ti ti-clock"></i> Aguardando</span>}
                        {isEmConf && <span className="chip chip-blue" style={{ fontSize: 10 }}><i className="ti ti-loader"></i> Em conferência</span>}
                        {isConferida && (
                          <span className="chip" style={{ background: 'var(--green-bg)', color: 'var(--green)', fontSize: 10, fontWeight: 700 }}>
                            <i className="ti ti-check"></i> {oe.status === 'EMBARCADA' ? 'Embarcada' : oe.status === 'EM_TRANSITO' ? 'Em trânsito' : 'Entregue'}
                          </span>
                        )}
                      </td>
                      <td style={{ fontSize: 12 }}>
                        {paradas.length === 1 ? paradas[0].cliente : (
                          <span>
                            <strong>{paradas[0].cliente}</strong>
                            <span style={{ color: 'var(--text-muted)', fontSize: 11 }}> +{paradas.length - 1} parada{paradas.length > 2 ? 's' : ''}</span>
                          </span>
                        )}
                      </td>
                      <td style={{ fontSize: 11 }}>{oe.motorista_nome || '—'}</td>
                      <td className="mono" style={{ fontSize: 11 }}>
                        {oe.veiculo_placa ? `${oe.veiculo_placa}${oe.veiculo_placa_uf ? '/' + oe.veiculo_placa_uf : ''}` : '—'}
                      </td>
                      <td className="num mono" style={{ fontWeight: 700 }}>{totalBBs(oe)}</td>
                      <td className="mono cell-muted" style={{ fontSize: 11 }}>
                        {isConferida && oe.embarcada_em
                          ? <>Conferida às <strong style={{ color: 'var(--text)' }}>{fmtDateTime(oe.embarcada_em).split(' ')[1] || ''}</strong></>
                          : <>{fmtDate(oe.data_prevista)} <span style={{ color: 'var(--text-dim)' }}>{oe.hora_prevista}</span></>
                        }
                      </td>
                      <td style={{ fontSize: 11 }}>{oe.doca || '—'}</td>
                      <td onClick={e => e.stopPropagation()}>
                        <button
                          className={`btn ${isConferida ? 'btn-ghost' : 'btn-primary'}`}
                          style={{ width: '100%', justifyContent: 'center', padding: '5px 8px', fontSize: 11 }}
                          onClick={iniciar}
                        >
                          <i className={`ti ${isProgramada ? 'ti-player-play' : isEmConf ? 'ti-device-tablet' : 'ti-eye'}`}></i>
                          {isProgramada ? ' Iniciar' : isEmConf ? ' Continuar' : ' Ver'}
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
};

// ============================================================
// CONFERÊNCIA - DETALHE
// ============================================================
const ConferenciaDetalhe = ({ ctx }) => {
  const oeInicial = ctx.conferenceOE;
  if (!oeInicial) return <div className="empty"><i className="ti ti-alert-circle"></i><div>OE não selecionada</div></div>;
  const oe = ctx.state.ordens.find(o => o.id === oeInicial.id) || oeInicial;
  // Em paradas com itens de controle paralelo (manual), o conferente não confere
  // pois o lote foi conferido pelo fornecedor. Auto-marcar esses itens como conferidos.
  const allItensComKey = useMemo(() => {
    const paradasL = getParadas(oe);
    const lista = [];
    paradasL.forEach((p, paradaIdx) => {
      p.itens.forEach((it, itIdx) => {
        const key = `p${paradaIdx}_i${itIdx}`;
        const isControleParalelo = it.lotes_alocados && it.lotes_alocados.length > 0 &&
                                   it.lotes_alocados.every(la => la.controle_paralelo);
        lista.push({ key, parada: p, paradaIdx, item: it, itemIdx: itIdx, isControleParalelo });
      });
    });
    return lista;
  }, [oe]);

  // Inicializa: marca todos os itens de controle paralelo como conferidos automaticamente
  const [lotesConferidos, setLotesConferidos] = useState(() => {
    const inicial = { ...(oe.lotes_conferidos || {}) };
    allItensComKey.forEach(({ key, isControleParalelo }) => {
      if (isControleParalelo) inicial[key] = true;
    });
    return inicial;
  });

  const [fotos, setFotos] = useState(oe.fotos_carga || (oe.foto_carga ? ['placeholder'] : []));
  const foto = fotos.length > 0;  // mantém compat para validação
  const setFoto = () => {};       // legado, não faz nada
  const fotoInputRef = useRef(null);

  const handleCapturarFoto = () => {
    if (fotoInputRef.current) fotoInputRef.current.click();
  };

  const handleArquivoFoto = (e) => {
    const arquivos = Array.from(e.target.files || []);
    if (arquivos.length === 0) return;
    // Lê cada arquivo, redimensiona para evitar localStorage gigante e adiciona ao array
    arquivos.forEach(arquivo => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          // Redimensiona pra max 1200px lateral (qualidade boa, tamanho razoável)
          const MAX_LADO = 1200;
          let { width, height } = img;
          if (width > MAX_LADO || height > MAX_LADO) {
            if (width > height) { height = (height / width) * MAX_LADO; width = MAX_LADO; }
            else { width = (width / height) * MAX_LADO; height = MAX_LADO; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
          setFotos(prev => [...prev, { dataUrl, timestamp: new Date().toISOString() }]);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(arquivo);
    });
    e.target.value = ''; // permite escolher o mesmo arquivo de novo
  };

  const removerFoto = (idx) => {
    if (!confirm('Remover esta foto?')) return;
    setFotos(prev => prev.filter((_, i) => i !== idx));
  };
  const [amostra, setAmostra] = useState(oe.amostra_coletada || false);
  const [obs, setObs] = useState(oe.obs_conferencia || '');
  // Mapa de carga (posições dos BBs no caminhão)
  const [mapaCarga, setMapaCarga] = useState(oe.mapa_carga || null);
  const [paintMode, setPaintMode] = useState(null);
  const handleMapaChange = (novoMapa, novoPaintMode) => {
    setMapaCarga(novoMapa);
    if (novoPaintMode !== undefined) setPaintMode(novoPaintMode);
  };

  const totalItens = allItensComKey.length;
  const itensQueExigemConferencia = allItensComKey.filter(i => !i.isControleParalelo).length;
  const conferidosCount = allItensComKey.filter(i => lotesConferidos[i.key]).length;
  const progressoPct = totalItens > 0 ? (conferidosCount / totalItens) * 100 : 0;
  const podeFinalizar = conferidosCount === totalItens && foto && amostra;

  const finalizar = () => {
    ctx.atualizarOE(oe.id, {
      status: 'EMBARCADA',
      embarcada_em: new Date().toISOString(),
      conferido_por: 'Você',
      lotes_conferidos: lotesConferidos,
      foto_carga: fotos.length > 0,
      fotos_carga: fotos,
      amostra_coletada: amostra,
      obs_conferencia: obs,
      mapa_carga: mapaCarga
    });
    ctx.showToast('Conferência finalizada!', `${oe.numero} liberada para embarque. Delivery Note criada no SAP.`);
    ctx.setScreen('conferencia');
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb">
            <i className="ti ti-home"></i>
            <span style={{cursor:'pointer', color:'var(--accent-light)'}} onClick={() => ctx.setScreen('conferencia')}>Conferência</span>
            <span>·</span>
            <span>{oe.numero}</span>
          </div>
          <h1 className="page-title">Conferência · {oe.numero}</h1>
          <p className="page-subtitle">
            {getParadas(oe).length > 1
              ? `${getParadas(oe).length} paradas · ${oe.motorista_nome} · ${oe.veiculo_placa}`
              : `${oe.cliente} · ${oe.motorista_nome} · ${oe.veiculo_placa}`}
          </p>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <span className="chip chip-blue" style={{ fontSize: 12, padding: '6px 12px' }}><i className="ti ti-loader"></i> Em conferência</span>
          <button
            className="btn btn-ghost"
            style={{ borderColor: 'var(--accent)', color: 'var(--accent-light)' }}
            onClick={() => {
              // Salva qualquer progresso parcial (fotos, lotes conferidos, mapa) antes de abrir o PDF
              ctx.atualizarOE(oe.id, {
                lotes_conferidos: lotesConferidos,
                foto_carga: fotos.length > 0,
                fotos_carga: fotos,
                amostra_coletada: amostra,
                obs_conferencia: obs,
                mapa_carga: mapaCarga
              });
              ctx.setViewingOE(oe);
              ctx.setScreen('detalhe-oe');
            }}
            title="Abre o documento da OE em modo leitura — depois imprima"
          >
            <i className="ti ti-file-text"></i> Visualizar OE em PDF
          </button>
          <button className="btn btn-ghost" onClick={() => ctx.setScreen('conferencia')}><i className="ti ti-x"></i> Pausar</button>
        </div>
      </div>

      <div className="panel" style={{ marginBottom: 16 }}>
        <div style={{ padding: '16px 20px', display: 'flex', alignItems: 'center', gap: 20, flexWrap: 'wrap' }}>
          <div style={{ flex: 1, minWidth: 280 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 600 }}>Progresso da conferência</div>
              <div style={{ fontSize: 13, color: 'var(--text-muted)' }}>
                <strong style={{ color: 'var(--accent-light)' }}>{conferidosCount}</strong> de {totalItens} itens conferidos
                {(totalItens - itensQueExigemConferencia) > 0 && (
                  <span style={{ marginLeft: 6, color: 'var(--blue)' }}>
                    ({totalItens - itensQueExigemConferencia} auto · triangular)
                  </span>
                )}
              </div>
            </div>
            <div style={{ height: 8, background: 'var(--bg-card)', borderRadius: 4, overflow: 'hidden' }}>
              <div style={{ height: '100%', width: progressoPct + '%', background: 'linear-gradient(90deg, var(--accent), var(--accent-light))', borderRadius: 4, transition: 'width 0.3s' }}></div>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 16 }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: 22, fontWeight: 700, color: 'var(--green)', fontFamily: 'JetBrains Mono, monospace' }}>{conferidosCount}</div>
              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase' }}>Conferidos</div>
            </div>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: 22, fontWeight: 700, color: 'var(--text-muted)', fontFamily: 'JetBrains Mono, monospace' }}>{totalItens - conferidosCount}</div>
              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase' }}>Pendentes</div>
            </div>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: 22, fontWeight: 700, color: 'var(--accent-light)', fontFamily: 'JetBrains Mono, monospace' }}>{totalBBs(oe)}</div>
              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase' }}>un. totais</div>
            </div>
          </div>
        </div>
      </div>

      {/* MAPA DE CARGA — desenhe a posição dos BBs no caminhão */}
      <div className="panel" style={{ marginBottom: 16 }}>
        <div className="panel-header">
          <div>
            <div className="panel-title">
              <i className="ti ti-layout-grid" style={{ color: 'var(--accent-light)', marginRight: 6 }}></i>
              Mapa de carga
            </div>
            <div className="panel-sub">
              Desenhe a posição física dos volumes no caminhão. Selecione um lote acima e clique nas células para marcar onde cada volume daquele lote foi colocado.
            </div>
          </div>
          <span className={`chip ${mapaCarga && bbsMarcadosNoMapa(migrarMapa(mapaCarga)) === totalBBs(oe) ? 'chip-green' : 'chip-orange'}`} style={{ fontSize: 11 }}>
            {mapaCarga && bbsMarcadosNoMapa(migrarMapa(mapaCarga)) > 0
              ? `${bbsMarcadosNoMapa(migrarMapa(mapaCarga))}/${totalBBs(oe)} un. marcadas`
              : 'Mapa em branco'}
          </span>
        </div>
        <div style={{ padding: '14px 18px' }}>
          <MapaCarga
            oe={oe}
            mapa={mapaCarga}
            onChange={handleMapaChange}
            paintMode={paintMode}
            readonly={false}
          />
        </div>
      </div>

      <div className="cd-layout" style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 16 }}>
        <div className="panel">
          <div className="panel-header">
            <div>
              <div className="panel-title">Lotes da carga</div>
              <div className="panel-sub">Toque em "Conferir lote" após validar fisicamente</div>
            </div>
          </div>
          <div style={{ padding: '16px 18px' }}>
            {(() => {
              const paradasL = getParadas(oe);
              const multiplas = paradasL.length > 1;
              return paradasL.map((p, paradaIdx) => (
                <div key={p.id || paradaIdx} style={{ marginBottom: multiplas ? 18 : 0 }}>
                  {multiplas && (
                    <div style={{
                      display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12,
                      padding: '8px 12px', background: 'var(--accent-glow)', borderRadius: 6,
                      borderLeft: '3px solid var(--accent)'
                    }}>
                      <div style={{
                        width: 28, height: 28, borderRadius: 14, background: 'var(--accent)',
                        color: 'white', fontSize: 13, fontWeight: 800, fontFamily: 'JetBrains Mono, monospace',
                        display: 'flex', alignItems: 'center', justifyContent: 'center'
                      }}>{p.ordem_carga}</div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 13, fontWeight: 700 }}>Parada {p.ordem_carga} · {p.cliente}</div>
                        <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>
                          Carrega {p.ordem_carga}º · Descarrega {p.ordem_descarga}º · {p.itens.reduce((a,i) => a + i.qtd_bb, 0)} un.
                        </div>
                      </div>
                    </div>
                  )}
                  {p.itens.map((it, itIdx) => {
                    const key = `p${paradaIdx}_i${itIdx}`;
                    const conferido = lotesConferidos[key];
                    const isControleParalelo = it.lotes_alocados && it.lotes_alocados.length > 0 &&
                                               it.lotes_alocados.every(la => la.controle_paralelo);
                    return (
                      <div key={key} style={{
                        border: '2px solid ' + (conferido ? (isControleParalelo ? 'var(--blue)' : 'var(--green)') : 'var(--border-strong)'),
                        borderRadius: 10,
                        marginBottom: 14,
                        background: conferido ? (isControleParalelo ? 'var(--blue-bg)' : 'var(--green-bg)') : 'var(--bg-card)',
                        overflow: 'hidden'
                      }}>
                        <div style={{ padding: '14px 16px' }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4, flexWrap: 'wrap' }}>
                            <span className="mono" style={{ fontSize: 15, fontWeight: 700, color: conferido ? (isControleParalelo ? 'var(--blue)' : 'var(--green)') : 'var(--text)' }}>
                              {it.codigo}
                            </span>
                            {isControleParalelo ? (
                              <span className="chip chip-blue"><i className="ti ti-shield-check"></i> Conferido pelo fornecedor</span>
                            ) : conferido ? (
                              <span className="chip chip-green"><i className="ti ti-check"></i> Conferido</span>
                            ) : (
                              <span className="chip chip-orange"><i className="ti ti-clock"></i> Pendente</span>
                            )}
                          </div>
                          <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 12 }}>{it.descricao}</div>

                          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, padding: 12, background: 'var(--bg-elev)', borderRadius: 6, marginBottom: 12 }}>
                            <div>
                              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 600, marginBottom: 3 }}>Quantidade</div>
                              <div style={{ fontSize: 13, fontWeight: 700 }}>{it.qtd_bb} {it.unidade || it.embalagem || 'un'}</div>
                            </div>
                            <div>
                              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 600, marginBottom: 3 }}>Peso estimado</div>
                              <div style={{ fontSize: 13, fontWeight: 700 }}>~{fmtNum(it.qtd_bb * PESO_BB_KG)} kg</div>
                            </div>
                            <div>
                              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 600, marginBottom: 3 }}>Obtentor</div>
                              <div style={{ fontSize: 13, fontWeight: 700 }}>{it.obtentor || '—'}</div>
                            </div>
                            <div>
                              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 600, marginBottom: 3 }}>Lotes</div>
                              <div style={{ fontSize: 13, fontWeight: 700, color: it.lotes_alocados && it.lotes_alocados.length > 0 ? 'var(--accent-light)' : 'var(--orange)' }}>
                                {it.lotes_alocados && it.lotes_alocados.length > 0 ? `${it.lotes_alocados.length}` : 'Não info.'}
                              </div>
                            </div>
                          </div>

                          {it.lotes_alocados && it.lotes_alocados.length > 0 && (
                            <div style={{ marginBottom: 12, padding: 10, background: 'var(--bg-elev)', borderRadius: 6, border: '1px solid var(--border)' }}>
                              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 6 }}>
                                <i className="ti ti-box" style={{ fontSize: 12 }}></i>
                                {isControleParalelo ? 'Lotes informados (controle paralelo)' : 'Lotes a conferir fisicamente'}
                              </div>
                              {isControleParalelo && (
                                <div style={{ fontSize: 10, color: 'var(--blue)', marginBottom: 8, padding: 8, background: 'var(--blue-bg)', borderRadius: 4, display: 'flex', gap: 6, alignItems: 'flex-start' }}>
                                  <i className="ti ti-shield-check" style={{ fontSize: 12, marginTop: 1, flexShrink: 0 }}></i>
                                  <span><strong>Não requer conferência física.</strong> Lotes triangulares são conferidos pelo fornecedor antes do carregamento. Informação apenas para rastreabilidade.</span>
                                </div>
                              )}
                              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                                {it.lotes_alocados.map(la => {
                                  const isSemLotesEntry = la.sem_lotes_triangular;
                                  return (
                                    <div key={la.lote_codigo} style={{
                                      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                                      padding: '8px 10px', background: 'var(--bg-card)', borderRadius: 4,
                                      borderLeft: '3px solid ' + (isSemLotesEntry ? 'var(--text-muted)' : (la.controle_paralelo ? 'var(--blue)' : 'var(--accent)'))
                                    }}>
                                      <div>
                                        <div className="mono" style={{ fontSize: 13, fontWeight: 700, color: isSemLotesEntry ? 'var(--text-muted)' : (la.controle_paralelo ? 'var(--blue)' : 'var(--accent-light)'), fontStyle: isSemLotesEntry ? 'italic' : 'normal' }}>
                                          {isSemLotesEntry ? 'A definir pelo fornecedor' : la.lote_codigo}
                                          {isSemLotesEntry ? (
                                            <span className="chip chip-neutral" style={{ fontSize: 9, marginLeft: 8, padding: '1px 5px' }}>SEM LOTE</span>
                                          ) : la.controle_paralelo && (
                                            <span className="chip chip-blue" style={{ fontSize: 9, marginLeft: 8, padding: '1px 5px' }}>CTRL PARALELO</span>
                                          )}
                                        </div>
                                        <div style={{ fontSize: 10, color: 'var(--text-muted)' }}>
                                          {isSemLotesEntry
                                            ? 'Item triangular sem lotes informados · responsabilidade do fornecedor'
                                            : la.controle_paralelo
                                              ? (la.origem_fornecedor || 'Origem não informada')
                                              : `${la.armazem || '—'} · Peneira ${la.peneira || '—'} · Germ. ${la.germinacao || '—'}%`
                                          }
                                        </div>
                                      </div>
                                      <div style={{ fontFamily: 'JetBrains Mono, monospace', fontWeight: 700, fontSize: 14 }}>{la.qtd_bb} un.</div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          )}

                          {isControleParalelo ? (
                            <div style={{ padding: 10, background: 'var(--blue-bg)', borderRadius: 6, fontSize: 11, color: 'var(--blue)', textAlign: 'center', fontWeight: 600 }}>

const GOOGLE_CLIENT_ID = '920998476809-iuhc7pfj55mgk3pmkebljacd4r5ti3vn.apps.googleusercontent.com';

const DNLOG_AUTH = {
  token() { return localStorage.getItem('dnlog_token') || ''; },
  setToken(t) { if (t) localStorage.setItem('dnlog_token', t); else localStorage.removeItem('dnlog_token'); },
  async _post(path, body) {
    const r = await fetch(`${DNLOG_API_BASE}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.message || ('Erro ' + r.status));
    return d;
  },
  async loginGoogle(credential) { const d = await this._post('/auth/google', { credential }); this.setToken(d.token); return d.usuario; },
  async loginDev(email, nome) { const d = await this._post('/auth/dev-login', { email, nome }); this.setToken(d.token); return d.usuario; },
  async me() {
    const t = this.token(); if (!t) return null;
    try {
      const r = await fetch(`${DNLOG_API_BASE}/auth/me`, { headers: { Authorization: 'Bearer ' + t } });
      if (!r.ok) { this.setToken(''); return null; }
      return await r.json();
    } catch (e) { return null; }
  },
  async listarUsuarios() {
    const r = await fetch(`${DNLOG_API_BASE}/usuarios`, { headers: { Authorization: 'Bearer ' + this.token() } });
    if (!r.ok) throw new Error('Falha ao listar usuários'); return r.json();
  },
  async atualizarUsuario(id, body) {
    const r = await fetch(`${DNLOG_API_BASE}/usuarios/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.token() }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.message || 'Falha'); return d;
  },
  logout() { this.setToken(''); },
};
window.DNLOG_AUTH = DNLOG_AUTH;

const AuthGate = () => {
  const [estado, setEstado] = useState('carregando'); // carregando | login | pendente | ok
  const [usuario, setUsuario] = useState(null);
  const aplicar = (u) => {
    setUsuario(u);
    if (!u) setEstado('login');
    else if (u.status === 'APROVADO') setEstado('ok');
    else setEstado('pendente');
  };
  useEffect(() => { DNLOG_AUTH.me().then(aplicar).catch(() => aplicar(null)); }, []);
  // Login NOVO: se aprovado, recarrega a página para o bootstrap rodar de novo
  // já com o token e carregar os dados (que exigem login). Pendente/rejeitado
  // não recarrega (mostra a tela de espera).
  const aoLogar = (u) => {
    if (u && u.status === 'APROVADO') { window.location.reload(); return; }
    aplicar(u);
  };
  const onLogout = () => {
    DNLOG_AUTH.logout();
    try { window.google && window.google.accounts && window.google.accounts.id.disableAutoSelect(); } catch (e) {}
    setUsuario(null); setEstado('login');
  };
  if (estado === 'carregando') return <TelaCarregando />;
  if (estado === 'login') return <TelaLogin onLogin={aoLogar} />;
  if (estado === 'pendente') return <TelaPendente usuario={usuario} onLogout={onLogout} />;
  return <App usuario={usuario} onLogout={onLogout} />;
};

// ============================================================
// RENDER + BOOTSTRAP DO BACKEND
// ============================================================
// Antes de renderizar o React, tenta carregar dados do backend DNLog.
// Se o backend estiver rodando, substitui DADOS_PEDIDOS pelos dados ao vivo.
// Se não estiver, segue com os dados embutidos (modo standalone offline).
// ============================================================
(async function bootstrapDNLog() {
  // Aplica o tema salvo ANTES de renderizar — assim a própria tela de login já
  // abre no tema certo (claro/escuro), sem flash e com a logo correta.
  try {
    const temaSalvo = localStorage.getItem('dnlog_tema');
    if (temaSalvo) document.documentElement.setAttribute('data-theme', temaSalvo);
  } catch (e) {}

  const API_BASE = (window.location && window.location.origin && window.location.origin.indexOf('http') === 0)
    ? window.location.origin + '/api'
    : 'http://localhost:3000/api';
  const TIMEOUT_MS = 4000;        // probe rápido do /health (detecta backend)
  const DATA_TIMEOUT_MS = 45000;  // consultas de dados (pedidos paginados do SAP demoram)

  function mostrarBadge(html, cor) {
    const badge = document.createElement('div');
    badge.style.cssText = `
      position:fixed;bottom:14px;right:14px;
      background:${cor};color:white;padding:8px 14px;border-radius:6px;
      font-size:12px;font-family:'JetBrains Mono',monospace;z-index:99999;
      box-shadow:0 4px 14px rgba(0,0,0,0.5);font-weight:700;
      letter-spacing:0.03em;transition:opacity 0.6s;cursor:pointer
    `;
    badge.innerHTML = html;
    badge.title = 'Clique para fechar';
    badge.onclick = () => badge.remove();
    document.body.appendChild(badge);
    setTimeout(() => { badge.style.opacity = '0.7'; }, 5000);
    return badge;
  }

  function fetchTimeout(url, ms) {
    // Envia o token de sessão (se logado) — a API de dados agora exige login.
    const _t = localStorage.getItem('dnlog_token') || '';
    const _opts = _t ? { headers: { Authorization: 'Bearer ' + _t } } : {};
    return Promise.race([
      fetch(url, _opts).then(r => r.json()),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
    ]);
  }

  try {
    // Tenta health do backend
    const health = await fetchTimeout(`${API_BASE}/health`, TIMEOUT_MS);
    console.log('[DNLog API] Backend OK:', health);
    window.__DNLOG_BACKEND_ON = true; // habilita sincronização de OEs com o banco
    // Modo somente leitura no SAP: o app não tenta criar nota no SAP enquanto
    // estiver ligado (fase de implantação). A baixa local + banco continuam.
    window.__DNLOG_SAP_READONLY = health.somente_leitura !== false;

    // A API de dados agora exige login. Só carrega dados se já houver sessão.
    // Sem token: mostra a tela de login; após logar, a página recarrega e
    // este bootstrap roda de novo com o token, aí os dados entram.
    const _logado = !!localStorage.getItem('dnlog_token');
    if (_logado) {

    // Hidrata as OEs do banco no localStorage ANTES do React montar.
    // O servidor é a fonte da verdade; mantém lotes/baixas locais como estão.
    try {
      const ordensBanco = await fetchTimeout(`${API_BASE}/oe`, DATA_TIMEOUT_MS);
      if (Array.isArray(ordensBanco)) {
        const atual = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        atual.ordens = ordensBanco;
        if (atual.proxNumero == null) atual.proxNumero = ordensBanco.length + 1;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(atual));
        console.log(`[DNLog API] ${ordensBanco.length} OE(s) carregadas do banco`);
      }
    } catch (e) {
      console.warn('[DNLog API] Não foi possível carregar OEs do banco:', e.message);
    }

    // Hidrata os AGENDAMENTOS de embarque do banco (fonte da verdade).
    try {
      const agsBanco = await fetchTimeout(`${API_BASE}/agendamento`, DATA_TIMEOUT_MS);
      if (Array.isArray(agsBanco)) {
        const atual = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        atual.agendamentos = agsBanco;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(atual));
        console.log(`[DNLog API] ${agsBanco.length} agendamento(s) carregados do banco`);
      }
    } catch (e) {
      console.warn('[DNLog API] Não foi possível carregar agendamentos do banco:', e.message);
    }

    // Puxa os pedidos (NÃO-FATAL: se o SAP falhar, o app continua conectado ao
    // backend — banco/OEs/estoque seguem funcionando — só fica sem pedidos do SAP).
    let pedidosOk = false;
    try {
    const pedidosBackend = await fetchTimeout(`${API_BASE}/pedidos`, DATA_TIMEOUT_MS);
    if (!Array.isArray(pedidosBackend)) {
      throw new Error((pedidosBackend && pedidosBackend.message) || 'resposta inesperada de /pedidos');
    }

    // Adapta o formato do backend ao formato esperado pelo app
    // Os campos vêm prontos do backend (numero, cliente, itens etc.)
    // mas garantimos compatibilidade com formato antigo
    DADOS_PEDIDOS = pedidosBackend.map(p => ({
      numero: p.numero,
      cliente: p.cliente,
      data_emissao: p.data_emissao,
      data_entrega: p.data_entrega,
      vencimento: p.data_entrega,
      local_entrega: p.local_entrega || '',
      vendedor: p.vendedor || '',
      vendedor_codigo: p.vendedor_codigo || '',
      frete: 'CIF',
      // doc_entry guarda referência SAP para faturamento
      _sap_doc_entry: p.doc_entry,
      _sap_cliente_codigo: p.cliente_codigo,
      // Totais e status vindos do backend (o pedidosComSaldo recalcula o saldo
      // considerando as OEs; qtd_total_bb e status_sap vêm prontos daqui).
      qtd_total_bb: p.qtd_total_bb,
      qtd_saldo_bb: p.qtd_saldo_bb,
      saldo_aberto: p.saldo_aberto,
      tem_saldo: p.tem_saldo,
      status_sap: p.status_sap,
      cancelado: p.cancelado,
      itens: (p.itens || []).map(it => ({
        codigo: it.codigo,
        descricao: it.descricao,
        cultivar_nome: it.descricao,
        grupo_codigo: it.grupo_codigo,
        grupo_nome: it.grupo_nome || '',
        obtentor: '',
        fornecedor: '',
        tsi: '',
        embalagem: it.embalagem || '',
        qtd_bb: it.qtd_bb,
        unidade: it.embalagem || 'un',
        valor_unitario: it.valor_unitario,
        valor_total: it.qtd_bb * it.valor_unitario,
        qtd_entregue: it.qtd_entregue || 0,
        sap_line_num: it.sap_line_num,
        saldo: it.saldo,
        armazem: it.armazem,
      }))
    }));

    console.log(`[DNLog API] ${DADOS_PEDIDOS.length} pedidos carregados do backend (modo: ${health.modo})`);
    pedidosOk = true;
    } catch (e) {
      console.warn('[DNLog API] Pedidos do SAP não carregados — segue conectado ao backend, sem pedidos ao vivo:', e.message);
    }

    // Estoque real por item x armazem (não-fatal: se falhar, segue sem ele).
    try {
      const estoque = await fetchTimeout(`${API_BASE}/estoque`, DATA_TIMEOUT_MS);
      if (Array.isArray(estoque)) {
        DADOS_ESTOQUE = estoque;
        console.log(`[DNLog API] ${DADOS_ESTOQUE.length} linhas de estoque (item x armazém) carregadas`);
      }
    } catch (e) {
      console.warn('[DNLog API] Estoque não carregado:', e.message);
    }

    // Estoque por LOTE (view CALCULOSALDOITENS do SAP) — não-fatal.
    try {
      const lotes = await fetchTimeout(`${API_BASE}/estoque-lotes`, DATA_TIMEOUT_MS);
      if (Array.isArray(lotes)) {
        DADOS_ESTOQUE_LOTES = lotes;
        console.log(`[DNLog API] ${DADOS_ESTOQUE_LOTES.length} linhas de saldo por lote carregadas`);
      }
    } catch (e) {
      console.warn('[DNLog API] Saldo por lote não carregado:', e.message);
    }

    // Estoque em/de terceiros (armazéns DN_EMTER/DN_DETER) — não-fatal.
    try {
      const terc = await fetchTimeout(`${API_BASE}/estoque-terceiros`, DATA_TIMEOUT_MS);
      if (Array.isArray(terc)) {
        DADOS_ESTOQUE_TERCEIROS = terc;
        console.log(`[DNLog API] ${DADOS_ESTOQUE_TERCEIROS.length} linhas de estoque em terceiros`);
      }
    } catch (e) {
      console.warn('[DNLog API] Estoque de terceiros não carregado:', e.message);
    }

    // Pedidos de compra (não-fatal).
    try {
      const compras = await fetchTimeout(`${API_BASE}/pedidos-compra`, DATA_TIMEOUT_MS);
      if (Array.isArray(compras)) {
        DADOS_PEDIDOS_COMPRA = compras;
        console.log(`[DNLog API] ${DADOS_PEDIDOS_COMPRA.length} pedidos de compra carregados`);
      }
    } catch (e) {
      console.warn('[DNLog API] Pedidos de compra não carregados:', e.message);
    }

    // Resumo de entregas para o gráfico do painel (não-fatal).
    try {
      const resumo = await fetchTimeout(`${API_BASE}/pedidos-resumo`, DATA_TIMEOUT_MS);
      if (resumo && typeof resumo.entregues === 'number') {
        DADOS_ENTREGAS = resumo;
        console.log(`[DNLog API] entregas: ${resumo.entregues} entregues / ${resumo.nao_entregues} não entregues`);
      }
    } catch (e) {
      console.warn('[DNLog API] Resumo de entregas não carregado:', e.message);
    }

    // Fornecedores reais do SAP (não-fatal) — ordenados por nome.
    try {
      const forn = await fetchTimeout(`${API_BASE}/fornecedores`, DATA_TIMEOUT_MS);
      if (Array.isArray(forn)) {
        DADOS_FORNECEDORES = forn.slice().sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
        console.log(`[DNLog API] ${DADOS_FORNECEDORES.length} fornecedores carregados`);
      }
    } catch (e) {
      console.warn('[DNLog API] Fornecedores não carregados:', e.message);
    }

    const sufixoRO = window.__DNLOG_SAP_READONLY ? ' · 🔒 só leitura' : '';
    let cor, label, reconectar = false;
    if (!pedidosOk && health.modo !== 'mock') {
      // Backend no ar, mas o SAP não respondeu os pedidos.
      cor = '#B7791F';
      label = `✓ Backend conectado · ⚠ SAP indisponível · clique p/ reconectar`;
      reconectar = true;
    } else {
      cor = health.modo === 'mock' ? '#3B82F6' : '#1F8A4C';
      label = health.modo === 'mock'
        ? `✓ API MOCK conectada · ${DADOS_PEDIDOS.length} pedidos`
        : `✓ API SAP conectada · ${DADOS_PEDIDOS.length} pedidos${sufixoRO}`;
    }
    setTimeout(() => {
      const b = mostrarBadge(label, cor);
      if (reconectar && b) {
        b.title = 'Clique para reconectar ao SAP';
        b.onclick = () => location.reload();
      }
    }, 800);

    } // fim do if (_logado) — sem token, pula o carregamento (mostra login)

  } catch (err) {
    console.warn('[DNLog API] Backend indisponível, usando dados estáticos:', err.message);
    setTimeout(() => mostrarBadge('⚠ Backend offline · modo standalone', '#B53939'), 800);
  }

  // Renderiza o React com os dados (atualizados ou originais)
  ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate />);
})();


// ============================================================
// MAPA DE CARGA — grid editável de posições dos big bags com profundidade
// Suporta múltiplas carretas (bitrem, rodotrem) e templates de veículos comuns.
// ============================================================
const CORES_PARADAS = ['#4ADE80', '#60A5FA', '#A78BFA', '#FBBF24', '#F472B6', '#34D399'];

// Lista achatada dos LOTES da carga, na ordem física de carregamento.
// Cada lote é uma "cor de pintura" no mapa: idx (1-based) é o valor guardado
// na célula, a cor vem da parada (cliente) e o rótulo curto é "1a/1b" (parada +
// letra do lote) — ou só o número da parada quando ela tem um único lote.
// Usado tanto pela edição do mapa quanto pela impressão.
const getLotesCarga = (oe) => {
  const paradas = getParadas(oe).slice().sort((a, b) => (a.ordem_carga || 0) - (b.ordem_carga || 0));
  const out = [];
  let idx = 0;
  paradas.forEach(p => {
    const cor = CORES_PARADAS[((p.ordem_carga || 1) - 1) % CORES_PARADAS.length];
    let seq = 0;
    (p.itens || []).forEach(it => {
      const alocs = (it.lotes_alocados || []).filter(la => la && !la.sem_lotes_triangular && (la.qtd_bb || 0) > 0);
      if (alocs.length > 0) {
        alocs.forEach(la => {
          idx++; seq++;
          out.push({
            idx, paradaOrdem: p.ordem_carga, cliente: p.cliente, cor,
            loteCodigo: la.lote_codigo || '(sem código)',
            cultivar: it.cultivar_nome || it.descricao || '',
            qtd: la.qtd_bb || 0, _seq: seq
          });
        });
      } else {
        // Item sem lote informado (ex.: triangular) — entra como um item único.
        idx++; seq++;
        out.push({
          idx, paradaOrdem: p.ordem_carga, cliente: p.cliente, cor,
          loteCodigo: it.cultivar_nome || it.descricao || 'Item',
          cultivar: it.cultivar_nome || it.descricao || '',
          qtd: it.qtd_bb || 0, _seq: seq, semLote: true
        });
      }
    });
  });
  // Rótulo curto: número da parada (se único lote) ou número+letra (1a, 1b...).
  const cont = {};
  out.forEach(l => { cont[l.paradaOrdem] = (cont[l.paradaOrdem] || 0) + 1; });
  out.forEach(l => {
    l.label = cont[l.paradaOrdem] > 1
      ? `${l.paradaOrdem}${String.fromCharCode(96 + l._seq)}`
      : `${l.paradaOrdem}`;
  });
  return out;
};

// Templates de veículos. capacidade = andares * colunas * profundidade * num_carretas
const TEMPLATES_VEICULO = {
  truck:           { nome: 'Truck (toco)',            carretasDef: [{ andares: 2, colunas: 4, profundidade: 2 }],                                                capacidade: 16 },
  truck6x2:        { nome: 'Truck 6×2 (longo)',       carretasDef: [{ andares: 2, colunas: 4, profundidade: 2 }],                                                capacidade: 16 },
  bitruck:         { nome: 'Bitruck',                 carretasDef: [{ andares: 2, colunas: 6, profundidade: 2 }],                                                capacidade: 24 },
  carreta_simples: { nome: 'Carreta simples',         carretasDef: [{ andares: 2, colunas: 7, profundidade: 2 }],                                                capacidade: 28 },
  carreta_ls:      { nome: 'Carreta LS (vanderléia)', carretasDef: [{ andares: 2, colunas: 8, profundidade: 2 }],                                                capacidade: 32 },
  bitrem:          { nome: 'Bitrem',                  carretasDef: [{ andares: 2, colunas: 6, profundidade: 2 }, { andares: 2, colunas: 6, profundidade: 2 }],   capacidade: 48 },
  rodotrem:        { nome: 'Rodotrem curto',          carretasDef: [{ andares: 2, colunas: 6, profundidade: 2 }, { andares: 2, colunas: 6, profundidade: 2 }],   capacidade: 48 },
  rodotrem_longo:  { nome: 'Rodotrem longo',          carretasDef: [{ andares: 2, colunas: 6, profundidade: 2 }, { andares: 2, colunas: 8, profundidade: 2 }],   capacidade: 56 },
  personalizado:   { nome: 'Personalizado',           carretasDef: [{ andares: 2, colunas: 6, profundidade: 2 }],                                                capacidade: 24 },
};

// Cria estrutura inicial vazia a partir de um template
const criarMapaDoTemplate = (templateKey) => {
  const t = TEMPLATES_VEICULO[templateKey] || TEMPLATES_VEICULO.bitruck;
  return {
    template: templateKey,
    carretas: t.carretasDef.map(def => ({
      andares: def.andares,
      colunas: def.colunas,
      profundidade: def.profundidade,
      celulas: {}
    }))
  };
};

// Migração: converte mapa antigo (sem carretas) para o novo formato
const migrarMapa = (mapa) => {
  if (!mapa) return null;
  if (mapa.carretas) return mapa; // já está no novo formato
  // Formato antigo: { linhas, colunas, celulas } — mover pra carreta única
  return {
    template: 'personalizado',
    carretas: [{
      andares: mapa.linhas || 1,
      colunas: mapa.colunas || 10,
      profundidade: 1,
      celulas: mapa.celulas || {}
    }]
  };
};

// Capacidade total do mapa
const capacidadeMapa = (mapa) => {
  if (!mapa || !mapa.carretas) return 0;
  return mapa.carretas.reduce((acc, c) => acc + (c.andares * c.colunas * c.profundidade), 0);
};

// BBs marcados no mapa todo
const bbsMarcadosNoMapa = (mapa) => {
  if (!mapa || !mapa.carretas) return 0;
  return mapa.carretas.reduce((acc, c) => acc + Object.keys(c.celulas || {}).length, 0);
};

// Contagem por parada (todas as carretas)
const contarPorParada = (mapa) => {
  const c = {};
  if (!mapa || !mapa.carretas) return c;
  mapa.carretas.forEach(carreta => {
    Object.values(carreta.celulas || {}).forEach(v => {
      if (v) c[v] = (c[v] || 0) + 1;
    });
  });
  return c;
};

const MapaCarga = ({ oe, mapa, onChange, readonly, paintMode }) => {
  const paradas = getParadas(oe);
  const lotesCarga = useMemo(() => getLotesCarga(oe), [oe]);
  const loteByIdx = useMemo(() => { const m = {}; lotesCarga.forEach(l => { m[l.idx] = l; }); return m; }, [lotesCarga]);
  const mapaNormalizado = useMemo(() => {
    if (!mapa) {
      const total = totalBBs(oe);
      let templateSugerido;
      if (total <= 14) templateSugerido = 'truck';
      else if (total <= 16) templateSugerido = 'truck6x2';
      else if (total <= 24) templateSugerido = 'bitruck';
      else if (total <= 28) templateSugerido = 'carreta_simples';
      else if (total <= 32) templateSugerido = 'carreta_ls';
      else if (total <= 48) templateSugerido = 'bitrem';
      else templateSugerido = 'rodotrem_longo';
      return criarMapaDoTemplate(templateSugerido);
    }
    return migrarMapa(mapa);
  }, [mapa, oe]);

  const contagem = useMemo(() => contarPorParada(mapaNormalizado), [mapaNormalizado]);

  // Clique em meia-célula (frente ou fundo)
  const handleSlotClick = (carretaIdx, l, col, prof) => {
    if (readonly) return;
    const key = `L${l}C${col}${prof === 0 ? 'F' : 'T'}`; // F = frente, T = trás (fundo)
    const carreta = mapaNormalizado.carretas[carretaIdx];
    const atual = carreta.celulas[key];
    let novo;
    if (paintMode === 'erase') {
      novo = null;
    } else if (paintMode == null) {
      // Modo ciclar entre os lotes
      const total = lotesCarga.length;
      if (!atual) novo = 1;
      else if (atual >= total) novo = null;
      else novo = atual + 1;
    } else {
      novo = atual === paintMode ? null : paintMode;
    }
    const novasCelulas = { ...carreta.celulas };
    if (novo == null) delete novasCelulas[key];
    else novasCelulas[key] = novo;
    const novasCarretas = mapaNormalizado.carretas.map((c, i) =>
      i === carretaIdx ? { ...c, celulas: novasCelulas } : c
    );
    onChange({ ...mapaNormalizado, carretas: novasCarretas });
  };

  // Trocar template
  const trocarTemplate = (templateKey) => {
    if (readonly) return;
    const totalAtual = bbsMarcadosNoMapa(mapaNormalizado);
    if (totalAtual > 0 && !confirm('Mudar o tipo de veículo irá redimensionar o mapa. Posições marcadas podem ser perdidas. Continuar?')) return;
    onChange(criarMapaDoTemplate(templateKey));
  };

  // Ajustar dimensões de uma carreta (modo personalizado)
  const ajustarCarreta = (carretaIdx, campo, valor) => {
    if (readonly) return;
    const novasCarretas = mapaNormalizado.carretas.map((c, i) => {
      if (i !== carretaIdx) return c;
      const novaCarreta = { ...c, [campo]: valor };
      // Limpa células fora dos novos limites
      const novasCelulas = {};
      Object.entries(c.celulas).forEach(([key, v]) => {
        const m = key.match(/L(\d+)C(\d+)([FT])/);
        if (m) {
          const linha = parseInt(m[1]);
          const colu = parseInt(m[2]);
          const prof = m[3] === 'F' ? 0 : 1;
          if (linha < novaCarreta.andares && colu < novaCarreta.colunas && prof < novaCarreta.profundidade) {
            novasCelulas[key] = v;
          }
        }
      });
      return { ...novaCarreta, celulas: novasCelulas };
    });
    // Verifica se ainda corresponde a algum template conhecido
    const templateAtual = mapaNormalizado.template;
    const def = TEMPLATES_VEICULO[templateAtual];
    let novoTemplate = templateAtual;
    if (def) {
      const aindaCombina = def.carretasDef.length === novasCarretas.length &&
        def.carretasDef.every((d, i) =>
          d.andares === novasCarretas[i].andares &&
          d.colunas === novasCarretas[i].colunas &&
          d.profundidade === novasCarretas[i].profundidade
        );
      if (!aindaCombina) novoTemplate = 'personalizado';
    }
    onChange({ ...mapaNormalizado, template: novoTemplate, carretas: novasCarretas });
  };

  const limparTudo = () => {
    if (readonly) return;
    if (!confirm('Limpar todas as posições marcadas no mapa?')) return;
    const novasCarretas = mapaNormalizado.carretas.map(c => ({ ...c, celulas: {} }));
    onChange({ ...mapaNormalizado, carretas: novasCarretas });
  };

  // Preenche automaticamente — distribui paradas em ordem
  const preencherAuto = () => {
    if (readonly) return;
    if (bbsMarcadosNoMapa(mapaNormalizado) > 0) {
      if (!confirm('Substituir o mapa atual com o preenchimento automático?')) return;
    }
    const ordenadas = [...paradas].sort((a, b) => a.ordem_carga - b.ordem_carga);
    // Cria lista de slots em ordem: carreta 0 primeiro, dentro carreta vai do FUNDO para a TRASEIRA
    // Por coluna: enche fundo (trás) primeiro, depois frente, depois sobe o andar
    // Ordem física de carregamento: traseira pra frente, fundo pra frente, andar de baixo primeiro
    const slots = [];
    mapaNormalizado.carretas.forEach((carreta, carretaIdx) => {
      for (let c = 0; c < carreta.colunas; c++) {
        for (let prof = carreta.profundidade - 1; prof >= 0; prof--) { // trás primeiro
          for (let l = 0; l < carreta.andares; l++) {
            slots.push({ carretaIdx, l, c, prof });
          }
        }
      }
    });
    // Distribui sequencialmente: cada LOTE ocupa a sua quantidade de slots,
    // na ordem da lista de lotes (parada → item → lote).
    const novasCarretas = mapaNormalizado.carretas.map(c => ({ ...c, celulas: {} }));
    let slotIdx = 0;
    lotesCarga.forEach(lote => {
      for (let i = 0; i < lote.qtd && slotIdx < slots.length; i++) {
        const s = slots[slotIdx];
        const key = `L${s.l}C${s.c}${s.prof === 0 ? 'F' : 'T'}`;
        novasCarretas[s.carretaIdx].celulas[key] = lote.idx;
        slotIdx++;
      }
    });
    onChange({ ...mapaNormalizado, carretas: novasCarretas });
  };

  const capacidadeTotal = capacidadeMapa(mapaNormalizado);
  const marcadosTotal = bbsMarcadosNoMapa(mapaNormalizado);
  const totalEsperado = totalBBs(oe);

  return (
    <div>
      {!readonly && (
        <>
          {/* SELETOR DE TEMPLATE */}
          <div style={{ display: 'flex', gap: 8, marginBottom: 12, flexWrap: 'wrap', alignItems: 'center' }}>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', marginRight: 4 }}>
              Tipo de veículo:
            </div>
            <select
              value={mapaNormalizado.template || 'personalizado'}
              onChange={e => trocarTemplate(e.target.value)}
              className="input"
              style={{ width: 'auto', minWidth: 220, padding: '5px 8px', fontSize: 12 }}
            >
              {Object.entries(TEMPLATES_VEICULO).map(([key, t]) => (
                <option key={key} value={key}>{t.nome} · {t.capacidade} posições</option>
              ))}
            </select>
            <div style={{ flex: 1 }} />
            <button onClick={preencherAuto} className="btn btn-ghost" style={{ fontSize: 11, padding: '5px 10px' }} title="Preenche automaticamente seguindo a ordem de carga">
              <i className="ti ti-sparkles"></i> Preencher automaticamente
            </button>
            <button onClick={limparTudo} className="btn btn-ghost" style={{ fontSize: 11, padding: '5px 10px' }}>
              <i className="ti ti-trash"></i> Limpar
            </button>
          </div>

          {/* PALETA DE LOTES — selecione o lote e clique nas células pra posicioná-lo */}
          <div style={{ display: 'flex', gap: 8, marginBottom: 12, flexWrap: 'wrap', alignItems: 'center', padding: 10, background: 'var(--bg-card)', borderRadius: 6, border: '1px solid var(--border)' }}>
            <div style={{ fontSize: 10, color: 'var(--text-muted)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', marginRight: 4 }}>
              Lote a posicionar:
            </div>
            {lotesCarga.map(lote => {
              const cor = lote.cor;
              const isSelected = paintMode === lote.idx;
              const marcados = contagem[lote.idx] || 0;
              const completo = lote.qtd > 0 && marcados === lote.qtd;
              return (
                <button
                  key={lote.idx}
                  onClick={() => onChange(mapaNormalizado, lote.idx)}
                  style={{
                    display: 'flex', alignItems: 'center', gap: 7,
                    padding: '5px 10px',
                    background: isSelected ? cor + '33' : 'var(--bg-elev)',
                    border: '2px solid ' + (isSelected ? cor : 'var(--border)'),
                    borderRadius: 5, cursor: 'pointer',
                    fontFamily: 'inherit', fontSize: 11, fontWeight: 600,
                    color: isSelected ? cor : 'var(--text)'
                  }}
                  title={`Parada ${lote.paradaOrdem} · ${lote.cliente} · Lote ${lote.loteCodigo}${lote.cultivar ? ' · ' + lote.cultivar : ''}`}
                >
                  <span style={{
                    minWidth: 22, height: 18, padding: '0 5px', borderRadius: 9, background: cor,
                    color: '#0E1116', fontSize: 10, fontWeight: 800, fontFamily: 'JetBrains Mono, monospace',
                    display: 'flex', alignItems: 'center', justifyContent: 'center'
                  }}>{lote.label}</span>
                  <span style={{ display: 'flex', flexDirection: 'column', lineHeight: 1.15, alignItems: 'flex-start' }}>
                    <span className="mono" style={{ fontSize: 11, fontWeight: 700 }}>{lote.loteCodigo}</span>
                    <span style={{ fontSize: 9, color: 'var(--text-dim)' }}>{lote.cliente.split(' ').slice(0, 2).join(' ')}</span>
                  </span>
                  {completo && <i className="ti ti-check" style={{ fontSize: 12, color: 'var(--green)' }}></i>}
                  <span className="mono" style={{ fontSize: 10, color: completo ? 'var(--green)' : 'var(--text-muted)', fontWeight: 700 }}>
                    {marcados}/{lote.qtd}
                  </span>
                </button>
              );
            })}
            <button
              onClick={() => onChange(mapaNormalizado, 'erase')}
              style={{
                display: 'flex', alignItems: 'center', gap: 6,
                padding: '4px 10px',
                background: paintMode === 'erase' ? 'var(--red-bg)' : 'var(--bg-elev)',
                border: '2px solid ' + (paintMode === 'erase' ? 'var(--red)' : 'var(--border)'),
                borderRadius: 4, cursor: 'pointer',
                fontFamily: 'inherit', fontSize: 11, fontWeight: 600,
                color: paintMode === 'erase' ? 'var(--red)' : 'var(--text-muted)'

              <i className="ti ti-eraser"></i> Apagar
            </button>
          </div>

          {/* Controles custom só quando personalizado */}
          {mapaNormalizado.template === 'personalizado' && mapaNormalizado.carretas.map((c, idx) => (
            <div key={idx} style={{ padding: '8px 12px', background: 'var(--bg-card)', borderRadius: 6, border: '1px solid var(--border)', marginBottom: 8, display: 'flex', gap: 12, flexWrap: 'wrap', alignItems: 'center', fontSize: 11 }}>

                </div>
              </label>
              <label style={{ display: 'flex', alignItems: 'center', gap: 4 }}>

                <input type="number" min="3" max="12" value={c.colunas}

                    {carreta.profundidade === 2 && <span style={{ marginLeft: 8, color: 'var(--accent-light)' }}>(vista desdobrada: andares × profundidade)</span>}
                  </div>
                  {!readonly && (
                    <div style={{ display: 'flex', gap: 3, alignItems: 'center' }}>
                      <button
                        onClick={() => ajustarCarreta(carretaIdx, 'colunas', Math.max(3, carreta.colunas - 1))}

                        style={{
                          width: 22, height: 22, padding: 0,
                          background: 'var(--bg-card)',
                          border: '1px solid var(--border-strong)',

                          color: carreta.colunas <= 3 ? 'var(--text-dim)' : 'var(--text)',

                          fontFamily: 'inherit', fontSize: 13, fontWeight: 700,
                          display: 'flex', alignItems: 'center', justifyContent: 'center'
                        }}
                        title="Remover coluna (último)"

                      <span style={{ fontSize: 9, color: 'var(--text-muted)', fontFamily: 'JetBrains Mono, monospace', minWidth: 36, textAlign: 'center', fontWeight: 700 }}>

                        onClick={() => ajustarCarreta(carretaIdx, 'colunas', Math.min(12, carreta.colunas + 1))}

                        style={{
                          width: 22, height: 22, padding: 0,
                          background: 'var(--accent-glow)',
                          border: '1px solid var(--accent)',
                          borderRadius: 3,
                          color: carreta.colunas >= 12 ? 'var(--text-dim)' : 'var(--accent-light)',
                          cursor: carreta.colunas >= 12 ? 'not-allowed' : 'pointer',
                          fontFamily: 'inherit', fontSize: 13, fontWeight: 700,
                          display: 'flex', alignItems: 'center', justifyContent: 'center'
