<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNLog · Gestão de Pedidos e Entregas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
/* ===== PALETA DA MARCA DN SEEDS =====
   Verde Escuro #0A4A39 (Pantone 3308C) · Verde Médio #0E6048
   Dourado #CCB009 · Bege Areia #C1B7A2
   Tema ESCURO: superfícies verde-profundo + acento verde/dourado. */
:root {
  /* Fundo PRETO PURO (#000) — apaga o pixel em telas OLED. As camadas acima
     mantêm o tom verde-escuro da marca para preservar profundidade/contraste. */
  --bg: #000000;
  --bg-elev: #0A130F;
  --bg-card: #0F1D17;
  --bg-hover: #16291F;
  --border: #20382B;
  --border-strong: #2E4D3C;
  --text: #EAF0EB;
  --text-muted: #94A89D;
  --text-dim: #64766A;
  --accent: #0E6048;
  --accent-light: #2BA372;
  --accent-glow: rgba(14, 96, 72, 0.22);
  --gold: #CCB009;
  --green: #34C77E;
  --green-bg: rgba(52, 199, 126, 0.12);
  --blue: #5BA8F5;
  --blue-bg: rgba(91, 168, 245, 0.12);
  --red: #F2746B;
  --red-bg: rgba(242, 116, 107, 0.12);
  --orange: #F2A03C;
  --orange-bg: rgba(242, 160, 60, 0.12);
  --purple: #A78BFA;
  --purple-bg: rgba(167, 139, 250, 0.1);
}

/* ===== TEMA CLARO (warm, bege + verde da marca) =====
   Sobrescreve as variáveis quando <html data-theme="light">.
   O documento/PDF tem cores próprias (claras) e não é afetado. */
html[data-theme="light"] {
  --bg: #F4F2EA;
  --bg-elev: #FFFFFF;
  --bg-card: #EFEBE0;
  --bg-hover: #E7E1D3;
  --border: #DCD5C5;
  --border-strong: #C5BCA8;
  --text: #15241C;
  --text-muted: #5A665F;
  --text-dim: #8A9189;
  --accent: #0A4A39;
  --accent-light: #0E6048;
  --accent-glow: rgba(10, 74, 57, 0.10);
  --gold: #8A7406;
  --green: #15803D;
  --green-bg: rgba(21, 128, 61, 0.12);
  --blue: #2563EB;
  --blue-bg: rgba(37, 99, 235, 0.12);
  --red: #C0392B;
  --red-bg: rgba(192, 57, 43, 0.12);
  --orange: #C2410C;
  --orange-bg: rgba(194, 65, 12, 0.12);
  --purple: #6D28D9;
  --purple-bg: rgba(109, 40, 217, 0.12);
}
html[data-theme="light"] body { background: var(--bg); }

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Manrope', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: 'JetBrains Mono', monospace; }

/* LAYOUT */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  padding: 20px 0;
  display: flex;
  flex-direction: column;
}
.brand {
  padding: 0 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-logo { height: 34px; width: auto; display: block; }
.brand-name { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; color: var(--accent); }
.brand-sub { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 1px; }

/* Plaqueta da logo: a arte vem com fundo branco. No tema escuro mostramos
   numa plaquinha branca arredondada (proposital); no claro ela assenta direto
   na sidebar branca, sem caixa. */
.brand-plaque {
  background: #FFFFFF;
  border-radius: 10px;
  padding: 7px 11px;
  display: inline-flex;
  align-items: center;
  box-shadow: 0 1px 5px rgba(0,0,0,0.18);
}
html[data-theme="light"] .brand-plaque {
  background: transparent;
  box-shadow: none;
  padding: 2px 0;
}

/* Botão de recolher/expandir a sidebar: fixed (não é cortado pelo overflow da
   sidebar), straddle na borda direita, com hover na cor da marca. */
.sb-toggle {
  position: fixed;
  top: 22px;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 200; font-size: 16px;
  transition: left 0.25s ease, background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.12s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.22);
}
.sb-toggle:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: #FFFFFF;
  transform: scale(1.08);
  box-shadow: 0 3px 12px rgba(14,96,72,0.45);
}
.sb-toggle:active { transform: scale(0.95); }
.nav-section { padding: 20px 12px 8px; }
.nav-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-dim);
  padding: 0 8px 8px;
  font-weight: 600;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  font-family: inherit;
  transition: all 0.15s;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--accent-glow); color: var(--accent-light); }
.nav-item i { font-size: 18px; }
.nav-badge {
  margin-left: auto;
  background: var(--bg-card);
  color: var(--text-muted);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}
.sidebar-footer { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--border); }
.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: white; font-size: 12px;
}
.avatar-mini {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: white; font-size: 9px;
  border: 2px solid var(--bg-card);
}
.status-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); }

/* MAIN */
/* min-width:0 deixa o track 1fr do grid encolher abaixo do min-content do
   conteúdo (tabelas largas). Sem isso a página inteira ganha scroll horizontal
   em telas estreitas em vez de só a tabela (que já tem overflow-x próprio). */
.main { padding: 24px 32px; max-width: 1500px; min-width: 0; }
.page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
  gap: 16px;
  flex-wrap: wrap;
}
.page-title { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 4px; }
.page-subtitle { font-size: 13px; color: var(--text-muted); }
.crumb { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border-strong);
  background: var(--bg-card);
  color: var(--text);
  font-family: inherit;
  transition: all 0.15s;
}
.btn:hover:not(:disabled) { background: var(--bg-hover); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-light); }
.btn-ghost { background: transparent; border-color: var(--border); }
.btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn-danger:hover:not(:disabled) { background: var(--red-bg); }
.btn i { font-size: 16px; }

/* METRICS */
.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.metric {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
}
.metric-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.metric-value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-family: 'JetBrains Mono', monospace; }
.metric-delta { font-size: 11px; margin-top: 4px; display: flex; align-items: center; gap: 4px; color: var(--text-muted); }
.delta-up { color: var(--green); }
.delta-down { color: var(--red); }

/* PANELS */
.panel {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 16px;
}
.panel-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.panel-title { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
.panel-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* SEARCH */
.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 7px 10px;
  flex: 1;
  max-width: 320px;
}
.search-box input {
  background: none;
  border: none;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  flex: 1;
  outline: none;
  min-width: 0;
}
.search-box input::placeholder { color: var(--text-dim); }
.search-box i { color: var(--text-dim); font-size: 16px; }

/* TABLES */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: var(--bg-card); }
th {
  text-align: left;
  padding: 10px 18px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td { padding: 12px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr { cursor: pointer; transition: background 0.1s; }
tbody tr:hover { background: var(--bg-hover); }
tbody tr:last-child td { border-bottom: none; }
.cell-primary { font-weight: 600; }
.cell-muted { color: var(--text-muted); }
.num { text-align: right; font-family: 'JetBrains Mono', monospace; }

/* CHIPS */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}
.chip-green { background: var(--green-bg); color: var(--green); }
.chip-blue { background: var(--blue-bg); color: var(--blue); }
.chip-orange { background: var(--orange-bg); color: var(--orange); }
.chip-red { background: var(--red-bg); color: var(--red); }
.chip-purple { background: var(--purple-bg); color: var(--purple); }
.chip-accent { background: var(--accent-glow); color: var(--accent-light); }
.chip-neutral { background: var(--bg-card); color: var(--text-muted); }

/* FORMS */
.field { margin-bottom: 14px; }
.field-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.input, select.input, textarea.input {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 10px 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border 0.15s;
}
.input:focus { border-color: var(--accent); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* CHECKBOX */
.checkbox {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 1.5px solid var(--border-strong);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
  background: var(--bg-card);
}
.checkbox.checked { background: var(--accent); border-color: var(--accent); }
.checkbox i { font-size: 12px; color: white; display: none; }
.checkbox.checked i { display: block; }

/* STEPS */
.steps {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  padding: 12px 16px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow-x: auto;
}
.step { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.step-num {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
}
.step.done .step-num { background: var(--accent); color: white; border-color: var(--accent); }
.step.done .step-num i { font-size: 12px; }
.step.done { color: var(--text); }
.step.active .step-num { background: var(--gold); color: #0E1116; border-color: var(--gold); }
.step.active { color: var(--text); font-weight: 600; }
.step-divider { flex: 1; height: 1px; background: var(--border); min-width: 20px; }

/* SUMMARY (lateral) */
.summary {
  position: sticky;
  top: 24px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
}
.summary-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 12px;
  gap: 8px;
}
.summary-row .label { color: var(--text-muted); flex-shrink: 0; }
.summary-row .value { font-weight: 600; text-align: right; }
.summary-row.total {
  border-top: 1px dashed var(--border);
  padding-top: 12px;
  margin-top: 8px;
  font-size: 13px;
}

/* MODAL */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal {
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  width: 100%;
  max-width: 680px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 24px 60px rgba(0,0,0,0.6);
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--bg-elev);
  border: 1px solid var(--green);
  border-left: 4px solid var(--green);
  border-radius: 8px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  z-index: 300;
  max-width: 380px;
  animation: slideIn 0.3s;
}
.toast i { color: var(--green); font-size: 22px; }
.toast-title { font-weight: 600; font-size: 13px; }
.toast-msg { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

/* CALENDÁRIO */
.calendar {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.calendar-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.calendar-nav {
  display: flex;
  align-items: center;
  gap: 4px;
}
.calendar-nav button {
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  color: var(--text);
  width: 32px; height: 32px;
  border-radius: 6px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.calendar-nav button:hover { background: var(--bg-hover); }
.calendar-month {
  font-size: 16px;
  font-weight: 700;
  margin: 0 12px;
  text-transform: capitalize;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--border);
  gap: 1px;
}
.calendar-dayhead {
  background: var(--bg-card);
  padding: 8px;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.calendar-cell {
  background: var(--bg-elev);
  min-height: 110px;
  padding: 6px 8px;
  position: relative;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}
.calendar-cell:hover { background: var(--bg-hover); }
.calendar-cell.other-month { opacity: 0.35; }
.calendar-cell.today { background: var(--accent-glow); }
.calendar-cell.today .calendar-day-num { color: var(--accent-light); font-weight: 800; }
.calendar-day-num {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
  font-family: 'JetBrains Mono', monospace;
}
.calendar-events { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.calendar-event {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
  cursor: pointer;
}
.cev-blue { background: var(--blue-bg); color: var(--blue); border-left: 2px solid var(--blue); }
.cev-orange { background: var(--orange-bg); color: var(--orange); border-left: 2px solid var(--orange); }
.cev-green { background: var(--green-bg); color: var(--green); border-left: 2px solid var(--green); }
.cev-purple { background: var(--purple-bg); color: var(--purple); border-left: 2px solid var(--purple); }
.cev-accent { background: var(--accent-glow); color: var(--accent-light); border-left: 2px solid var(--accent-light); }

/* DOCUMENTO DA OE (IMPRIMÍVEL) */
#printable-doc {
  background: white;
  color: #1A1A1A;
  border-radius: 8px;
  padding: 32px 36px;
  font-family: 'Manrope', sans-serif;
  margin-bottom: 24px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  font-size: 12px;
  line-height: 1.5;
}
.doc-header-v2 {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 24px;
  align-items: flex-start;
  padding-bottom: 16px;
  border-bottom: 3px solid #1A1A1A;
}
.doc-company { display: flex; gap: 14px; align-items: flex-start; }
.doc-logo-print { height: 52px; width: auto; flex-shrink: 0; }
.company-name { font-size: 12px; font-weight: 800; margin-bottom: 4px; color: #1A1A1A; }
.company-info { font-size: 10px; color: #555; line-height: 1.5; }
.doc-id-block { text-align: right; border-left: 3px solid var(--accent); padding-left: 16px; }
.doc-type { font-size: 16px; font-weight: 800; color: #1A1A1A; }
.doc-type-sub { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 8px; font-weight: 600; }
.doc-id-number { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 800; background: #1A1A1A; color: white; display: inline-block; padding: 4px 10px; border-radius: 4px; margin-bottom: 6px; }
.doc-id-meta { font-size: 10px; color: #555; line-height: 1.5; }
.doc-vias { display: grid; grid-template-columns: 1fr 1fr; background: #F4F4F2; border-bottom: 1px solid #1A1A1A; }
.via-item { padding: 8px 12px; font-size: 10px; font-weight: 700; text-align: center; color: #777; letter-spacing: 0.1em; border-right: 1px solid #D5D5D0; }
.via-item:last-child { border-right: none; }
.via-active { background: #1A1A1A; color: white; }
.doc-twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; margin-bottom: 12px; }
.doc-block, .doc-block-wide { border: 1px solid #1A1A1A; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
.doc-block-header { background: #1A1A1A; color: white; padding: 7px 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.doc-block-header i { font-size: 14px; color: var(--accent-light); }
.doc-block-body { padding: 12px 14px; background: white; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 4px 0; font-size: 11px; }
.kv .k { color: #888; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; padding-top: 2px; }
.kv .v { color: #1A1A1A; font-weight: 500; }
.doc-fourcol { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.doc-fourcol > div { display: flex; flex-direction: column; }
.lbl { font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-bottom: 2px; }
.val { font-size: 12px; color: #1A1A1A; font-weight: 600; }
.val-big { font-size: 16px; color: #1A1A1A; font-weight: 700; }
.sub-section-title { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 8px; background: #F4F4F2; padding: 3px 8px; border-left: 3px solid var(--accent); display: inline-block; }
.doc-table-v2 { width: 100%; border-collapse: collapse; font-size: 11px; }
.doc-table-v2 th { background: #2A2A2A; color: white; padding: 7px 10px; text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
.doc-table-v2 td { padding: 10px; border-bottom: 1px solid #E5E5E0; color: #1A1A1A; }
.doc-table-v2 tr:nth-child(even) td { background: #FAFAF8; }
.doc-table-total td { background: #1A1A1A !important; color: white !important; font-weight: 800 !important; }
.doc-signatures-v2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 28px; padding-top: 16px; }
.sig-block { text-align: center; }
.sig-line-v2 { border-top: 1.5px solid #1A1A1A; margin-bottom: 6px; }
.sig-name-v2 { font-size: 11px; font-weight: 700; color: #1A1A1A; margin-bottom: 2px; }
.sig-role-v2 { font-size: 9px; color: #777; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-bottom: 6px; }
.doc-footer-v2 { margin-top: 20px; padding-top: 12px; border-top: 1px solid #1A1A1A; font-size: 9px; color: #777; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; }

/* MODALIDADE */
.modality-card {
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.modality-card:hover { border-color: var(--border-strong); background: var(--bg-hover); }
.modality-card.selected { border-color: var(--accent); background: var(--accent-glow); }
.modality-check {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.modality-card.selected .modality-check { background: var(--accent); border-color: var(--accent); }
.modality-check i { font-size: 12px; color: white; display: none; }
.modality-card.selected .modality-check i { display: block; }

/* EMPTY */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty i { font-size: 48px; color: var(--text-dim); margin-bottom: 12px; display: block; }

/* PRINT */
@page { size: A4 portrait; margin: 8mm 10mm; }
@media print {
  *, *::before, *::after {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  html, body { background: white !important; width: 210mm !important; }
  .sidebar, .page-header, .nav-item, .toast, .btn, button { display: none !important; }
  .app { display: block !important; }
  .main { padding: 0 !important; max-width: 100% !important; }
  #print-only-doc { display: block !important; }
  .no-print { display: none !important; }
  #printable-doc { box-shadow: none !important; padding: 0 !important; border-radius: 0 !important; }
}

/* CONF (CONFERÊNCIA) */
.conf-card {
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
}
.conf-card-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.conf-card-num { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; }
.conf-card-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.conf-card-body { padding: 12px 16px; flex: 1; }
.conf-card-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 12px; gap: 8px; }
.conf-card-row > span:first-child { color: var(--text-muted); }
.conf-card-actions { padding: 12px 14px; border-top: 1px solid var(--border); }

/* SCROLLBAR */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* ===== RESPONSIVO (tablet / celular) =====
   A sidebar vira ícones automaticamente abaixo de 1000px (controlado no JS).
   Aqui ajustamos os grids de cards e o layout 2-colunas da Conferência para
   caber em tablet sem scroll horizontal. !important vence os estilos inline. */
@media (max-width: 1100px) {
  .main { padding: 16px 18px; }
  .metrics { grid-template-columns: repeat(2, 1fr) !important; }
  .cd-layout { grid-template-columns: 1fr !important; }
}
@media (max-width: 760px) {
  .main { padding: 12px 14px; }
  .metrics { grid-template-columns: 1fr !important; }
  .page-title { font-size: 22px; }
  .page-header { gap: 10px; }
}

// escura p/ tema escuro (texto claro). Trocadas conforme o tema.
const LOGO_LIGHT = `data:image/png;base64,${LOGO_LIGHT_B64}`;
const LOGO_DARK = `data:image/png;base64,${LOGO_DARK_B64}`;
const LOGO_URL = LOGO_LIGHT;

const fmtMoney = (v) => 'R$ ' + (v || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtNum = (v) => (v || 0).toLocaleString('pt-BR');
const fmtDate = (s) => {
  if (!s) return '—';
  // Aceita 'YYYY-MM-DD' e timestamps do SAP ('YYYY-MM-DDThh:mm:ssZ'):
  // corta a hora pegando só os 10 primeiros caracteres (a data).
  const [y,m,d] = s.slice(0,10).split('-');
  return `${d}/${m}/${y}`;
};
const fmtDateTime = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
};
const todayISO = () => new Date().toISOString().slice(0,10);
const addDays = (iso, days) => {
  const d = new Date(iso);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
};

// PESO MÉDIO por BB de 5M = aproximadamente 900kg
const PESO_BB_KG = 900;

// ============================================================
// HELPERS GLOBAIS PARA MULTI-PARADAS
// ============================================================
// Retorna todos os itens de uma OE (lida tanto formato antigo como novo com paradas)
const getAllItens = (oe) => {
  if (!oe) return [];
  if (oe.paradas && Array.isArray(oe.paradas)) {
    return oe.paradas.flatMap(p => p.itens || []);
  }
  return oe.itens || [];
};

// Retorna paradas (sempre como array), mesmo para OEs antigas (uma parada só)
const getParadas = (oe) => {
  if (!oe) return [];
  if (oe.paradas && Array.isArray(oe.paradas) && oe.paradas.length > 0) {
    return oe.paradas;
  }
  // Formato antigo: monta uma única parada virtual
  return [{
    ordem_carga: 1,
    ordem_descarga: 1,
    cliente: oe.cliente,
    pedido_numero: oe.pedido_numero,
    pedido_data_emissao: oe.pedido_data_emissao,
    pedido_data_entrega: oe.pedido_data_entrega,
    pedido_local_entrega: oe.pedido_local_entrega,
    vendedor: oe.vendedor,
    itens: oe.itens || [],
    modalidade: oe.modalidade,
    fornecedor_nome: oe.fornecedor_nome,
    fornecedor_endereco: oe.fornecedor_endereco,
  }];
};

// Total de BBs de uma OE
const totalBBs = (oe) => getAllItens(oe).reduce((a, i) => a + (i.qtd_bb || 0), 0);
// Total em valor da OE
const totalValor = (oe) => getAllItens(oe).reduce((a, i) => a + ((i.qtd_bb || 0) * (i.valor_unitario || 0)), 0);

// ============================================================
// STORAGE
// ============================================================
const STORAGE_KEY = 'dnlog_v2';

// ============================================================
// SINCRONIZAÇÃO COM O BACKEND (banco de dados + SAP)
// ------------------------------------------------------------
// As OEs continuam sendo salvas no localStorage (funciona offline), mas
// quando o backend está no ar elas também são enviadas para o banco — assim
// o servidor vira a fonte da verdade e todos os usuários veem as mesmas OEs.
// Tudo aqui é "best-effort": se o backend cair, o app segue funcionando.
// ============================================================
// A API fica na MESMA origem que serve o app (o backend serve o index.html).
// Assim funciona em qualquer lugar: localhost:3000 no dev, dnlog.onrender.com em
// produção. Fallback para localhost só quando aberto como arquivo (file://).
const DNLOG_API_BASE = (typeof window !== 'undefined' && window.location && window.location.origin && window.location.origin.indexOf('http') === 0)
  ? window.location.origin + '/api'
  : 'http://localhost:3000/api';
window.__DNLOG_BACKEND_ON = false; // ligado pelo bootstrap quando o /health responde

// Cabeçalho com o token de sessão — a API de dados/OE agora exige login.
function dnlogAuthHeaders(extra) {
  const t = localStorage.getItem('dnlog_token') || '';
  return Object.assign({}, extra || {}, t ? { Authorization: 'Bearer ' + t } : {});
}

const DNLOG_API = {
  // Busca todas as OEs já persistidas no banco.
  async listarOEs() {
    const r = await fetch(`${DNLOG_API_BASE}/oe`, { headers: dnlogAuthHeaders() });
    if (!r.ok) throw new Error('GET /oe ' + r.status);
    return r.json();
  },

  // Envia o conjunto de OEs para o banco (upsert em lote). Idempotente.
  async sincronizarOEs(ordens) {
    if (!window.__DNLOG_BACKEND_ON) return; // sem backend → só localStorage
    try {
      await fetch(`${DNLOG_API_BASE}/oe/sync`, {
        method: 'POST',
        headers: dnlogAuthHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ ordens }),
      });
    } catch (e) {
      console.warn('[DNLog API] Falha ao sincronizar OEs (seguindo offline):', e.message);
    }
  },

  // Fatura a OE no SAP (cria Delivery Note) e vincula o documento à OE no banco.
  // Best-effort: usado em paralelo à baixa local; erro não trava o app.
  async faturarSAP(oe, nfNumero) {
    if (!window.__DNLOG_BACKEND_ON) return null;
    const paradas = (oe.paradas && oe.paradas.length > 0)
      ? oe.paradas
      : [{ pedido_numero: oe.pedido_numero, cliente: oe.cliente, itens: oe.itens || [] }];

    // Mapeia pedido_numero -> doc_entry/cliente_codigo a partir dos pedidos do SAP
    const pedIndex = {};
    (typeof DADOS_PEDIDOS !== 'undefined' ? DADOS_PEDIDOS : []).forEach(p => {
      pedIndex[p.numero] = p;
    });

    const paradasPayload = paradas.map(parada => {
      const itens = (parada.itens || []).map(it => {
        const lote = (it.lotes_alocados || []).find(l => l && l.lote_codigo && !l.sem_lotes_triangular);
        return {
          sap_line_num: it.sap_line_num,
          qtd_bb: it.qtd_bb,
          lote_codigo: lote ? lote.lote_codigo : undefined,
        };
      });
      const pedNum = parada.pedido_numero
        || (parada.itens || []).map(i => i.pedido_numero).find(Boolean);
      const ped = pedNum ? pedIndex[pedNum] : null;
      return {
        pedido_doc_entry: ped ? ped._sap_doc_entry : undefined,
        cliente_codigo: ped ? ped._sap_cliente_codigo : undefined,
        itens,
      };
    });

    const r = await fetch(`${DNLOG_API_BASE}/oe/faturar`, {
      method: 'POST',
      headers: dnlogAuthHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        oe_id: oe.id,
        oe_numero: oe.numero,
        paradas: paradasPayload,
        motorista_cpf: oe.motorista_cpf,
        placa: oe.veiculo_placa,
        placa_uf: oe.veiculo_placa_uf,
        observacoes: oe.observacoes || '',
      }),
    });
    if (!r.ok) throw new Error('POST /oe/faturar ' + r.status);
    return r.json();
  },

  // ---- Agendamentos de Embarque (retirada avulsa em fornecedor) ----
  async listarAgendamentos() {
    const r = await fetch(`${DNLOG_API_BASE}/agendamento`, { headers: dnlogAuthHeaders() });
    if (!r.ok) throw new Error('GET /agendamento ' + r.status);
    return r.json();
  },
  async salvarAgendamento(ag) {
    const r = await fetch(`${DNLOG_API_BASE}/agendamento`, {
      method: 'POST',
      headers: dnlogAuthHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(ag),
    });
    if (!r.ok) throw new Error('POST /agendamento ' + r.status);
    return r.json();
  },
  async removerAgendamento(id) {
    const r = await fetch(`${DNLOG_API_BASE}/agendamento/${id}`, {
      method: 'DELETE',
      headers: dnlogAuthHeaders(),
    });
    if (!r.ok) throw new Error('DELETE /agendamento ' + r.status);
    return r.json();
  },
};
window.DNLOG_API = DNLOG_API;

const loadState = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Lotes NUNCA vêm do localStorage: são dados VIVOS do SAP. A cada carga
      // refrescamos a partir do estoque real (DADOS_ESTOQUE_LOTES já carregado
      // no bootstrap). Isso é o que alimenta o seletor de lotes do embarque.
      parsed.lotes = lotesDoEstoqueSAP();
      parsed._semLotesFicticios = true;
      if (!parsed.baixasFaturadas) parsed.baixasFaturadas = {};
      // OEs de retirada em fornecedor (entrada). Lista à parte de `ordens`
      // (vendas), pra não misturar com o fluxo de saída.
      if (!parsed.ordensCompra) parsed.ordensCompra = [];
      if (parsed.proxNumeroCompra == null) parsed.proxNumeroCompra = 1;
      if (!parsed.agendamentos) parsed.agendamentos = [];
      return parsed;
    }
  } catch(e) {}
  return {
    ordens: [],
    proxNumero: 1,
    ordensCompra: [],
    proxNumeroCompra: 1,
    agendamentos: [],
    notificacoes: [],
    lotes: lotesDoEstoqueSAP(),
    // baixasFaturadas: { 'PV-XX|SOJ000015': 10, ... }  → consumo permanente faturado
    baixasFaturadas: {}
  };
};

let _syncTimer = null;
const saveState = (state) => {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) { console.error('Erro salvando:', e); }

  // Espelha as OEs no banco (debounce 800ms para agrupar mudanças rápidas).
  if (window.__DNLOG_BACKEND_ON && state && Array.isArray(state.ordens)) {
    if (_syncTimer) clearTimeout(_syncTimer);
    const snapshot = state.ordens;
    _syncTimer = setTimeout(() => DNLOG_API.sincronizarOEs(snapshot), 800);
  }
};

// ============================================================
// APP PRINCIPAL
// ============================================================
const App = ({ usuario, onLogout }) => {
  const [screen, setScreen] = useState('dashboard');
  const [state, setState] = useState(loadState);
  const [toast, setToast] = useState(null);
  const [editingOE, setEditingOE] = useState(null);
  const [viewingOE, setViewingOE] = useState(null);
  const [conferenceOE, setConferenceOE] = useState(null);
  const [viewingPedido, setViewingPedido] = useState(null);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  // Auto-colapsa a sidebar (só ícones) em telas estreitas (tablet/celular).
  // O toggle manual continua valendo no desktop; abaixo de 1000px força ícones.
  const [autoCollapsed, setAutoCollapsed] = useState(
    () => typeof window !== 'undefined' && window.innerWidth < 1000
  );
  useEffect(() => {
    const onResize = () => setAutoCollapsed(window.innerWidth < 1000);
    window.addEventListener('resize', onResize);
    onResize();
    return () => window.removeEventListener('resize', onResize);
  }, []);
  const effectiveCollapsed = sidebarCollapsed || autoCollapsed;
  // Perfil vem SEMPRE do usuário logado (Google + aprovação) e é FIXO: cada um
  // vê o app conforme o SEU papel, definido pelo gestor na tela de Usuários.
  // (Não há mais "ver como" — o papel não é sobreponível.) Sem login, padrão.
  const perfilAtivo = (usuario && usuario.perfil) || 'OPERADOR';
  // Tema claro/escuro (padrão: escuro). Aplica data-theme no <html> e persiste.
  const [tema, setTema] = useState(() => localStorage.getItem('dnlog_tema') || 'dark');

  useEffect(() => { saveState(state); }, [state]);
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', tema);
    localStorage.setItem('dnlog_tema', tema);
  }, [tema]);

  // Quando troca perfil, redireciona se necessário
  useEffect(() => {
    if (perfilAtivo === 'CONFERENTE') {
      // Conferente só acessa: conferencia, conferencia-detalhe, detalhe-oe (read-only/print)
      if (!['conferencia', 'conferencia-detalhe', 'detalhe-oe'].includes(screen)) {
        setScreen('conferencia');
      }
    }
  }, [perfilAtivo]);

  // Calcula saldo real considerando OEs criadas (suporta paradas multi-cliente)
  // E também considera baixas faturadas (vendas concluídas)
  const pedidosComSaldo = useMemo(() => {
    const baixas = state.baixasFaturadas || {};
    return DADOS_PEDIDOS.map(p => {
      const itens = p.itens.map(it => {
        // qtd_entregue base + baixas faturadas posteriores (deste app)
        const chaveBaixa = `${p.numero}|${it.codigo}`;
        const baixaExtra = baixas[chaveBaixa] || 0;
        const qtdEntregueTotal = it.qtd_entregue + baixaExtra;

        // Conta consumo em OEs ativas NÃO FATURADAS (reserva temporária)
        // OEs faturadas já tiveram suas qtds movidas para baixasFaturadas, então não contam aqui
        // Ao EDITAR uma OE, ela é ignorada aqui — assim os pedidos dela voltam a
        // ficar disponíveis (com saldo) para serem alterados durante a edição.
        const consumido = state.ordens
          .filter(o => o.status !== 'CANCELADA' && o.status !== 'RASCUNHO' && !o.faturada && o.id !== (editingOE && editingOE.id))
          .reduce((acc, oe) => {
            // Se OE tem paradas (formato novo)
            if (oe.paradas && Array.isArray(oe.paradas)) {
              let total = 0;
              oe.paradas.forEach(parada => {
                if (parada.pedido_numero === p.numero) {
                  const linha = parada.itens.find(i => i.codigo === it.codigo);
                  if (linha) total += linha.qtd_bb;
                }
              });
              return acc + total;
            }
            // Formato antigo (uma parada só)
            if (oe.pedido_numero === p.numero) {
              const linha = (oe.itens || []).find(i => i.codigo === it.codigo);
              return acc + (linha ? linha.qtd_bb : 0);
            }
            return acc;
          }, 0);
        const saldoOriginal = it.qtd_bb - qtdEntregueTotal;
        return {
          ...it,
          qtd_entregue_total: qtdEntregueTotal,  // útil pra exibição
          saldo: Math.max(0, saldoOriginal - consumido)
        };
      });
      const qtdSaldoBB = itens.reduce((a, i) => a + i.saldo, 0);
      const valorAberto = itens.reduce((a, i) => a + (i.saldo * i.valor_unitario), 0);
      return { ...p, itens, qtd_saldo_bb: qtdSaldoBB, saldo_aberto: valorAberto, tem_saldo: qtdSaldoBB > 0 };
    });
  }, [state.ordens, state.baixasFaturadas, editingOE]);

  // Lotes com saldo real (descontando o que está reservado em OEs ativas)
  // IMPORTANTE: OEs triangulares não tocam no estoque do SAP — são ignoradas aqui
  // Helper: extrai todos os itens (de paradas ou estrutura antiga) de uma OE
  const getItensOE = (oe) => {
    if (oe.paradas && Array.isArray(oe.paradas)) {
      return oe.paradas.flatMap(p => (p.itens || []).map(it => ({ ...it, modalidade: p.modalidade || oe.modalidade })));
    }
    return (oe.itens || []).map(it => ({ ...it, modalidade: oe.modalidade }));
  };

  const lotesComSaldo = useMemo(() => {
    return state.lotes.map(l => {
      const reservado = state.ordens
        .filter(o => o.status !== 'CANCELADA' && o.status !== 'ENTREGUE' && o.id !== (editingOE && editingOE.id))
        .reduce((acc, oe) => {
          let qtdDoLote = 0;
          getItensOE(oe).forEach(it => {
            if (it.modalidade === 'TRIANGULAR') return; // ignora triangular
            if (it.lotes_alocados) {
              const aloc = it.lotes_alocados.find(la => la.lote_codigo === l.lote_codigo);
              if (aloc && !aloc.controle_paralelo) qtdDoLote += aloc.qtd_bb;
            }
          });
          return acc + qtdDoLote;
        }, 0);
      const consumido = state.ordens
        .filter(o => o.status === 'ENTREGUE')
        .reduce((acc, oe) => {
          let qtdDoLote = 0;
          getItensOE(oe).forEach(it => {
            if (it.modalidade === 'TRIANGULAR') return;
            if (it.lotes_alocados) {
              const aloc = it.lotes_alocados.find(la => la.lote_codigo === l.lote_codigo);
              if (aloc && !aloc.controle_paralelo) qtdDoLote += aloc.qtd_bb;
            }
          });
          return acc + qtdDoLote;
        }, 0);
      return {
        ...l,
        qtd_reservada: reservado,
        qtd_consumida: consumido,
        qtd_disponivel: Math.max(0, l.qtd_bb - reservado - consumido)
      };
    });
  }, [state.lotes, state.ordens, editingOE]);

  const showToast = (title, msg) => {
    setToast({ title, msg });
    setTimeout(() => setToast(null), 4000);
  };

  const criarOE = (oe) => {
    setState(s => {
      const numero = `OE-2026-${String(s.proxNumero).padStart(5, '0')}`;
      const novaOE = {
        ...oe,
        id: 'oe_' + Date.now(),
        numero,
        criado_em: new Date().toISOString(),
        criado_por: (usuario && (usuario.nome || usuario.email)) || 'Sistema',
        status: 'PROGRAMADA'
      };
      showToast('OE criada com sucesso!', `${numero} foi adicionada à fila de embarques`);
      return { ...s, ordens: [...s.ordens, novaOE], proxNumero: s.proxNumero + 1 };
    });
  };

  const editarOE = (id, novosDados) => {
    setState(s => ({
      ...s,
      ordens: s.ordens.map(o => o.id === id ? {
        ...o,
        ...novosDados,
        editado_em: new Date().toISOString(),
        editado_por: (usuario && (usuario.nome || usuario.email)) || 'Sistema',
        historico: [
          ...(o.historico || []),
          { quando: new Date().toISOString(), por: (usuario && (usuario.nome || usuario.email)) || 'Sistema', acao: 'Edição da OE' }
        ]
      } : o)
    }));
    showToast('OE atualizada', 'Alterações salvas com sucesso');
  };

  const atualizarOE = (id, updates) => {
    setState(s => ({
      ...s,
      ordens: s.ordens.map(o => o.id === id ? { ...o, ...updates } : o)
    }));
  };

  // ---- OEs de RETIRADA EM FORNECEDOR (entrada) — lista própria (ordensCompra) ----
  const criarOECompra = (oe) => {
    setState(s => {
      const numero = `OEF-2026-${String(s.proxNumeroCompra || 1).padStart(5, '0')}`;
      const nova = {
        ...oe,
        tipo: 'compra',
        id: 'oef_' + Date.now(),
        numero,
        criado_em: new Date().toISOString(),
        criado_por: (usuario && (usuario.nome || usuario.email)) || 'Sistema',
        status: 'PROGRAMADA',
      };
      showToast('OE de retirada criada!', `${numero} · ${oe.fornecedor || ''}`);
      return { ...s, ordensCompra: [...(s.ordensCompra || []), nova], proxNumeroCompra: (s.proxNumeroCompra || 1) + 1 };
    });
  };
  const atualizarOECompra = (id, updates) => {
    setState(s => ({ ...s, ordensCompra: (s.ordensCompra || []).map(o => o.id === id ? { ...o, ...updates } : o) }));
  };
  const cancelarOECompra = (id) => {
    setState(s => ({ ...s, ordensCompra: (s.ordensCompra || []).map(o => o.id === id ? { ...o, status: 'CANCELADA' } : o) }));
    showToast('OE de retirada cancelada', '');
  };

  // ---- AGENDAMENTOS DE EMBARQUE (retirada avulsa em fornecedor) — no banco ----
  // O banco é a fonte da verdade: salvar faz upsert e o registro volta com o num
  // sequencial do servidor. O estado local só espelha para a UI reagir na hora.
  const salvarAgendamento = async (ag) => {
    try {
      const salvo = await DNLOG_API.salvarAgendamento(ag);
      setState(s => {
        const lista = s.agendamentos || [];
        const existe = lista.some(a => a.id === salvo.id);
        const nova = existe ? lista.map(a => a.id === salvo.id ? salvo : a) : [salvo, ...lista];
        return { ...s, agendamentos: nova };
      });
      showToast(ag.id ? 'Agendamento atualizado' : 'Agendamento salvo', `#${salvo.num} · ${salvo.fornecedor || ''}`);
      return salvo;
    } catch (e) {
      showToast('Falha ao salvar no banco', e.message || 'tente de novo');
      throw e;
    }
  };
  const removerAgendamento = async (id) => {
    if (!confirm('Remover este agendamento? Esta ação não pode ser desfeita.')) return;
    try {
      await DNLOG_API.removerAgendamento(id);
      setState(s => ({ ...s, agendamentos: (s.agendamentos || []).filter(a => a.id !== id) }));
      showToast('Agendamento removido', '');
    } catch (e) {
      showToast('Falha ao remover', e.message || '');
    }
  };

  // Marca OE como FATURADA: move consumo da OE pra baixas permanentes (qtd_entregue)
  // O efeito visível: o pedido perde aquele saldo na lista de pedidos abertos
  const faturarOE = (id, nfNumero, nfData) => {
    setState(s => {
      const oe = s.ordens.find(o => o.id === id);
      if (!oe) return s;
      if (oe.faturada) {
        showToast('OE já foi faturada', '');
        return s;
      }
      // Agrupa por (pedido_numero, codigo_item) → qtd_bb
      const novasBaixas = { ...(s.baixasFaturadas || {}) };
      // Lê itens de todas as paradas
      const paradas = oe.paradas && oe.paradas.length > 0
        ? oe.paradas
        : [{ pedido_numero: oe.pedido_numero, itens: oe.itens || [] }];
      paradas.forEach(parada => {
        if (!parada.pedido_numero) return;
        // Suporta múltiplos pedidos por parada: cada item tem seu pedido_numero
        (parada.itens || []).forEach(it => {
          const pedNum = it.pedido_numero || parada.pedido_numero;
          if (!pedNum || !it.codigo) return;
          const chave = `${pedNum}|${it.codigo}`;
          novasBaixas[chave] = (novasBaixas[chave] || 0) + (it.qtd_bb || 0);
        });
      });
      return {
        ...s,
        baixasFaturadas: novasBaixas,
        ordens: s.ordens.map(o => o.id === id ? {
          ...o,
          faturada: true,
          faturada_em: new Date().toISOString(),
          faturada_por: perfilAtivo,
          nf_numero: nfNumero || '',
          nf_data: nfData || new Date().toISOString().slice(0, 10),
        } : o)
      };
    });
    showToast('OE faturada', `Saldo do pedido baixado`);

    // Vincula ao SAP via API: cria a Delivery Note e grava o documento na OE
    // do banco. Best-effort — se o backend/SAP estiver fora, a baixa local
    // acima já valeu e o app continua normal.
    // Em modo SOMENTE LEITURA (fase de implantação), NÃO chama o SAP: a OE
    // fica salva só no DNLog (baixa local + banco), sem tocar no ERP.
    if (window.__DNLOG_SAP_READONLY) {
      showToast('Faturada no DNLog', 'SAP em somente leitura — nada gravado no ERP');
    } else if (window.__DNLOG_BACKEND_ON) {
      const oeRef = state.ordens.find(o => o.id === id);
      if (oeRef) {
        DNLOG_API.faturarSAP(oeRef, nfNumero)
          .then(res => {
            if (res && res.sucesso) {
              const docs = (res.notas || []).map(n => n.sap_doc_num).join(', ');
              showToast('Nota criada no SAP', docs ? `Delivery Note ${docs}` : '');
            }
          })
          .catch(e => {
            console.warn('[DNLog API] Faturamento SAP não concluído:', e.message);
            showToast('Faturada localmente', 'SAP indisponível — sincroniza depois');
          });
      }
    }
  };

  // Desfatura OE: reverte as baixas (caso a NF tenha sido emitida errada)
  const desfaturarOE = (id) => {
    setState(s => {
      const oe = s.ordens.find(o => o.id === id);
      if (!oe || !oe.faturada) return s;
      const novasBaixas = { ...(s.baixasFaturadas || {}) };
      const paradas = oe.paradas && oe.paradas.length > 0
        ? oe.paradas
        : [{ pedido_numero: oe.pedido_numero, itens: oe.itens || [] }];
      paradas.forEach(parada => {
        (parada.itens || []).forEach(it => {
          const pedNum = it.pedido_numero || parada.pedido_numero;
          if (!pedNum || !it.codigo) return;
          const chave = `${pedNum}|${it.codigo}`;
          const novo = (novasBaixas[chave] || 0) - (it.qtd_bb || 0);
          if (novo <= 0) delete novasBaixas[chave];
          else novasBaixas[chave] = novo;
        });
      });
      return {
        ...s,
        baixasFaturadas: novasBaixas,
        ordens: s.ordens.map(o => o.id === id ? {
          ...o,
          faturada: false,
          faturada_em: null,
          faturada_por: null,
          nf_numero: null,
          nf_data: null,
          desfaturada_em: new Date().toISOString()
        } : o)
      };
    });
    showToast('OE desfaturada', 'Saldo retornado ao pedido');
  };

  const cancelarOE = (id) => {
    if (!confirm('Confirma cancelamento desta OE? O saldo dos itens será restituído ao pedido.')) return;
    atualizarOE(id, { status: 'CANCELADA', cancelado_em: new Date().toISOString() });
    showToast('OE cancelada', 'Saldo restituído ao pedido');
  };

  const ctx = {
    state, setState, screen, setScreen, showToast,
    pedidos: pedidosComSaldo,
    lotes: lotesComSaldo,
    editingOE, setEditingOE,
    viewingOE, setViewingOE,
    conferenceOE, setConferenceOE,
    viewingPedido, setViewingPedido,
    criarOE, atualizarOE, editarOE, cancelarOE, faturarOE, desfaturarOE,
    criarOECompra, atualizarOECompra, cancelarOECompra,
    salvarAgendamento, removerAgendamento,
    sidebarCollapsed: effectiveCollapsed, setSidebarCollapsed,
    perfilAtivo,
    usuario, onLogout,
    tema, setTema,
    podeEditar: perfilAtivo !== 'CONFERENTE'
  };

  return (
    <div className="app" style={{ gridTemplateColumns: effectiveCollapsed ? '64px 1fr' : '240px 1fr' }}>
      <Sidebar ctx={ctx} />
      <main className="main">
        {ctx.perfilAtivo === 'CONFERENTE' ? (
          <>
            {screen === 'conferencia' && <Conferencia ctx={ctx} />}
            {screen === 'conferencia-detalhe' && <ConferenciaDetalhe ctx={ctx} />}
            {screen === 'detalhe-oe' && <DetalheOE ctx={ctx} />}
            {!['conferencia','conferencia-detalhe','detalhe-oe'].includes(screen) && <Conferencia ctx={ctx} />}
          </>
        ) : (
          <>
            {screen === 'dashboard' && <Dashboard ctx={ctx} />}
            {screen === 'relatorios' && <Relatorios ctx={ctx} />}
            {screen === 'agendamentos' && <EmbarquesHub ctx={ctx} />}
            {screen === 'embarques' && <EmbarquesHub ctx={ctx} />}
            {screen === 'calendario' && <EmbarquesHub ctx={ctx} />}
            {screen === 'pedidos' && <Pedidos ctx={ctx} />}
            {screen === 'pedidos-compra' && <PedidosCompra ctx={ctx} />}
            {screen === 'usuarios' && <AdminUsuarios ctx={ctx} />}
            {screen === 'detalhe-pedido' && <DetalhePedido ctx={ctx} />}
            {screen === 'estoque' && <Estoque ctx={ctx} />}
            {screen === 'conferencia' && <Conferencia ctx={ctx} />}
            {screen === 'triangulares' && <Triangulares ctx={ctx} />}
            {screen === 'nova-oe' && <NovaOE ctx={ctx} />}
            {screen === 'editar-oe' && <NovaOE ctx={ctx} editMode />}
            {screen === 'detalhe-oe' && <DetalheOE ctx={ctx} />}
            {screen === 'conferencia-detalhe' && <ConferenciaDetalhe ctx={ctx} />}
            {screen === 'embarque-fornecedores' && <EmbarquesFornecedores ctx={ctx} />}
            {screen === 'nova-oe-fornecedor' && <NovaOEFornecedor ctx={ctx} />}
          </>
        )}
      </main>
      {toast && <Toast {...toast} />}
    </div>
  );
};

// ============================================================
// RELATÓRIOS (perfil Gestor) — visão analítica da carteira e dos embarques
// ============================================================
const STATUS_LABEL_REL = {
  PROGRAMADA: 'Programadas', EM_CONFERENCIA: 'Em conferência', EMBARCADA: 'Embarcadas',
  EM_TRANSITO: 'Em trânsito', ENTREGUE: 'Entregues', LIBERADA: 'Liberadas',
  NOTA_TROCADA: 'Nota trocada', CANCELADA: 'Canceladas', RASCUNHO: 'Rascunhos',
};
const STATUS_COR_REL = {
  PROGRAMADA: 'var(--blue)', EM_CONFERENCIA: 'var(--orange)', EMBARCADA: 'var(--purple)',
  EM_TRANSITO: 'var(--purple)', ENTREGUE: 'var(--green)', LIBERADA: 'var(--green)',
  NOTA_TROCADA: 'var(--blue)', CANCELADA: 'var(--red)', RASCUNHO: 'var(--text-dim)',
};

const RelBar = ({ label, valor, max, cor, right, sub, code }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10 }}>
    <div style={{ flex: 1, minWidth: 0, fontSize: 13, lineHeight: 1.25 }} title={label}>
      {code ? <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: 'var(--text-muted)' }}>{code}</div> : null}
      <div style={{ display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden', wordBreak: 'break-word' }}>{label}</div>
    </div>
    <div style={{ width: 160, flex: '0 0 160px', height: 8, background: 'var(--bg-card)', borderRadius: 4, overflow: 'hidden' }}>
      <div style={{ width: Math.max(2, (valor / max) * 100) + '%', height: '100%', background: cor || 'var(--accent)', borderRadius: 4 }}></div>
    </div>
    <div style={{ width: 90, flex: '0 0 90px', textAlign: 'right', fontFamily: "'JetBrains Mono', monospace", fontSize: 12 }}>{right}</div>
    {sub !== undefined && (
      <div style={{ width: 130, flex: '0 0 130px', textAlign: 'right', fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: 'var(--text-muted)' }}>{sub}</div>
    )}
  </div>
);

const Relatorios = ({ ctx }) => {
  const rel = useMemo(() => {
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const pedidos = ctx.pedidos || [];
    const abertos = pedidos.filter(p => p.tem_saldo);
    const saldoTotal = abertos.reduce((a, p) => a + (p.saldo_aberto || 0), 0);
    const bbsAbertos = abertos.reduce((a, p) => a + (p.itens || []).reduce((s, i) => s + (i.saldo || 0), 0), 0);

    // Carteira aberta por cultivar (agrupa por item; guarda código e grupo)
    const porCultivar = {};
    abertos.forEach(p => (p.itens || []).forEach(i => {
      const k = i.cultivar_nome || i.descricao || 'Sem cultivar';
      if (!porCultivar[k]) porCultivar[k] = { cultivar: k, codigo: i.codigo || '', grupo: i.grupo_nome || '', bbs: 0, valor: 0 };
      porCultivar[k].bbs += (i.saldo || 0);
      porCultivar[k].valor += (i.saldo || 0) * (i.valor_unitario || 0);
    }));
    const cultivares = Object.values(porCultivar).filter(c => c.bbs > 0).sort((a, b) => b.bbs - a.bbs);
    // Grupos de item disponíveis para o filtro
    const gruposItem = Array.from(new Set(cultivares.map(c => c.grupo).filter(Boolean))).sort();

    // Carteira aberta por vendedor (guarda código do vendedor)
    const porVendedor = {};
    abertos.forEach(p => {
      const k = p.vendedor || '—';
      if (!porVendedor[k]) porVendedor[k] = { vendedor: k, codigo: p.vendedor_codigo || '', valor: 0, pedidos: 0 };
      porVendedor[k].valor += (p.saldo_aberto || 0);
      porVendedor[k].pedidos += 1;
    });
    const vendedores = Object.values(porVendedor).sort((a, b) => b.valor - a.valor);

    // Pedidos atrasados (com saldo e data de entrega vencida)
    const atrasados = abertos.map(p => {
      const d = p.data_entrega ? new Date(p.data_entrega) : null;
      const dias = d ? Math.floor((hoje - d) / 86400000) : 0;
      return { numero: p.numero, cliente: p.cliente, vendedor: p.vendedor, data_entrega: p.data_entrega, saldo: p.saldo_aberto || 0, diasAtraso: dias };
    }).filter(p => p.diasAtraso > 0).sort((a, b) => b.diasAtraso - a.diasAtraso);

    // OEs por status + embarcado
    const statusCount = {};
    ctx.state.ordens.forEach(o => { statusCount[o.status] = (statusCount[o.status] || 0) + 1; });
    const ativas = ctx.state.ordens.filter(o => o.status !== 'CANCELADA' && o.status !== 'RASCUNHO');
    const bbsOE = ativas.reduce((a, o) => a + totalBBs(o), 0);
    const valorOE = ativas.reduce((a, o) => a + totalValor(o), 0);

    return { abertos, saldoTotal, bbsAbertos, cultivares, gruposItem, vendedores, atrasados, statusCount, ativas, bbsOE, valorOE };
  }, [ctx.pedidos, ctx.state.ordens]);

  // Filtro por grupo de item + expandir ("ver mais") na carteira por cultivar
  const [filtroGrupo, setFiltroGrupo] = useState('todos');
  const [verTodosCult, setVerTodosCult] = useState(false);
  const cultivaresFiltrados = useMemo(() => (
    filtroGrupo === 'todos' ? rel.cultivares : rel.cultivares.filter(c => c.grupo === filtroGrupo)
  ), [rel.cultivares, filtroGrupo]);
  const cultivaresVisiveis = verTodosCult ? cultivaresFiltrados : cultivaresFiltrados.slice(0, 10);
  // Totalizador (respeita o filtro de grupo, considera TODOS os itens filtrados)
  const totalCultBBs = cultivaresFiltrados.reduce((a, c) => a + c.bbs, 0);
  const totalCultValor = cultivaresFiltrados.reduce((a, c) => a + c.valor, 0);

  const maxCultivar = Math.max(1, ...cultivaresFiltrados.map(c => c.bbs));
  const maxVend = Math.max(1, ...rel.vendedores.map(v => v.valor));

  // Cards do topo respeitam o filtro de grupo de itens (considera só o saldo
  // dos itens daquele grupo). Com 'todos', batem com a carteira inteira.
  const filtrando = filtroGrupo !== 'todos';
  const metricas = useMemo(() => {
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const abertos = (ctx.pedidos || []).filter(p => p.tem_saldo);
    const noGrupo = (i) => filtroGrupo === 'todos' || i.grupo_nome === filtroGrupo;
    let nPedidos = 0, saldoVal = 0, bbs = 0, atrasados = 0;
    abertos.forEach(p => {
      const itensG = (p.itens || []).filter(i => noGrupo(i) && (i.saldo || 0) > 0);
      if (itensG.length === 0) return;
      nPedidos++;
      saldoVal += itensG.reduce((a, i) => a + (i.saldo || 0) * (i.valor_unitario || 0), 0);
      bbs += itensG.reduce((a, i) => a + (i.saldo || 0), 0);
      const d = p.data_entrega ? new Date(p.data_entrega) : null;
      if (d && Math.floor((hoje - d) / 86400000) > 0) atrasados++;
    });
    return { nPedidos, saldoVal, bbs, atrasados };
  }, [ctx.pedidos, filtroGrupo]);
  const statusKeys = Object.keys(rel.statusCount).sort((a, b) => rel.statusCount[b] - rel.statusCount[a]);
  const maxStatus = Math.max(1, ...statusKeys.map(k => rel.statusCount[k]));

  // ---- Resumo comercial de pedidos (abertos/fechados, unidades, valor, comissão) ----
  // Comissão é % configurável (não vem do SAP); aplica sobre o valor total.
  const [comissaoPct, setComissaoPct] = useState('');
  const resumo = useMemo(() => {
    const peds = ctx.pedidos || [];
    const naoCancel = peds.filter(p => p.status_sap !== 'cancelado');
    let unidades = 0, valor = 0, abertos = 0, fechados = 0;
    const porRep = {};
    naoCancel.forEach(p => {
      const its = p.itens || [];
      const uPed = its.reduce((a, i) => a + (i.qtd_bb || 0), 0);
      const vPed = its.reduce((a, i) => a + (i.valor_total != null ? i.valor_total : (i.qtd_bb || 0) * (i.valor_unitario || 0)), 0);
      unidades += uPed; valor += vPed;
      if (p.status_sap === 'aberto') abertos++;
      if (p.status_sap === 'fechado') fechados++;
      const k = p.vendedor || '—';
      if (!porRep[k]) porRep[k] = { vendedor: k, pedidos: 0, abertos: 0, unidades: 0, valor: 0 };
      porRep[k].pedidos++;
      if (p.status_sap === 'aberto') porRep[k].abertos++;
      porRep[k].unidades += uPed;
      porRep[k].valor += vPed;
    });
    const representantes = Object.values(porRep).sort((a, b) => b.valor - a.valor);
    const cancelados = peds.filter(p => p.status_sap === 'cancelado').length;
    return { abertos, fechados, cancelados, unidades, valor, representantes, nPedidos: naoCancel.length };
  }, [ctx.pedidos]);
  const pct = parseFloat(String(comissaoPct).replace(',', '.')) || 0;
  const comissaoTotal = resumo.valor * pct / 100;

  const exportarResumo = () => {
    const linhas = ['Representante;Pedidos;Abertos;Unidades;Valor total;Comissao (' + pct + '%)'];
    resumo.representantes.forEach(r => {
      linhas.push([r.vendedor, r.pedidos, r.abertos, r.unidades, r.valor.toFixed(2), (r.valor * pct / 100).toFixed(2)].map(c => String(c).replace(/;/g, ',')).join(';'));
    });
    linhas.push(['TOTAL', resumo.nPedidos, resumo.abertos, resumo.unidades, resumo.valor.toFixed(2), comissaoTotal.toFixed(2)].join(';'));
    const blob = new Blob(['﻿' + linhas.join('\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `relatorio_pedidos_${new Date().toISOString().slice(0,10)}.csv`; a.click();
    URL.revokeObjectURL(url);
    ctx.showToast('Relatório exportado', `${resumo.representantes.length} representantes`);
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb"><i className="ti ti-home"></i> Gestão · Relatórios</div>
          <h1 className="page-title">Relatórios</h1>
          <p className="page-subtitle">Visão analítica da carteira aberta no SAP e dos embarques · {rel.abertos.length} pedidos em aberto</p>
        </div>
      </div>

      {/* ===== RESUMO COMERCIAL DE PEDIDOS (abertos/fechados, unidades, valor, comissão) ===== */}
      <div className="panel" style={{ marginBottom: 16 }}>
        <div className="panel-header">
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <i className="ti ti-report-money" style={{ color: 'var(--accent-light)' }}></i>
            <strong style={{ fontSize: 14 }}>Resumo comercial de pedidos</strong>
            <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>SAP · exclui cancelados</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
            <label style={{ fontSize: 12, color: 'var(--text-muted)', display: 'flex', alignItems: 'center', gap: 6 }}>
              Comissão (%)
              <input type="number" step="0.1" min="0" value={comissaoPct} onChange={e => setComissaoPct(e.target.value)} placeholder="ex.: 2"
                style={{ width: 72, padding: '5px 8px', background: 'var(--bg-card)', border: '1px solid var(--border-strong)', borderRadius: 4, color: 'var(--text)', fontFamily: 'inherit', fontSize: 13 }} />
            </label>
            <button className="btn btn-ghost" style={{ fontSize: 12, padding: '6px 10px' }} onClick={exportarResumo}>
              <i className="ti ti-file-export"></i> CSV
            </button>
          </div>
        </div>
        <div className="metrics" style={{ gridTemplateColumns: 'repeat(5, 1fr)' }}>
          <div className="metric"><div className="metric-label"><i className="ti ti-folder-open"></i> Pedidos abertos</div><div className="metric-value" style={{ color: 'var(--green)' }}>{resumo.abertos}</div><div className="metric-delta">com saldo no SAP</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-folder-check"></i> Pedidos fechados</div><div className="metric-value">{resumo.fechados}</div><div className="metric-delta">já atendidos</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-package"></i> Unidades totais</div><div className="metric-value">{fmtNum(resumo.unidades)}</div><div className="metric-delta">em {resumo.nPedidos} pedidos</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-cash"></i> Valor total</div><div className="metric-value" style={{ fontSize: 22 }}>{fmtMoney(resumo.valor)}</div><div className="metric-delta">soma dos pedidos</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-percentage"></i> Comissão total</div><div className="metric-value" style={{ color: pct ? 'var(--accent-light)' : 'var(--text-dim)', fontSize: 22 }}>{pct ? fmtMoney(comissaoTotal) : '—'}</div><div className="metric-delta">{pct ? `${pct}% sobre o valor` : 'defina a % acima'}</div></div>
        </div>
        <table>
          <thead><tr>
            <th>Representante</th>
            <th className="num">Pedidos</th><th className="num">Abertos</th>
            <th className="num">Unidades</th><th className="num">Valor total</th><th className="num">Comissão</th>
          </tr></thead>
          <tbody>
            {resumo.representantes.map(r => (
              <tr key={r.vendedor}>
                <td className="cell-primary">{r.vendedor}</td>
                <td className="num mono">{r.pedidos}</td>
                <td className="num mono" style={{ color: r.abertos ? 'var(--green)' : 'var(--text-dim)' }}>{r.abertos}</td>
                <td className="num mono">{fmtNum(r.unidades)}</td>
                <td className="num mono cell-primary">{fmtMoney(r.valor)}</td>
                <td className="num mono" style={{ color: pct ? 'var(--accent-light)' : 'var(--text-dim)' }}>{pct ? fmtMoney(r.valor * pct / 100) : '—'}</td>
              </tr>
            ))}
          </tbody>
          <tfoot><tr style={{ borderTop: '2px solid var(--border-strong)', fontWeight: 700 }}>
            <td className="cell-primary">TOTAL</td>
            <td className="num mono">{resumo.nPedidos}</td>
            <td className="num mono" style={{ color: 'var(--green)' }}>{resumo.abertos}</td>
            <td className="num mono">{fmtNum(resumo.unidades)}</td>
            <td className="num mono cell-primary">{fmtMoney(resumo.valor)}</td>
            <td className="num mono" style={{ color: pct ? 'var(--accent-light)' : 'var(--text-dim)' }}>{pct ? fmtMoney(comissaoTotal) : '—'}</td>
          </tr></tfoot>
        </table>
      </div>

      {filtrando && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10, fontSize: 12, color: 'var(--text-muted)' }}>
          <span className="chip chip-green"><i className="ti ti-filter"></i> Filtrando grupo: <b style={{ marginLeft: 4 }}>{filtroGrupo}</b></span>
          <button onClick={() => setFiltroGrupo('todos')} style={{ background: 'none', border: 'none', color: 'var(--accent-light)', cursor: 'pointer', fontSize: 12, fontFamily: 'inherit', textDecoration: 'underline' }}>limpar filtro</button>
        </div>
      )}

      <div className="metrics" style={{ gridTemplateColumns: 'repeat(4, 1fr)' }}>
        <div className="metric">
          <div className="metric-label"><i className="ti ti-clipboard-list"></i> Pedidos em aberto{filtrando ? ' (grupo)' : ''}</div>
          <div className="metric-value">{metricas.nPedidos}</div>
          <div className="metric-delta">{filtrando ? `com saldo de ${filtroGrupo}` : `de ${ctx.pedidos.length} no SAP`}</div>
        </div>
        <div className="metric">
          <div className="metric-label"><i className="ti ti-cash"></i> Saldo aberto{filtrando ? ' (grupo)' : ''}</div>
          <div className="metric-value" style={{ color: 'var(--green)', fontSize: 22 }}>{fmtMoney(metricas.saldoVal)}</div>
          <div className="metric-delta">{fmtNum(metricas.bbs)} un. a embarcar</div>
        </div>
        <div className="metric">
          <div className="metric-label"><i className="ti ti-truck"></i> OEs ativas</div>
          <div className="metric-value">{rel.ativas.length}</div>
          <div className="metric-delta">{fmtNum(rel.bbsOE)} un. · {fmtMoney(rel.valorOE)}</div>
        </div>
        <div className="metric">
          <div className="metric-label" style={{ color: metricas.atrasados ? 'var(--red)' : undefined }}><i className="ti ti-alert-triangle"></i> Pedidos atrasados{filtrando ? ' (grupo)' : ''}</div>
          <div className="metric-value" style={{ color: metricas.atrasados ? 'var(--red)' : 'var(--green)' }}>{metricas.atrasados}</div>
          <div className="metric-delta">entrega vencida com saldo</div>
        </div>
      </div>

      <div className="panel" style={{ marginBottom: 16 }}>
        <div className="panel-header"><div><div className="panel-title">OEs por status</div><div className="panel-sub">Distribuição atual das ordens de embarque</div></div></div>
        <div style={{ padding: '16px 20px' }}>
          {statusKeys.length === 0 ? (
            <div style={{ color: 'var(--text-muted)', fontSize: 13 }}>Nenhuma OE criada ainda.</div>
          ) : statusKeys.map(k => (
            <RelBar key={k} label={STATUS_LABEL_REL[k] || k} valor={rel.statusCount[k]} max={maxStatus} cor={STATUS_COR_REL[k]} right={rel.statusCount[k] + ' OE'} />
          ))}
        </div>
      </div>

      <div className="panel" style={{ marginBottom: 16 }}>
        <div className="panel-header">
          <div>
            <div className="panel-title">Carteira aberta por cultivar</div>
            <div className="panel-sub">Saldo a embarcar agrupado por item · {cultivaresFiltrados.length} itens</div>
          </div>
          {rel.gruposItem.length > 0 && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
              <span style={{ fontSize: 10, color: 'var(--text-muted)', fontWeight: 700, letterSpacing: '0.04em', textTransform: 'uppercase' }}>Grupo de itens</span>
              <select className="input" style={{ width: 'auto', padding: '6px 10px', fontSize: 12 }}
                value={filtroGrupo} onChange={e => { setFiltroGrupo(e.target.value); setVerTodosCult(false); }}>
                <option value="todos">Todos os grupos</option>
                {rel.gruposItem.map(g => <option key={g} value={g}>{g}</option>)}
              </select>
            </div>
          )}
        </div>
        <div style={{ padding: '16px 20px' }}>
          {cultivaresFiltrados.length === 0 ? (
            <div style={{ color: 'var(--text-muted)', fontSize: 13 }}>Sem saldo aberto.</div>
          ) : (
            <>
              {cultivaresVisiveis.map(c => (
                <RelBar key={c.cultivar} code={c.codigo} label={c.cultivar} valor={c.bbs} max={maxCultivar} cor="var(--accent)" right={fmtNum(c.bbs) + ' un.'} sub={fmtMoney(c.valor)} />
              ))}
              {cultivaresFiltrados.length > 10 && (
                <button onClick={() => setVerTodosCult(v => !v)} style={{
                  marginTop: 6, background: 'none', border: '1px solid var(--border-strong)',
                  color: 'var(--accent-light)', padding: '7px 14px', borderRadius: 6,
                  fontSize: 12, fontFamily: 'inherit', cursor: 'pointer', fontWeight: 600
                }}>
                  {verTodosCult ? '▲ Ver menos' : `▼ Ver mais (${cultivaresFiltrados.length - 10} itens)`}
                </button>
              )}
              {/* Totalizador — soma de tudo que está filtrado */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginTop: 14, paddingTop: 12, borderTop: '2px solid var(--border-strong)' }}>
                <div style={{ flex: 1, minWidth: 0, fontSize: 13, fontWeight: 700 }}>
                  Total{filtroGrupo !== 'todos' ? ` · ${filtroGrupo}` : ''}{' '}
                  <span style={{ color: 'var(--text-muted)', fontWeight: 400 }}>({cultivaresFiltrados.length} itens)</span>
                </div>
                <div style={{ width: 160, flex: '0 0 160px' }}></div>
                <div style={{ width: 90, flex: '0 0 90px', textAlign: 'right', fontFamily: "'JetBrains Mono', monospace", fontSize: 12, fontWeight: 700 }}>{fmtNum(totalCultBBs)} un.</div>
                <div style={{ width: 130, flex: '0 0 130px', textAlign: 'right', fontFamily: "'JetBrains Mono', monospace", fontSize: 12, fontWeight: 700, color: 'var(--green)' }}>{fmtMoney(totalCultValor)}</div>
              </div>
            </>
          )}
        </div>
      </div>

      <div className="panel" style={{ marginBottom: 16 }}>
        <div className="panel-header"><div><div className="panel-title">Carteira aberta por vendedor</div><div className="panel-sub">Valor em aberto e nº de pedidos por vendedor</div></div></div>
        <div style={{ padding: '16px 20px' }}>
          {rel.vendedores.length === 0 ? (
            <div style={{ color: 'var(--text-muted)', fontSize: 13 }}>Sem dados.</div>
          ) : rel.vendedores.map(v => (
            <RelBar key={v.vendedor} code={v.codigo ? `cód ${v.codigo}` : ''} label={v.vendedor} valor={v.valor} max={maxVend} cor="var(--blue)" right={v.pedidos + ' ped.'} sub={fmtMoney(v.valor)} />
          ))}
        </div>
      </div>

      <div className="panel">
        <div className="panel-header"><div><div className="panel-title" style={{ color: rel.atrasados.length ? 'var(--red)' : undefined }}>Pedidos atrasados</div><div className="panel-sub">Entrega prevista vencida e ainda com saldo · ordenado pelos mais atrasados</div></div></div>
        <div style={{ overflowX: 'auto' }}>
          {rel.atrasados.length === 0 ? (
            <div style={{ padding: '16px 20px', color: 'var(--green)', fontSize: 13 }}><i className="ti ti-circle-check"></i> Nenhum pedido atrasado. Carteira em dia.</div>
          ) : (
            <table style={{ width: '100%', minWidth: 620 }}>
              <thead><tr><th>Pedido</th><th>Cliente</th><th>Vendedor</th><th>Entrega</th><th style={{ textAlign: 'right' }}>Atraso</th><th style={{ textAlign: 'right' }}>Saldo</th></tr></thead>
              <tbody>
                {rel.atrasados.slice(0, 12).map(p => (
                  <tr key={p.numero}>
                    <td style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>{p.numero}</td>
                    <td>{p.cliente}</td>
                    <td style={{ color: 'var(--text-muted)' }}>{p.vendedor || '—'}</td>
                    <td>{fmtDate(p.data_entrega)}</td>
                    <td style={{ textAlign: 'right', color: 'var(--red)', fontWeight: 600 }}>{p.diasAtraso}d</td>
                    <td style={{ textAlign: 'right', fontFamily: "'JetBrains Mono', monospace" }}>{fmtMoney(p.saldo)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
};

// ============================================================
// EMBARQUES (HUB) — unifica Lista (consulta) e Calendário numa área só.
// Substitui as antigas telas separadas Agendamentos / Calendário / Consulta.
// ============================================================
const EmbarquesHub = ({ ctx }) => {
  const [view, setView] = useState('lista'); // 'lista' | 'calendario'
  const ToggleBtn = ({ id, icon, label }) => (
    <button
      onClick={() => setView(id)}
      style={{
        display: 'flex', alignItems: 'center', gap: 6,
        padding: '7px 14px', borderRadius: 6, cursor: 'pointer',
        fontSize: 13, fontWeight: 600, fontFamily: 'inherit',
        background: view === id ? 'var(--accent-glow)' : 'transparent',
        color: view === id ? 'var(--accent-light)' : 'var(--text-muted)',
        border: '1px solid ' + (view === id ? 'var(--accent)' : 'var(--border)'),
        transition: 'all 0.15s',
      }}
    >
      <i className={'ti ' + icon}></i> {label}
    </button>
  );
  return (
    <div>
      <div style={{ display: 'flex', gap: 6, marginBottom: 16, alignItems: 'center', flexWrap: 'wrap' }}>
        <span style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--text-dim)', marginRight: 4, fontWeight: 600 }}>Visualizar como</span>
        <ToggleBtn id="lista" icon="ti-list-details" label="Lista" />
        <ToggleBtn id="calendario" icon="ti-calendar" label="Calendário" />
      </div>
      {view === 'lista' ? <Embarques ctx={ctx} /> : <Calendario ctx={ctx} />}
    </div>
  );
};

// ============================================================
// SIDEBAR
// ============================================================
const Sidebar = ({ ctx }) => {
  const collapsed = ctx.sidebarCollapsed;
  const aguardandoConf = ctx.state.ordens.filter(o =>
    o.modalidade !== 'TRIANGULAR' && (o.status === 'PROGRAMADA' || o.status === 'EM_CONFERENCIA')
  ).length;
  const aguardandoTriang = ctx.state.ordens.filter(o =>
    o.modalidade === 'TRIANGULAR' && ['PROGRAMADA', 'NOTA_TROCADA'].includes(o.status)
  ).length;
  const programadas = ctx.state.ordens.filter(o => o.status === 'PROGRAMADA').length;

  const todosItems = [
    { id: 'dashboard', icon: 'ti-layout-dashboard', label: 'Painel', perfis: ['OPERADOR','GESTOR'] },
    { id: 'relatorios', icon: 'ti-chart-bar', label: 'Relatórios', perfis: ['GESTOR','OPERADOR'] },
    { id: 'embarques', icon: 'ti-truck-delivery', label: 'Embarques', badge: programadas || null, perfis: ['OPERADOR','GESTOR'] },
    { id: 'embarque-fornecedores', icon: 'ti-truck-loading', label: 'Embarque - Fornecedores', perfis: ['OPERADOR','GESTOR'] },
    { id: 'conferencia', icon: 'ti-device-tablet', label: 'Conferência', badge: aguardandoConf || null,

// Gráfico de pizza simples em SVG (sem biblioteca externa).
// dados: [{ label, value, color }]
const PieChart = ({ dados, size = 150 }) => {
  const ativos = (dados || []).filter(d => (d.value || 0) > 0);
  const total = ativos.reduce((a, d) => a + d.value, 0);
  const r = size / 2, cx = r, cy = r, raio = r - 1;
  if (total === 0) {
    return <svg width={size} height={size}><circle cx={cx} cy={cy} r={raio} fill="var(--bg-card)" /></svg>;
  }
  if (ativos.length === 1) {
    return <svg width={size} height={size}><circle cx={cx} cy={cy} r={raio} fill={ativos[0].color} /></svg>;
  }
  let acc = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {ativos.map((d, i) => {
        const start = (acc / total) * 2 * Math.PI;
        acc += d.value;
        const end = (acc / total) * 2 * Math.PI;
        const x1 = cx + raio * Math.sin(start), y1 = cy - raio * Math.cos(start);
        const x2 = cx + raio * Math.sin(end), y2 = cy - raio * Math.cos(end);
        const large = (end - start) > Math.PI ? 1 : 0;
        const path = `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${raio} ${raio} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
        return <path key={i} d={path} fill={d.color} stroke="var(--bg-elev)" strokeWidth="1.5" />;
      })}
    </svg>
  );
};

const StatusChip = ({ status }) => {

    'ENTREGUE': { chip: 'chip-green', icon: 'ti-check', label: 'Entregue' },
    'CANCELADA': { chip: 'chip-red', icon: 'ti-x', label: 'Cancelada' },
  };
  const m = map[status] || map.PROGRAMADA;
  return <span className={`chip ${m.chip}`}><i className={`ti ${m.icon}`}></i> {m.label}</span>;
};
