);


// ============================================================
// NOVA OE (WIZARD) — suporta múltiplas paradas (multi-cliente)
// ============================================================
const NovaOE = ({ ctx, editMode }) => {
  const initial = ctx.editingOE || {};
  const isEditing = !!(editMode && initial.id);

  // Modalidade global (vale para todas as paradas)
  const [modalidade, setModalidade] = useState(initial.modalidade || 'ESTOQUE_PROPRIO');
  const [fornecedor, setFornecedor] = useState(initial.fornecedor_nome || '');
  const [fornecedorCodigo, setFornecedorCodigo] = useState(initial.fornecedor_codigo || '');
  const [fornecedor_endereco, setFornecedorEndereco] = useState(initial.fornecedor_endereco || '');
  const [fornBusca, setFornBusca] = useState('');
  const [fornAberto, setFornAberto] = useState(false);
  // Lista de fornecedores: reais do SAP (código + nome + endereço) com fallback ao mock.
  const listaFornecedores = (DADOS_FORNECEDORES && DADOS_FORNECEDORES.length)
    ? DADOS_FORNECEDORES
    : (AUXILIARES.fornecedores || []).map(n => ({ codigo: '', nome: n, endereco: '' }));
  const fornFiltrados = (() => {
    const t = (fornBusca || '').toLowerCase().trim();
    const l = t ? listaFornecedores.filter(f => (f.nome || '').toLowerCase().includes(t) || (f.codigo || '').toLowerCase().includes(t)) : listaFornecedores;
    return l.slice(0, 60);
  })();

  // PARADAS: array de { ordem_carga, ordem_descarga, pedidosNumeros: string[], itensSelecionados[] }
  // pedidosNumeros permite múltiplos pedidos no mesmo cliente (mesmo local de descarga)
  const [paradas, setParadas] = useState(() => {
    if (initial.paradas && initial.paradas.length > 0) {
      return initial.paradas.map(p => ({
        id: p.id || ('p_' + Math.random().toString(36).slice(2,8)),
        ordem_carga: p.ordem_carga,
        ordem_descarga: p.ordem_descarga,
        // Suporta retrocompatibilidade: pedido_numero (string) ou pedidos_numeros (array)
        pedidosNumeros: p.pedidos_numeros && p.pedidos_numeros.length > 0
          ? p.pedidos_numeros
          : (p.pedido_numero ? [p.pedido_numero] : []),
        itensSelecionados: p.itens || []
      }));
    }
    if (initial.itens && initial.itens.length > 0) {
      return [{
        id: 'p_init',
        ordem_carga: 1,
        ordem_descarga: 1,
        pedidosNumeros: initial.pedido_numero ? [initial.pedido_numero] : [],
        itensSelecionados: initial.itens
      }];
    }
    return [{
      id: 'p_' + Math.random().toString(36).slice(2,8),
      ordem_carga: 1,
      ordem_descarga: 1,
      // Pré-seleciona o pedido quando a OE foi iniciada via "Criar OE deste pedido"
      // (editingOE traz pedido_numero sem itens). Sem isso, o pedido de origem se perde.
      pedidosNumeros: initial.pedido_numero ? [initial.pedido_numero] : [],
      itensSelecionados: []
    }];
  });

  const [paradaAtivaIdx, setParadaAtivaIdx] = useState(0);

  // Dados gerais
  const [motorista_nome, setMotoristaNome] = useState(initial.motorista_nome || '');
  const [motorista_cpf, setMotoristaCpf] = useState(initial.motorista_cpf || '');
  const [motorista_cnh, setMotoristaCnh] = useState(initial.motorista_cnh || '');
  const [motorista_telefone, setMotoristaTelefone] = useState(initial.motorista_telefone || '');
  const [transportadora_nome, setTransportadoraNome] = useState(initial.transportadora_nome || '');
  const [transportadora_cnpj, setTransportadoraCnpj] = useState(initial.transportadora_cnpj || '');
  const [veiculo_placa, setVeiculoPlaca] = useState(initial.veiculo_placa || '');
  const [veiculo_placa_uf, setVeiculoPlacaUf] = useState(initial.veiculo_placa_uf || 'BA');
  const [veiculo_tipo, setVeiculoTipo] = useState(initial.veiculo_tipo || '');
  const [veiculo_reboque, setVeiculoReboque] = useState(initial.veiculo_reboque || '');
  const [data_prevista, setDataPrevista] = useState(initial.data_prevista || addDays(todayISO(), 1));
  const [hora_prevista, setHoraPrevista] = useState(initial.hora_prevista || '08:00');
  const [doca, setDoca] = useState(initial.doca || 'Doca 03');
  const [observacoes, setObservacoes] = useState(initial.observacoes || '');

  const [busca, setBusca] = useState('');

  const paradaAtiva = paradas[paradaAtivaIdx];
  // Pedidos da parada ativa (array)
  const pedidosAtivos = useMemo(() =>
    paradaAtiva ? (paradaAtiva.pedidosNumeros || []).map(num => ctx.pedidos.find(p => p.numero === num)).filter(Boolean) : [],
    [ctx.pedidos, paradaAtiva?.pedidosNumeros]
  );
  // Cliente da parada ativa (do primeiro pedido)
  const clienteParadaAtiva = pedidosAtivos[0]?.cliente || null;

  // Toggle pedido na parada ativa (clique alterna)
  // Validação: todos os pedidos da mesma parada devem ser do mesmo cliente
  const togglePedidoParadaAtiva = (numero) => {
    const pedido = ctx.pedidos.find(p => p.numero === numero);
    if (!pedido) return;
    setParadas(prev => prev.map((p, idx) => {
      if (idx !== paradaAtivaIdx) return p;
      const atuais = p.pedidosNumeros || [];
      const jaTem = atuais.includes(numero);
      if (jaTem) {
        // Remove + zera itens desse pedido
        const restantes = atuais.filter(n => n !== numero);
        const itensRestantes = (p.itensSelecionados || []).filter(it => it.pedido_numero !== numero);
        return { ...p, pedidosNumeros: restantes, itensSelecionados: itensRestantes };
      }
      // Adicionar: valida cliente
      if (atuais.length > 0) {
        const primeiro = ctx.pedidos.find(pp => pp.numero === atuais[0]);
        if (primeiro && primeiro.cliente !== pedido.cliente) {
          alert(`Não é possível adicionar pedidos de clientes diferentes na mesma parada.\n\nCliente atual: ${primeiro.cliente}\nPedido novo: ${pedido.cliente}\n\nUse uma nova parada para outro cliente.`);
          return p;
        }
      }
      return { ...p, pedidosNumeros: [...atuais, numero] };
    }));
  };

  const handleSetLotesParadaAtiva = (codigoItem, lotesAlocados, pedidoNumero) => {
    const qtdTotal = lotesAlocados.reduce((a,l) => a + l.qtd_bb, 0);
    setParadas(prev => prev.map((p, idx) => {
      if (idx !== paradaAtivaIdx) return p;
      const itensAtuais = p.itensSelecionados || [];
      // Identifica item por (codigo + pedido_numero) — pedidos diferentes podem ter o mesmo código
      const existente = itensAtuais.findIndex(i => i.codigo === codigoItem && i.pedido_numero === pedidoNumero);

      // Zerou tudo: remove
      if (qtdTotal === 0) {
        return {
          ...p,
          itensSelecionados: existente >= 0 ? itensAtuais.filter((_, i) => i !== existente) : itensAtuais
        };
      }

      // Acha o pedido e item no contexto
      const pedidoFonte = ctx.pedidos.find(pp => pp.numero === pedidoNumero);
      const itemPedido = pedidoFonte?.itens.find(i => i.codigo === codigoItem);
      if (!itemPedido && existente < 0) return p;

      const itemBase = existente >= 0 ? itensAtuais[existente] : {
        codigo: itemPedido.codigo,
        descricao: itemPedido.descricao,
        cultivar_nome: itemPedido.cultivar_nome,
        obtentor: itemPedido.obtentor,
        tsi: itemPedido.tsi,
        valor_unitario: itemPedido.valor_unitario,
        sap_line_num: itemPedido.sap_line_num,
        unidade: itemPedido.unidade,
        embalagem: itemPedido.embalagem || itemPedido.unidade,
        pedido_numero: pedidoNumero,  // rastreia origem
      };
      const novoItem = {
        ...itemBase,
        qtd_bb: qtdTotal,
        lotes_alocados: lotesAlocados,
        lotes_informados: lotesAlocados.length > 0,
        lotes: lotesAlocados.map(la => la.lote_codigo)
      };
      let novosItens;
      if (existente >= 0) {
        novosItens = [...itensAtuais];
        novosItens[existente] = novoItem;
      } else {
        novosItens = [...itensAtuais, novoItem];
      }
      return { ...p, itensSelecionados: novosItens };
    }));
  };

  // Adicionar parada
  const adicionarParada = () => {
    if (paradas.length >= 6) return;
    setParadas(prev => {
      const novaOrdemCarga = prev.length + 1;
      // Por padrão: ordem descarga inversa (primeiro a carregar = último a descarregar)
      const novaParada = {
        id: 'p_' + Math.random().toString(36).slice(2,8),
        ordem_carga: novaOrdemCarga,
        ordem_descarga: novaOrdemCarga, // por padrão mesma ordem, usuário ajusta
        pedidosNumeros: [],
        itensSelecionados: []
      };
      const lista = [...prev, novaParada];
      // Recalcula ordem_descarga automaticamente: descarga inversa da carga
      const total = lista.length;
      return lista.map(p => ({ ...p, ordem_descarga: total - p.ordem_carga + 1 }));
    });
    setParadaAtivaIdx(paradas.length); // foca na nova
  };

  const removerParada = (idx) => {
    if (paradas.length <= 1) return;
    if (!confirm('Remover esta parada e todos os seus itens?')) return;
    setParadas(prev => {
      const nova = prev.filter((_, i) => i !== idx);
      // Renumera ordem_carga e ordem_descarga
      return nova.map((p, i) => ({
        ...p,
        ordem_carga: i + 1,
        ordem_descarga: nova.length - i
      }));
    });
    if (paradaAtivaIdx >= idx && paradaAtivaIdx > 0) {
      setParadaAtivaIdx(paradaAtivaIdx - 1);
    }
  };

  const setOrdemCarga = (idx, novaOrdem) => {
    setParadas(prev => {
      // Reordena: a parada idx vai pra posição novaOrdem-1
      const semEla = prev.filter((_, i) => i !== idx);
      const movida = prev[idx];
      const novoArr = [...semEla];
      novoArr.splice(novaOrdem - 1, 0, movida);
      // Renumera
      const total = novoArr.length;
      return novoArr.map((p, i) => ({
        ...p,
        ordem_carga: i + 1,
        ordem_descarga: total - i
      }));
    });
    // Ajusta o paradaAtivaIdx para a posição nova
    setParadaAtivaIdx(novaOrdem - 1);
  };

  // Validações
  const podeConfirmar = useMemo(() => {
    const temPedido = (p) => (p.pedidosNumeros && p.pedidosNumeros.length > 0);
    // Pelo menos uma parada precisa ter pedido + itens
    const paradasValidas = paradas.filter(p => temPedido(p) && p.itensSelecionados.length > 0);
    if (paradasValidas.length === 0) return false;
    // Todas as paradas devem ter pedido E itens (nenhuma incompleta)
    if (paradas.some(p => temPedido(p) && p.itensSelecionados.length === 0)) return false;
    if (paradas.some(p => !temPedido(p) && p.itensSelecionados.length > 0)) return false;
    if (!motorista_nome || !motorista_cpf || !veiculo_placa || !veiculo_placa_uf) return false;
    // Validação de placa: AAA-1B23 (Mercosul) ou AAA-1111 (antiga)
    const placaOk = /^[A-Z]{3}-\d[A-Z0-9]\d{2}$/.test(veiculo_placa);
    if (!placaOk) return false;
    if (modalidade === 'TRIANGULAR' && !fornecedor) return false;
    return true;
  }, [paradas, motorista_nome, motorista_cpf, veiculo_placa, veiculo_placa_uf, modalidade, fornecedor]);

  const totais = useMemo(() => {
    let bb = 0, valor = 0;
    paradas.forEach(p => {
      p.itensSelecionados.forEach(i => {
        bb += i.qtd_bb;
        valor += i.qtd_bb * i.valor_unitario;
      });
    });
    return { bb, valor, peso_estimado: bb * PESO_BB_KG };
  }, [paradas]);

  const handleSalvar = () => {
    if (!podeConfirmar) return;

    // Filtra apenas paradas com pedidos e itens
    const paradasFinais = paradas
      .filter(p => p.pedidosNumeros && p.pedidosNumeros.length > 0 && p.itensSelecionados.length > 0)
      .map((p) => {
        // Cliente vem do primeiro pedido (todos os pedidos da parada são do mesmo cliente)
        const primeiroPedido = ctx.pedidos.find(pp => pp.numero === p.pedidosNumeros[0]);
        // Dados agregados de TODOS os pedidos da parada
        const pedidosDaParada = p.pedidosNumeros.map(num => ctx.pedidos.find(pp => pp.numero === num)).filter(Boolean);
        // Local de entrega: pega do primeiro (assumindo que mesmos clientes têm mesmo local)
        return {
          id: p.id,
          ordem_carga: p.ordem_carga,
          ordem_descarga: p.ordem_descarga,
          cliente: primeiroPedido?.cliente || '',
          pedidos_numeros: p.pedidosNumeros,            // NOVO: array de pedidos
          pedido_numero: p.pedidosNumeros[0] || '',     // Legado: primeiro
          pedidos_detalhes: pedidosDaParada.map(pp => ({
            numero: pp.numero,
            data_emissao: pp.data_emissao,
            data_entrega: pp.data_entrega,
            vendedor: pp.vendedor
          })),
          pedido_data_emissao: primeiroPedido?.data_emissao,
          pedido_data_entrega: primeiroPedido?.data_entrega,
          pedido_local_entrega: primeiroPedido?.local_entrega,
          vendedor: primeiroPedido?.vendedor || '',
          itens: p.itensSelecionados,
          modalidade
        };
      });

    // Para compatibilidade: se só uma parada, também preenche campos antigos
    const primeira = paradasFinais[0];
    const dadosOE = {
      modalidade,
      paradas: paradasFinais,
      // Campos legados (1ª parada)
      cliente: primeira.cliente,
      pedido_numero: primeira.pedido_numero,
      pedido_data_emissao: primeira.pedido_data_emissao,
      pedido_data_entrega: primeira.pedido_data_entrega,
      pedido_local_entrega: primeira.pedido_local_entrega,
      vendedor: primeira.vendedor,
      itens: primeira.itens,

      motorista_nome, motorista_cpf, motorista_cnh, motorista_telefone,
      transportadora_nome, transportadora_cnpj,
      veiculo_placa, veiculo_placa_uf, veiculo_tipo, veiculo_reboque,
      data_prevista, hora_prevista, doca, observacoes,
      fornecedor_nome: modalidade === 'TRIANGULAR' ? fornecedor : null,
      fornecedor_codigo: modalidade === 'TRIANGULAR' ? fornecedorCodigo : null,
      fornecedor_endereco: modalidade === 'TRIANGULAR' ? fornecedor_endereco : null,
    };

    if (isEditing) {
      ctx.editarOE(initial.id, dadosOE);
    } else {
      ctx.criarOE(dadosOE);
    }
    ctx.setEditingOE(null);
    ctx.setScreen(isEditing ? 'detalhe-oe' : 'agendamentos');
    if (isEditing) {
      ctx.setViewingOE({ ...initial, ...dadosOE });
    }
  };

  // Pendências para mensagem amigável
  const pendencias = useMemo(() => {
    const pends = [];
    paradas.forEach((p, i) => {
      if (!p.pedidosNumeros || p.pedidosNumeros.length === 0) pends.push(`Parada ${i+1}: pedido`);
      else if (p.itensSelecionados.length === 0) pends.push(`Parada ${i+1}: itens`);
    });
    if (!motorista_nome) pends.push('motorista');
    if (!motorista_cpf) pends.push('CPF do motorista');
    if (!veiculo_placa) pends.push('placa');
    else if (!/^[A-Z]{3}-\d[A-Z0-9]\d{2}$/.test(veiculo_placa)) pends.push('formato da placa (AAA-1B23 ou AAA-1111)');
    if (!veiculo_placa_uf) pends.push('UF da placa');
    if (modalidade === 'TRIANGULAR' && !fornecedor) pends.push('fornecedor');
    return pends;
  }, [paradas, motorista_nome, motorista_cpf, veiculo_placa, veiculo_placa_uf, modalidade, fornecedor]);

  // Helper: label de campo obrigatório (asterisco laranja) ou opcional
  const Lab = ({ children, obrig }) => (
    <label className="field-label" style={obrig ? { color: 'var(--orange)' } : {}}>
      {children}{obrig && <span style={{ marginLeft: 3 }}>*</span>}
    </label>
  );

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb">
            <i className="ti ti-home"></i>
            <span style={{cursor:'pointer', color:'var(--accent-light)'}} onClick={() => ctx.setScreen('agendamentos')}>Agendamentos</span>
            <span>·</span>
            <span>{isEditing ? `Editar ${initial.numero}` : 'Nova OE'}</span>
          </div>
          <h1 className="page-title">{isEditing ? `Editar ${initial.numero}` : 'Nova ordem de embarque'}</h1>
          <p className="page-subtitle">
            {isEditing ? `Modificando ordem existente · status atual mantido` : 'Suporta até 6 paradas (multi-cliente) com emblocamento no caminhão'}
          </p>
        </div>
        <button className="btn btn-ghost" onClick={() => { ctx.setEditingOE(null); ctx.setScreen(isEditing ? 'detalhe-oe' : 'agendamentos'); }}>
          <i className="ti ti-x"></i> Cancelar
        </button>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 16 }}>
        <div>
          {/* MODALIDADE */}
          <div className="panel">
            <div className="panel-header">
              <div className="panel-title">1. Modalidade de operação</div>
            </div>
            <div style={{ padding: '14px 18px' }}>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                <div className={`modality-card ${modalidade === 'ESTOQUE_PROPRIO' ? 'selected' : ''}`} onClick={() => setModalidade('ESTOQUE_PROPRIO')}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
                    <i className="ti ti-building-warehouse" style={{ fontSize: 24, color: 'var(--accent-light)' }}></i>
                    <div className="modality-check"><i className="ti ti-check"></i></div>
                  </div>
                  <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 4 }}>Estoque próprio</div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', lineHeight: 1.5 }}>
                    Mercadoria sai do nosso armazém. Baixa direta no estoque via <span className="mono" style={{color:'var(--text)'}}>Delivery Note</span> do SAP.
                  </div>
                </div>
                <div className={`modality-card ${modalidade === 'TRIANGULAR' ? 'selected' : ''}`} onClick={() => setModalidade('TRIANGULAR')}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
                    <i className="ti ti-arrows-shuffle" style={{ fontSize: 24, color: 'var(--blue)' }}></i>
                    <div className="modality-check"><i className="ti ti-check"></i></div>
                  </div>
                  <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 4 }}>Triangular</div>
                  <div style={{ fontSize: 11, color: 'var(--text-muted)', lineHeight: 1.5 }}>
                    Carrega no fornecedor, entrega ao cliente. <strong style={{ color: 'var(--orange)' }}>NÃO movimenta estoque do SAP.</strong>
                  </div>
                </div>
              </div>

              {modalidade === 'TRIANGULAR' && (
                <div style={{ marginTop: 14, padding: 14, background: 'var(--bg-card)', border: '1px solid var(--blue)', borderLeft: '3px solid var(--blue)', borderRadius: 6 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 12 }}>
                    <i className="ti ti-truck-loading" style={{ fontSize: 14, color: 'var(--blue)' }}></i>
                    <span style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.08em' }}>Local de carregamento (Fornecedor)</span>
                  </div>
                  <div className="field">
                    <Lab obrig>Fornecedor</Lab>
                    <div style={{ position: 'relative' }}>
                      <input className="input"
                        value={fornAberto ? fornBusca : (fornecedor ? (fornecedorCodigo ? `${fornecedorCodigo} - ${fornecedor}` : fornecedor) : '')}
                        onChange={e => { setFornBusca(e.target.value); setFornAberto(true); }}
                        onFocus={() => { setFornBusca(''); setFornAberto(true); }}
                        onBlur={() => setTimeout(() => setFornAberto(false), 150)}
                        placeholder="Buscar fornecedor por nome ou código..."
                        style={{ borderColor: !fornecedor ? 'var(--orange)' : 'var(--border-strong)' }}
                      />
                      {fornAberto && (
                        <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 60, marginTop: 2,
                          background: 'var(--bg-elev)', border: '1px solid var(--border-strong)', borderRadius: 6,
                          maxHeight: 260, overflowY: 'auto', boxShadow: '0 8px 24px rgba(0,0,0,0.45)' }}>
                          {fornFiltrados.length === 0 ? (
                            <div style={{ padding: 10, color: 'var(--text-muted)', fontSize: 13 }}>Nenhum fornecedor encontrado</div>
                          ) : fornFiltrados.map(f => (
                            <div key={(f.codigo || '') + f.nome}
                              onMouseDown={() => {
                                setFornecedor(f.nome);
                                setFornecedorCodigo(f.codigo || '');
                                if (f.endereco) setFornecedorEndereco(f.endereco);
                                setFornAberto(false); setFornBusca('');
                              }}
                              style={{ padding: '8px 10px', cursor: 'pointer', fontSize: 13, borderBottom: '1px solid var(--border)' }}
                              onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover)'}
                              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                            >
                              {f.codigo ? <span className="mono" style={{ color: 'var(--text-muted)', fontSize: 11, marginRight: 6 }}>{f.codigo}</span> : null}
                              <span>{f.nome}</span>
                              {f.cidade ? <span className="cell-muted" style={{ fontSize: 11, marginLeft: 6 }}>· {f.cidade}{f.uf ? '/' + f.uf : ''}</span> : null}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    {fornecedorCodigo && (
                      <div className="cell-muted" style={{ fontSize: 11, marginTop: 4 }}>
                        Código SAP do fornecedor: <span className="mono">{fornecedorCodigo}</span>
                      </div>
                    )}
                  </div>
                  <div className="field" style={{ marginBottom: 0 }}>
                    <label className="field-label">Endereço de carregamento</label>
                    <input className="input" value={fornecedor_endereco} onChange={e => setFornecedorEndereco(e.target.value)} placeholder="Endereço completo do fornecedor" />
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* PARADAS (MULTI-CLIENTE) */}
          <div className="panel">
            <div className="panel-header">
              <div>
                <div className="panel-title">2. Paradas e emblocamento no caminhão</div>
                <div className="panel-sub">
                  {paradas.length === 1
                    ? 'Uma parada · cliente único'
                    : `${paradas.length} paradas · emblocamento ativo (primeiro a carregar = último a descarregar)`}
                </div>
              </div>
              {paradas.length < 6 && (
                <button className="btn btn-ghost" style={{ fontSize: 11, padding: '6px 12px' }} onClick={adicionarParada}>
                  <i className="ti ti-plus"></i> Adicionar parada
                </button>
              )}
            </div>

            {/* Resumo do emblocamento — mostra quando há 2+ paradas */}
            {paradas.length > 1 && (
              <div style={{ padding: '12px 18px', background: 'var(--bg-card)', borderBottom: '1px solid var(--border)' }}>
                <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 700, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 6 }}>
                  <i className="ti ti-truck-loading" style={{ fontSize: 12, color: 'var(--accent-light)' }}></i> Sequência de carregamento e descarga
                </div>
                <CaminhaoVisual paradas={paradas} />
              </div>
            )}

            {/* Abas das paradas */}
            <div style={{ padding: '12px 18px 0', borderBottom: '1px solid var(--border)', display: 'flex', gap: 4, overflowX: 'auto' }}>
              {paradas.map((p, idx) => {
                const primeiroPed = (p.pedidosNumeros && p.pedidosNumeros[0]) ? ctx.pedidos.find(pp => pp.numero === p.pedidosNumeros[0]) : null;
                const isAtiva = idx === paradaAtivaIdx;
                const numBB = p.itensSelecionados.reduce((a,i) => a + i.qtd_bb, 0);
                const numPedidos = (p.pedidosNumeros || []).length;
                return (
                  <div key={p.id} style={{ position: 'relative' }}>
                    <button
                      onClick={() => setParadaAtivaIdx(idx)}
                      style={{
                        background: isAtiva ? 'var(--bg-elev)' : 'transparent',
                        color: isAtiva ? 'var(--text)' : 'var(--text-muted)',
                        border: 'none',
                        borderBottom: '2px solid ' + (isAtiva ? 'var(--accent)' : 'transparent'),
                        padding: '10px 14px',
                        fontFamily: 'inherit',
                        cursor: 'pointer',
                        fontSize: 12,
                        fontWeight: 600,
                        display: 'flex',
                        alignItems: 'center',
                        gap: 8,
                        whiteSpace: 'nowrap'
                      }}
                    >
                      <span style={{
                        width: 22, height: 22, borderRadius: 11,
                        background: isAtiva ? 'var(--accent)' : 'var(--bg-card)',
                        color: isAtiva ? 'white' : 'var(--text-muted)',
                        display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                        fontSize: 11, fontWeight: 700, fontFamily: 'JetBrains Mono, monospace'
                      }}>
                        {p.ordem_carga}
                      </span>
                      <span>{primeiroPed ? primeiroPed.cliente.split(' ').slice(0,2).join(' ') : `Parada ${idx+1}`}</span>
                      {numPedidos > 1 && (
                        <span style={{ fontSize: 9, padding: '1px 5px', background: 'var(--accent)', color: 'white', borderRadius: 8, fontWeight: 700 }}>
                          {numPedidos} pedidos
                        </span>
                      )}
                      {numBB > 0 && (
                        <span style={{ fontSize: 10, color: 'var(--accent-light)', fontFamily: 'JetBrains Mono, monospace' }}>
                          ({numBB} un.)
                        </span>
                      )}
                    </button>
                    {paradas.length > 1 && isAtiva && (
                      <button
                        onClick={() => removerParada(idx)}
                        style={{
                          position: 'absolute', top: 6, right: -4,
                          width: 16, height: 16, borderRadius: '50%',
                          background: 'var(--red-bg)', border: '1px solid var(--red)',
                          color: 'var(--red)', cursor: 'pointer',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          fontSize: 9, padding: 0
                        }}
                        title="Remover parada"
                      >
                        <i className="ti ti-x" style={{ fontSize: 10 }}></i>
                      </button>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Conteúdo da parada ativa */}
            {paradaAtiva && (
              <div>
                {paradas.length > 1 && (
                  <div style={{ padding: '12px 18px', background: 'var(--accent-glow)', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <div style={{ width: 36, height: 36, borderRadius: 18, background: 'var(--accent)', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 800, fontFamily: 'JetBrains Mono, monospace' }}>
                        {paradaAtiva.ordem_carga}
                      </div>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 700 }}>
                          Parada {paradaAtiva.ordem_carga} · Carrega em <span style={{ color: 'var(--accent-light)' }}>{paradaAtiva.ordem_carga}º</span>
                          {' · '}Descarrega em <span style={{ color: 'var(--orange)' }}>{paradaAtiva.ordem_descarga}º</span>
                        </div>
                        <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>
                          Lógica de emblocamento: o que entra primeiro fica no fundo do caminhão
                        </div>
                      </div>
                    </div>
                    <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                      <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>Mover para posição:</span>
                      <div style={{ display: 'flex', gap: 3, background: 'var(--bg-card)', borderRadius: 5, padding: 2 }}>
                        {Array.from({ length: paradas.length }, (_, i) => (
                          <button
                            key={i}
                            onClick={() => setOrdemCarga(paradaAtivaIdx, i+1)}
                            style={{
                              background: paradaAtiva.ordem_carga === i+1 ? 'var(--accent)' : 'transparent',
                              color: paradaAtiva.ordem_carga === i+1 ? 'white' : 'var(--text-muted)',
                              border: 'none', padding: '3px 9px', borderRadius: 3, fontSize: 11,
                              fontFamily: 'JetBrains Mono, monospace', cursor: 'pointer', fontWeight: 700
                            }}
                          >{i+1}º</button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* Selecionar pedido(s) */}
                <div style={{ padding: '14px 18px', borderBottom: '1px solid var(--border)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10, flexWrap: 'wrap', gap: 8 }}>
                    <div>
                      <div style={{ fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text-muted)' }}>
                        Pedido(s) da parada {paradaAtiva.ordem_carga}
                      </div>
                      {clienteParadaAtiva && (
                        <div style={{ fontSize: 11, color: 'var(--accent-light)', marginTop: 4 }}>
                          <i className="ti ti-info-circle" style={{ fontSize: 12, verticalAlign: -1 }}></i>
                          {' '}Você pode adicionar mais pedidos do mesmo cliente (<strong>{clienteParadaAtiva}</strong>) nesta parada
                        </div>
                      )}
                    </div>
                    <div className="search-box" style={{ maxWidth: 280 }}>
                      <i className="ti ti-search"></i>
                      <input value={busca} onChange={e => setBusca(e.target.value)} placeholder="Buscar cliente ou número..." />
                    </div>
                  </div>
                  <div style={{ maxHeight: 280, overflowY: 'auto', border: '1px solid var(--border)', borderRadius: 6 }}>
                    {ctx.pedidos
                      .filter(p => p.tem_saldo)
                      .filter(p => !busca || p.cliente.toLowerCase().includes(busca.toLowerCase()) || p.numero.toLowerCase().includes(busca.toLowerCase()))
                      .map(p => {
                        // "jaUsado" = está em OUTRA parada
                        const jaUsado = paradas.some((pp, i) => i !== paradaAtivaIdx && (pp.pedidosNumeros || []).includes(p.numero));
                        const estaSelecionado = (paradaAtiva.pedidosNumeros || []).includes(p.numero);
                        // Bloqueia se já tem outro cliente selecionado nessa parada
                        const bloqueadoPorCliente = clienteParadaAtiva && clienteParadaAtiva !== p.cliente && !estaSelecionado;
                        const desabilitado = jaUsado || bloqueadoPorCliente;
                        return (
                          <div
                            key={p.numero}
                            onClick={() => !desabilitado && togglePedidoParadaAtiva(p.numero)}
                            style={{
                              padding: '10px 14px',
                              borderBottom: '1px solid var(--border)',
                              cursor: desabilitado ? 'not-allowed' : 'pointer',
                              background: estaSelecionado ? 'var(--accent-glow)' : 'transparent',
                              opacity: desabilitado ? 0.35 : 1
                            }}
                            onMouseEnter={e => { if (!estaSelecionado && !desabilitado) e.currentTarget.style.background = 'var(--bg-hover)'; }}
                            onMouseLeave={e => { if (!estaSelecionado && !desabilitado) e.currentTarget.style.background = 'transparent'; }}
                          >
                            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                              <div className="checkbox" style={{ background: estaSelecionado ? 'var(--accent)' : 'transparent', borderColor: estaSelecionado ? 'var(--accent)' : 'var(--border-strong)' }}>
                                {estaSelecionado && <i className="ti ti-check" style={{ display: 'block', color: 'white' }}></i>}
                              </div>
                              <div style={{ flex: 1 }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                                  <span className="mono cell-primary" style={{ fontSize: 12 }}>{p.numero}</span>
                                  <span style={{ fontSize: 13, fontWeight: 600 }}>{p.cliente}</span>
                                  {jaUsado && <span className="chip chip-neutral" style={{ fontSize: 9 }}>Já em uso em outra parada</span>}
                                  {bloqueadoPorCliente && <span className="chip chip-neutral" style={{ fontSize: 9 }}>Cliente diferente</span>}
                                </div>
                                <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }}>
                                  {p.vendedor || '—'} · {p.qtd_saldo_bb} de {p.qtd_total_bb} un. · {fmtMoney(p.saldo_aberto)}
                                </div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                  </div>
                </div>

                {/* Itens — agrupados por pedido se houver múltiplos */}
                {pedidosAtivos.length > 0 && (
                  <div style={{ padding: '14px 18px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text-muted)' }}>
                        Itens a embarcar {pedidosAtivos.length > 1 && <span style={{ color: 'var(--accent-light)' }}>· {pedidosAtivos.length} pedidos</span>}
                      </div>
                      <span className="chip chip-green"><span className="status-dot"></span> Saldo ao vivo</span>
                    </div>
                    <div style={{
                      marginBottom: 12, padding: 10, background: 'var(--blue-bg)', borderRadius: 6,
                      fontSize: 11, color: 'var(--blue)', display: 'flex', gap: 8, alignItems: 'flex-start',
                      borderLeft: '3px solid var(--blue)'
                    }}>
                      <i className="ti ti-info-circle" style={{ fontSize: 14, marginTop: 1, flexShrink: 0 }}></i>
                      <div style={{ lineHeight: 1.5 }}>
                        <strong>Como funciona:</strong> clique em qualquer linha (ou no botão "Alocar lotes") para abrir o seletor de lotes do estoque.
                      </div>
                    </div>
                    {pedidosAtivos.map((pedidoAtivo, pIdx) => (
                      <div key={pedidoAtivo.numero} style={{ marginBottom: pIdx < pedidosAtivos.length - 1 ? 18 : 0 }}>
                        {pedidosAtivos.length > 1 && (
                          <div style={{
                            display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10,
                            paddingBottom: 6, borderBottom: '1px dashed var(--border-strong)'
                          }}>
                            <span className="mono cell-primary" style={{ fontSize: 12, fontWeight: 700 }}>{pedidoAtivo.numero}</span>
                            <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>
                              · Vendedor: {pedidoAtivo.vendedor || '—'}
                              {pedidoAtivo.data_entrega && ` · Entrega prevista: ${fmtDate(pedidoAtivo.data_entrega)}`}
                            </span>
                          </div>
                        )}
                        {pedidoAtivo.itens.filter(i => i.saldo > 0).map(item => {
                          const sel = paradaAtiva.itensSelecionados.find(i => i.codigo === item.codigo && i.pedido_numero === pedidoAtivo.numero);
                          const qtd = sel ? sel.qtd_bb : 0;
                          const lotesAlocados = sel?.lotes_alocados || [];
                          const lotesDoItem = ctx.lotes.filter(l => l.item_codigo === item.codigo);
                          return (
                            <ItemRow
                              key={`${pedidoAtivo.numero}_${item.codigo}`}
                              item={item}
                              qtd={qtd}
                              lotesAlocados={lotesAlocados}
                              lotesDoItem={lotesDoItem}
                              modalidade={modalidade}
                              onChange={(q) => handleSetLotesParadaAtiva(item.codigo, q === 0 ? [] : lotesAlocados, pedidoAtivo.numero)}
                              onSetLotes={(lotes) => handleSetLotesParadaAtiva(item.codigo, lotes, pedidoAtivo.numero)}
                            />
                          );
                        })}
                        {pedidoAtivo.itens.filter(i => i.saldo > 0).length === 0 && (
                          <div className="empty" style={{ padding: 16 }}>
                            <i className="ti ti-check"></i>
                            <div>Todos os itens deste pedido já foram entregues</div>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* TRANSPORTE */}
          {totais.bb > 0 && (
            <div className="panel">
              <div className="panel-header">
                <div className="panel-title">3. Dados do embarque</div>
                <div className="panel-sub">Motorista, transportadora e veículo (campos livres)</div>
              </div>
              <div style={{ padding: '16px 18px' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 10 }}>
                  <i className="ti ti-building-warehouse" style={{ fontSize: 14, color: 'var(--accent-light)' }}></i>
                  <span style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--text-muted)' }}>Transportadora</span>
                </div>
                <div className="field-row">
                  <div className="field"><label className="field-label">Razão social</label>
                    <input className="input" value={transportadora_nome} onChange={e => setTransportadoraNome(e.target.value)} placeholder="Ex: Transportes Bahia Ltda" /></div>
                  <div className="field"><label className="field-label">CNPJ</label>
                    <input className="input mono" value={transportadora_cnpj} onChange={e => setTransportadoraCnpj(e.target.value)} placeholder="00.000.000/0000-00" /></div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 10, marginTop: 8, paddingTop: 16, borderTop: '1px dashed var(--border)' }}>
                  <i className="ti ti-steering-wheel" style={{ fontSize: 14, color: 'var(--accent-light)' }}></i>
                  <span style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--text-muted)' }}>Motorista</span>
                </div>
                <div className="field-row">
                  <div className="field"><Lab obrig>Nome completo</Lab>
                    <input
                      className="input"
                      value={motorista_nome}
                      onChange={e => setMotoristaNome(e.target.value)}
                      placeholder="Nome do motorista"
                      style={{ borderColor: !motorista_nome ? 'var(--orange)' : 'var(--border-strong)' }}
                    /></div>
                  <div className="field">
                    <Lab obrig>CPF</Lab>
                    <input
                      className="input mono"
                      value={motorista_cpf}
                      onChange={e => {
                        // Auto-formata 000.000.000-00
                        let v = e.target.value.replace(/\D/g, '').slice(0, 11);
                        if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
                        else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
                        else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, '$1.$2');
                        setMotoristaCpf(v);
                      }}
                      placeholder="000.000.000-00"
                      style={{
                        borderColor: !motorista_cpf ? 'var(--orange)' : 'var(--border-strong)'
                      }}
                    />
                  </div>
                </div>
                <div className="field-row">
                  <div className="field"><label className="field-label">CNH</label>
                    <input className="input mono" value={motorista_cnh} onChange={e => setMotoristaCnh(e.target.value)} placeholder="Número da CNH" /></div>
                  <div className="field"><label className="field-label">Telefone</label>
                    <input className="input mono" value={motorista_telefone} onChange={e => setMotoristaTelefone(e.target.value)} placeholder="(00) 00000-0000" /></div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 10, marginTop: 8, paddingTop: 16, borderTop: '1px dashed var(--border)' }}>
                  <i className="ti ti-car" style={{ fontSize: 14, color: 'var(--accent-light)' }}></i>
                  <span style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--text-muted)' }}>Veículo</span>
                </div>
                {/* Placa + UF + Tipo na mesma linha. Sobrescreve grid do .field-row com flex inline */}
                <div className="field-row" style={{ display: 'flex', alignItems: 'flex-end', gap: 12 }}>
                  <div className="field" style={{ width: 160, flex: '0 0 160px', marginBottom: 0 }}>
                    <Lab obrig>Placa</Lab>
                    <input
                      className="input mono"
                      value={veiculo_placa}
                      onChange={e => {
                        let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7);
                        if (v.length > 3) v = v.slice(0, 3) + '-' + v.slice(3);
                        setVeiculoPlaca(v);
                      }}
                      placeholder="AAA-1B23"
                      style={{
                        textTransform: 'uppercase',
                        textAlign: 'center',
                        fontWeight: 700,
                        letterSpacing: '0.05em',
                        borderColor: !veiculo_placa
                          ? 'var(--orange)'
                          : !/^[A-Z]{3}-\d[A-Z0-9]\d{2}$/.test(veiculo_placa)
                            ? 'var(--red)'
                            : 'var(--green)'
                      }}
                    />
                    {veiculo_placa && !/^[A-Z]{3}-\d[A-Z0-9]\d{2}$/.test(veiculo_placa) && (
                      <div style={{ fontSize: 10, color: 'var(--red)', marginTop: 3 }}>
                        <i className="ti ti-alert-circle" style={{ fontSize: 11, verticalAlign: -1 }}></i>
                        {' '}Use AAA-1B23 ou AAA-1234
                      </div>
                    )}
                  </div>
                  <div className="field" style={{ width: 70, flex: '0 0 70px', marginBottom: 0 }}>
                    <Lab obrig>UF</Lab>
                    <select
                      className="input mono"
                      value={veiculo_placa_uf}
                      onChange={e => setVeiculoPlacaUf(e.target.value)}
                      style={{
                        textAlign: 'center',
                        fontWeight: 700,
                        padding: '0 4px',
                        borderColor: !veiculo_placa_uf ? 'var(--orange)' : 'var(--border-strong)'
                      }}
                    >
                      {['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'].map(uf => (
                        <option key={uf} value={uf}>{uf}</option>
                      ))}
                    </select>
                  </div>
                  <div className="field" style={{ flex: '1 1 auto', marginBottom: 0 }}>
                    <label className="field-label">Tipo / Modelo</label>
                    <input className="input" value={veiculo_tipo} onChange={e => setVeiculoTipo(e.target.value)} placeholder="Ex: Truck Volvo FH" />
                  </div>
                </div>
                <div className="field-row">
                  <div className="field"><label className="field-label">Reboque (opcional)</label>
                    <input
                      className="input mono"
                      value={veiculo_reboque}
                      onChange={e => {
                        let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7);
                        if (v.length > 3) v = v.slice(0, 3) + '-' + v.slice(3);
                        setVeiculoReboque(v);
                      }}
                      placeholder="AAA-1B23"
                      style={{ textTransform: 'uppercase' }}
                    />
                  </div>
                  <div className="field"><label className="field-label">Doca / Local</label>
                    <input className="input" value={doca} onChange={e => setDoca(e.target.value)} placeholder="Doca 03" /></div>
                </div>

                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 10, marginTop: 8, paddingTop: 16, borderTop: '1px dashed var(--border)' }}>
                  <i className="ti ti-calendar-time" style={{ fontSize: 14, color: 'var(--accent-light)' }}></i>
                  <span style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--text-muted)' }}>Programação</span>
                </div>
                <div className="field-row">
                  <div className="field"><Lab obrig>Data prevista</Lab>
                    <input type="date" className="input mono" value={data_prevista} onChange={e => setDataPrevista(e.target.value)}
                      style={{ borderColor: !data_prevista ? 'var(--orange)' : 'var(--border-strong)' }}
                    /></div>
                  <div className="field"><label className="field-label">Horário</label>
                    <input type="time" className="input mono" value={hora_prevista} onChange={e => setHoraPrevista(e.target.value)} /></div>
                </div>
                <div className="field" style={{ marginBottom: 0 }}>
                  <label className="field-label">Observações da expedição</label>
                  <textarea className="input" rows="2" value={observacoes} onChange={e => setObservacoes(e.target.value)}
                    placeholder="Ex: Conferir lacre antes da saída. Cliente pede entrega em horário comercial..." />
                </div>
              </div>
            </div>
          )}
        </div>

        {/* RESUMO LATERAL */}
        <div>
          <div className="summary">
            <div className="summary-title">{isEditing ? `Editando ${initial.numero}` : 'Resumo da OE'}</div>
            <div className="summary-row">
              <span className="label">Modalidade</span>
              <span className="value">{modalidade === 'TRIANGULAR' ? 'Triangular' : 'Estoque próprio'}</span>
            </div>
            <div className="summary-row">
              <span className="label">Paradas</span>
              <span className="value">{paradas.filter(p => p.pedidosNumeros && p.pedidosNumeros.length > 0).length}</span>
            </div>
            {paradas.filter(p => p.pedidosNumeros && p.pedidosNumeros.length > 0).map((p, idx) => {
              const primeiroPed = ctx.pedidos.find(pp => pp.numero === p.pedidosNumeros[0]);
              const numBB = p.itensSelecionados.reduce((a,i) => a + i.qtd_bb, 0);
              return (
                <div key={p.id} style={{ padding: '6px 0', borderBottom: '1px dashed var(--border)', display: 'flex', alignItems: 'flex-start', gap: 8 }}>
                  <span style={{
                    width: 18, height: 18, borderRadius: 9, background: 'var(--accent)',
                    color: 'white', fontSize: 10, fontWeight: 700, fontFamily: 'JetBrains Mono, monospace',
                    display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0
                  }}>{p.ordem_carga}</span>
                  <div style={{ flex: 1, fontSize: 11 }}>
                    <div style={{ fontWeight: 600 }}>{primeiroPed?.cliente || '—'}</div>
                    <div style={{ color: 'var(--text-muted)', marginTop: 1 }}>
                      {p.pedidosNumeros.map((num, i) => (
                        <React.Fragment key={num}>
                          {i > 0 && <span> + </span>}
                          <span className="mono">{num}</span>
                        </React.Fragment>
                      ))}
                      {' · '}{numBB} un.
                    </div>
                  </div>
                </div>
              );
            })}
            <div className="summary-row" style={{ marginTop: 10 }}>
              <span className="label">Volume total</span>
              <span className="value mono">{totais.bb} un. · ~{(totais.peso_estimado/1000).toFixed(1)} t</span>
            </div>
            <div className="summary-row">
              <span className="label">Motorista</span>
              <span className="value" style={{ fontSize: 11 }}>{motorista_nome || '—'}</span>
            </div>
            <div className="summary-row">
              <span className="label">Placa</span>
              <span className="value mono">{veiculo_placa ? `${veiculo_placa}/${veiculo_placa_uf}` : '—'}</span>
            </div>
            <div className="summary-row">
              <span className="label">Data</span>
              <span className="value mono">{fmtDate(data_prevista)} {hora_prevista}</span>
            </div>
            <div className="summary-row total">
              <span className="label" style={{ color: 'var(--text)', fontWeight: 600 }}>Valor da carga</span>
              <span className="value" style={{ color: 'var(--accent-light)', fontSize: 15 }}>{fmtMoney(totais.valor)}</span>
            </div>

            <div style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 8 }}>
              <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: 12 }} onClick={handleSalvar} disabled={!podeConfirmar}>
                <i className="ti ti-check"></i> {isEditing ? 'Salvar alterações' : 'Criar OE'}
              </button>
            </div>

            {!podeConfirmar && pendencias.length > 0 && (
              <div style={{ marginTop: 12, padding: 10, background: 'var(--orange-bg)', borderRadius: 6, fontSize: 11, color: 'var(--orange)', display: 'flex', gap: 6, alignItems: 'flex-start' }}>
                <i className="ti ti-alert-circle" style={{ fontSize: 14, marginTop: 1 }}></i>
                <span><strong>Pendente:</strong> {pendencias.join(' · ')}</span>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

// CAMINHÃO VISUAL — mostra ordem de carga/descarga
