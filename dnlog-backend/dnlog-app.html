const CaminhaoVisual = ({ paradas }) => {
  // Cores por parada
  // Cores por parada (até 6 cores distintas)
  const cores = ['#4ADE80', '#60A5FA', '#A78BFA', '#FBBF24', '#F472B6', '#34D399'];
  // Ordena por ordem de carga (1, 2, 3) — fundo do caminhão = quem carregou primeiro
  const ordenadas = [...paradas].sort((a, b) => a.ordem_carga - b.ordem_carga);

  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
      {/* Desenho do caminhão */}
      <div style={{
        position: 'relative',
        width: Math.max(320, 60 + paradas.length * 60), height: 70,
        flexShrink: 0
      }}>
        {/* Cabine */}
        <div style={{
          position: 'absolute', left: 0, top: 14, width: 40, height: 42,
          background: 'var(--bg-elev)', border: '2px solid var(--border-strong)',
          borderRadius: '6px 4px 4px 6px',
          display: 'flex', alignItems: 'center', justifyContent: 'center'
        }}>
          <i className="ti ti-steering-wheel" style={{ fontSize: 18, color: 'var(--text-muted)' }}></i>
        </div>
        {/* Carroceria — dividida nas paradas */}
        <div style={{
          position: 'absolute', left: 44, top: 8, right: 0, height: 54,
          background: 'var(--bg-elev)', border: '2px solid var(--border-strong)',
          borderRadius: 4, display: 'flex', overflow: 'hidden'
        }}>
          {ordenadas.map((p, i) => {
            const isFirst = i === 0;
            const isLast = i === ordenadas.length - 1;
            const label = isLast ? 'TRASEIRA' : isFirst ? 'FUNDO' : '';
            return (
              <div key={p.id} style={{
                flex: 1,
                background: cores[(p.ordem_carga - 1) % cores.length] + '25',
                borderLeft: i > 0 ? '2px dashed var(--border-strong)' : 'none',
                display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center',
                position: 'relative', padding: '2px',
                minWidth: 40
              }}>
                {label && (
                  <div style={{
                    fontSize: 9, fontWeight: 700, color: cores[(p.ordem_carga - 1) % cores.length],
                    textTransform: 'uppercase', letterSpacing: '0.05em', textAlign: 'center'
                  }}>{label}</div>
                )}
                <div style={{
                  width: 18, height: 18, borderRadius: 9,
                  background: cores[(p.ordem_carga - 1) % cores.length],
                  color: '#0E1116', fontSize: 11, fontWeight: 800,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontFamily: 'JetBrains Mono, monospace', marginTop: label ? 2 : 0
                }}>
                  {p.ordem_carga}
                </div>
              </div>
            );
          })}
        </div>
        {/* Rodas */}
        <div style={{ position: 'absolute', left: 8, bottom: 0, width: 12, height: 12, background: '#000', borderRadius: 6, border: '2px solid #444' }}></div>
        <div style={{ position: 'absolute', left: 26, bottom: 0, width: 12, height: 12, background: '#000', borderRadius: 6, border: '2px solid #444' }}></div>
        <div style={{ position: 'absolute', right: 30, bottom: 0, width: 12, height: 12, background: '#000', borderRadius: 6, border: '2px solid #444' }}></div>
        <div style={{ position: 'absolute', right: 10, bottom: 0, width: 12, height: 12, background: '#000', borderRadius: 6, border: '2px solid #444' }}></div>
      </div>

      {/* Legenda das paradas */}
      <div style={{ flex: 1, minWidth: 250, display: 'flex', flexDirection: 'column', gap: 4 }}>
        {[...paradas].sort((a, b) => a.ordem_carga - b.ordem_carga).map(p => (
          <div key={p.id} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 11 }}>
            <span style={{
              width: 18, height: 18, borderRadius: 9, background: cores[(p.ordem_carga - 1) % cores.length],
              color: '#0E1116', fontSize: 10, fontWeight: 800,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontFamily: 'JetBrains Mono, monospace', flexShrink: 0
            }}>{p.ordem_carga}</span>
            <div style={{ color: 'var(--text-muted)' }}>
              Carrega <strong style={{ color: cores[(p.ordem_carga - 1) % cores.length] }}>{p.ordem_carga}º</strong>
              {' · '}Descarrega <strong style={{ color: 'var(--orange)' }}>{p.ordem_descarga}º</strong>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

const ItemRow = ({ item, qtd, lotesAlocados, lotesDoItem, modalidade, onChange, onSetLotes }) => {
  const [showLoteModal, setShowLoteModal] = useState(false);
  const [showManualModal, setShowManualModal] = useState(false);
  const [showTriangularConfirm, setShowTriangularConfirm] = useState(false);
  const checked = qtd > 0;
  const isTriangular = modalidade === 'TRIANGULAR';
  const totalAlocado = lotesAlocados.reduce((a, l) => a + l.qtd_bb, 0);
  const totalDisponivelEstoque = lotesDoItem.reduce((a, l) => a + l.qtd_disponivel, 0);
  // Em triangular, nunca olha estoque
  const semEstoque = !isTriangular && (lotesDoItem.length === 0 || totalDisponivelEstoque === 0);
  const estoqueInsuficiente = !isTriangular && totalDisponivelEstoque < item.saldo && !semEstoque;

  const handleAbrirSeletor = () => {
    if (isTriangular) {
      // Em operação triangular:
      // - Se tem sem_lotes_triangular: reabre o diálogo (usuário pode optar por informar)
      // - Se tem lotes manuais reais: abre o modal manual direto
      // - Senão: abre o diálogo de confirmação
      const isSemLotes = lotesAlocados.length === 1 && lotesAlocados[0].sem_lotes_triangular;
      if (isSemLotes) {
        setShowTriangularConfirm(true);
      } else if (lotesAlocados.length > 0) {
        setShowManualModal(true);
      } else {
        setShowTriangularConfirm(true);
      }
      return;
    }
    if (semEstoque) return;
    setShowLoteModal(true);
  };

  const handleToggle = (e) => {
    e.stopPropagation();
    if (checked) {
      // Desmarca: limpa tudo
      onSetLotes([]);
    } else {
      handleAbrirSeletor();
    }
  };

  return (
    <div
      style={{
        padding: '12px 0',
        borderBottom: '1px solid var(--border)',
        cursor: !checked && !semEstoque ? 'pointer' : 'default',
        transition: 'background 0.1s'
      }}
      onClick={(e) => {
        // Clicar em qualquer lugar da linha (exceto checkbox/botões) abre o seletor
        if (!checked && !semEstoque && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
          handleAbrirSeletor();
        }
      }}
    >
      <div style={{
        display: 'grid',
        gridTemplateColumns: '28px 1fr 100px 110px 90px 110px',
        gap: 12,
        alignItems: 'center'
      }}>
        <div
          className={`checkbox ${checked ? 'checked' : ''}`}
          onClick={handleToggle}
          style={{
            opacity: semEstoque ? 0.4 : 1,
            cursor: semEstoque ? 'not-allowed' : 'pointer'
          }}
          title={checked ? 'Desmarcar item' : semEstoque ? 'Sem estoque disponível' : 'Selecionar e alocar lotes'}
        >
          <i className="ti ti-check"></i>
        </div>
        <div>
          <div className="cell-primary" style={{ fontSize: 13 }}>{item.descricao}</div>
          <div className="cell-muted mono" style={{ fontSize: 11 }}>{item.codigo} · {item.obtentor} · {item.fornecedor}</div>
        </div>
        <div className="num" style={{ color: 'var(--accent-light)', fontWeight: 700, fontFamily: 'JetBrains Mono, monospace' }}>
          <div>{item.saldo} {item.unidade || 'un'}</div>
          <div style={{ fontSize: 10, color: isTriangular ? 'var(--blue)' : semEstoque ? 'var(--red)' : estoqueInsuficiente ? 'var(--orange)' : 'var(--text-muted)', fontWeight: 600 }}>
            {isTriangular ? 'do fornecedor' : semEstoque ? 'sem estoque' : estoqueInsuficiente ? `só ${totalDisponivelEstoque} disp.` : `${totalDisponivelEstoque} no estoque`}
          </div>
        </div>
        <div className="num cell-mono cell-muted" style={{ fontSize: 12 }}>
          {fmtMoney(item.valor_unitario)}
        </div>
        <div style={{ textAlign: 'right' }}>
          {(() => {
            const isSemLotes = lotesAlocados.length === 1 && lotesAlocados[0].sem_lotes_triangular;
            return (
              <button
                onClick={(e) => { e.stopPropagation(); handleAbrirSeletor(); }}
                disabled={semEstoque}
                style={{
                  background: checked ? (isSemLotes ? 'var(--bg-elev)' : (isTriangular ? 'var(--blue-bg)' : 'var(--accent-glow)')) : 'var(--bg-card)',
                  border: '1px solid ' + (checked ? (isSemLotes ? 'var(--border-strong)' : (isTriangular ? 'var(--blue)' : 'var(--accent)')) : 'var(--border-strong)'),
                  borderRadius: 4,
                  padding: '6px 10px',
                  color: checked ? (isSemLotes ? 'var(--text-muted)' : (isTriangular ? 'var(--blue)' : 'var(--accent-light)')) : 'var(--text-muted)',
                  fontFamily: 'JetBrains Mono, monospace',
                  fontSize: 12,
                  fontWeight: 700,
                  cursor: semEstoque ? 'not-allowed' : 'pointer',
                  outline: 'none',
                  opacity: semEstoque ? 0.4 : 1,
                  width: '100%'
                }}
              >
                {qtd > 0 ? `${qtd} ${item.unidade || 'un'}${isSemLotes ? ' · s/ lote' : ''}` : (semEstoque ? 'Indisp.' : (isTriangular ? 'Informar lotes' : 'Alocar lotes'))}
              </button>
            );
          })()}
        </div>
        <div className="num cell-mono" style={{ color: checked ? 'var(--accent-light)' : 'var(--text-dim)', fontWeight: 600 }}>
          {fmtMoney(qtd * item.valor_unitario)}
        </div>
      </div>

      {/* Lotes alocados (resumo abaixo) */}
      {lotesAlocados.length > 0 && (
        <div style={{
          marginTop: 10,
          marginLeft: 40,
          display: 'flex',
          flexWrap: 'wrap',
          gap: 6,
          alignItems: 'center'
        }}>
          {(() => {
            const semLotes = lotesAlocados.length === 1 && lotesAlocados[0].sem_lotes_triangular;
            if (semLotes) {
              return (
                <>
                  <span style={{ fontSize: 10, color: 'var(--text-muted)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                    <i className="ti ti-package-off" style={{ fontSize: 11, verticalAlign: -1 }}></i>
                    {' '}Sem lotes informados — a cargo do fornecedor
                  </span>
                  <span className="chip chip-neutral" style={{ fontFamily: 'JetBrains Mono, monospace' }}>
                    {lotesAlocados[0].qtd_bb} {item.unidade || 'un'} · A definir
                  </span>
                  <button
                    onClick={(e) => { e.stopPropagation(); setShowManualModal(true); }}
                    style={{
                      background: 'none', border: 'none', color: 'var(--blue)',
                      fontSize: 11, fontWeight: 600, cursor: 'pointer', padding: '2px 6px',
                      fontFamily: 'inherit'
                    }}
                  >
                    <i className="ti ti-edit" style={{ fontSize: 12, verticalAlign: -1 }}></i> informar lotes
                  </button>
                </>
              );
            }
            return (
              <>
                <span style={{ fontSize: 10, color: isTriangular ? 'var(--blue)' : 'var(--text-muted)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                  <i className={`ti ${isTriangular ? 'ti-edit' : 'ti-box'}`} style={{ fontSize: 11, verticalAlign: -1 }}></i>
                  {' '}{isTriangular ? 'Lotes (controle paralelo):' : 'Lotes alocados:'}
                </span>
                {lotesAlocados.map(la => (
                  <span
                    key={la.lote_codigo}
                    className={`chip ${isTriangular ? 'chip-blue' : 'chip-accent'}`}
                    style={{ fontFamily: 'JetBrains Mono, monospace' }}
                  >
                    {la.lote_codigo} · {la.qtd_bb} {item.unidade || 'un'}
                  </span>
                ))}
                <button
                  onClick={(e) => { e.stopPropagation(); isTriangular ? setShowManualModal(true) : setShowLoteModal(true); }}
                  style={{
                    background: 'none',
                    border: 'none',
                    color: 'var(--blue)',
                    fontSize: 11,
                    fontWeight: 600,
                    cursor: 'pointer',
                    padding: '2px 6px',
                    fontFamily: 'inherit'
                  }}
                >
                  <i className="ti ti-edit" style={{ fontSize: 12, verticalAlign: -1 }}></i> editar
                </button>
              </>
            );
          })()}
        </div>
      )}

      {showLoteModal && !isTriangular && (
        <SeletorLotes
          item={item}
          lotesDoItem={lotesDoItem}
          lotesAlocadosAtual={lotesAlocados}
          onClose={() => setShowLoteModal(false)}
          onConfirm={(lotes) => {
            onSetLotes(lotes);
            setShowLoteModal(false);
          }}
        />
      )}

      {showTriangularConfirm && (
        <ConfirmTriangular
          item={item}
          onCancel={() => setShowTriangularConfirm(false)}
          onAccept={() => {
            setShowTriangularConfirm(false);
            setShowManualModal(true);
          }}
          onSkip={() => {
            // Continuar sem lotes: marca item com a qtd total do saldo, sem lotes alocados.
            // O flag sem_lotes_triangular sinaliza que isso foi intencional (não falta de informação)
            setShowTriangularConfirm(false);
            onSetLotes([{
              lote_codigo: 'SEM_LOTE',
              qtd_bb: item.saldo,
              sem_lotes_triangular: true,
              controle_paralelo: true,
              origem_fornecedor: 'A definir pelo fornecedor'
            }]);
          }}
        />
      )}

      {showManualModal && (
        <LotesManual
          item={item}
          lotesAlocadosAtual={lotesAlocados}
          onClose={() => setShowManualModal(false)}
          onConfirm={(lotes) => {
            onSetLotes(lotes);
            setShowManualModal(false);
          }}
        />
      )}
    </div>
  );
};

// ============================================================
// SELETOR DE LOTES (MODAL)
// ============================================================
const SeletorLotes = ({ item, lotesDoItem, lotesAlocadosAtual, onClose, onConfirm }) => {
  // Estado inicial: mapa lote_codigo -> qtd
  const [alocacao, setAlocacao] = useState(() => {
    const obj = {};
    lotesAlocadosAtual.forEach(la => { obj[la.lote_codigo] = la.qtd_bb; });
    return obj;
  });

  const saldoPedido = item.saldo;

  // Quantidade que JÁ estava reservada deste lote ANTES de abrir o modal (parte do qtd_disponivel)
  // Isso ocorre quando editamos uma OE: o estoque desconta essa reserva, então ela faz parte da nossa capacidade real.
  const reservaAnterior = (codigo) => {
    const la = lotesAlocadosAtual.find(x => x.lote_codigo === codigo);
    return la ? la.qtd_bb : 0;
  };

  // Soma total alocado neste momento
  const totalAlocado = Object.values(alocacao).reduce((sum, v) => sum + (Number(v) || 0), 0);
  const pode = totalAlocado > 0 && totalAlocado <= saldoPedido;

  // Lotes ordenados FIFO (mais antigos primeiro). Mostra todos com disp>0 OU já alocados
  const lotesDisponiveis = lotesDoItem
    .filter(l => (l.qtd_disponivel + reservaAnterior(l.lote_codigo)) > 0 || (alocacao[l.lote_codigo] || 0) > 0)
    .sort((a, b) => (a.data_fabricacao || '').localeCompare(b.data_fabricacao || ''));

  // Atualiza quantidade de um lote. Garante limites.
  const atualizarLote = (codigo, novaQtd) => {
    const lote = lotesDoItem.find(l => l.lote_codigo === codigo);
    if (!lote) return;
    // Capacidade REAL = qtd_disponivel (já desconta reservas em outras OEs) + reserva anterior deste mesmo modal
    // NÃO somar o que está sendo digitado agora (alocacao[codigo]) senão o limite "infla"
    const capacidadeLote = lote.qtd_disponivel + reservaAnterior(codigo);
    // Quanto está alocado em OUTROS lotes?
    const alocadoOutros = totalAlocado - (alocacao[codigo] || 0);
    // Máximo permitido neste campo agora:
    const espacoNoPedido = saldoPedido - alocadoOutros;
    const maximo = Math.min(capacidadeLote, espacoNoPedido);
    // Aplica limites
    const valorLimitado = Math.max(0, Math.min(maximo, Number(novaQtd) || 0));
    setAlocacao(prev => ({ ...prev, [codigo]: valorLimitado }));
  };

  const aplicarFIFO = () => {
    let restante = saldoPedido;
    const nova = {};
    for (const l of lotesDisponiveis) {
      if (restante <= 0) break;
      const capacidade = l.qtd_disponivel + reservaAnterior(l.lote_codigo);
      const q = Math.min(capacidade, restante);
      if (q > 0) {
        nova[l.lote_codigo] = q;
        restante -= q;
      }
    }
    setAlocacao(nova);
  };

  const limpar = () => setAlocacao({});

  const handleConfirm = () => {
    const lotes = Object.entries(alocacao)
      .filter(([_, qtd]) => (Number(qtd) || 0) > 0)
      .map(([lote_codigo, qtd_bb]) => {
        const lote = lotesDoItem.find(l => l.lote_codigo === lote_codigo);
        return {
          lote_codigo,
          qtd_bb: Number(qtd_bb),
          armazem: lote ? lote.armazem : null,
          peneira: lote ? lote.peneira : null,
          germinacao: lote ? lote.germinacao : null,
          data_fabricacao: lote ? lote.data_fabricacao : null
        };
      });
    onConfirm(lotes);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 760 }}>
        <div className="modal-header">
          <div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 600 }}>Selecionar lotes</div>
            <div style={{ fontSize: 15, fontWeight: 700, marginTop: 2 }}>{item.descricao}</div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }} className="mono">
              {item.codigo} · Saldo do pedido: <strong style={{ color: 'var(--accent-light)' }}>{saldoPedido} {item.unidade || 'un'}</strong>
            </div>
          </div>
          <button className="btn btn-ghost" style={{ padding: '4px 8px' }} onClick={onClose}>
            <i className="ti ti-x"></i>
          </button>
        </div>

        <div style={{ padding: '12px 20px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, flexWrap: 'wrap', background: 'var(--bg-card)' }}>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn btn-ghost" style={{ fontSize: 11, padding: '5px 10px' }} onClick={aplicarFIFO}>
              <i className="ti ti-arrow-down"></i> Alocar FIFO ({saldoPedido} {item.unidade || 'un'})
            </button>
            <button className="btn btn-ghost" style={{ fontSize: 11, padding: '5px 10px' }} onClick={limpar}>
              <i className="ti ti-trash"></i> Limpar
            </button>
          </div>
          <div style={{ display: 'flex', gap: 14, alignItems: 'center' }}>
            <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>
              Alocado: <strong style={{ color: totalAlocado > saldoPedido ? 'var(--red)' : 'var(--accent-light)', fontFamily: 'JetBrains Mono, monospace', fontSize: 14 }}>{totalAlocado}</strong> / {saldoPedido} {item.unidade || 'un'}
            </div>
            <div style={{ width: 120, height: 6, background: 'var(--bg-elev)', borderRadius: 3, overflow: 'hidden' }}>
              <div style={{
                height: '100%',
                width: Math.min(100, (totalAlocado / saldoPedido) * 100) + '%',
                background: totalAlocado > saldoPedido ? 'var(--red)' : totalAlocado === saldoPedido ? 'var(--green)' : 'var(--accent)',
                transition: 'all 0.2s'
              }}></div>
            </div>
          </div>
        </div>

        <div className="modal-body" style={{ padding: 0 }}>
          {lotesDisponiveis.length === 0 ? (
            <div className="empty">
              <i className="ti ti-box-off"></i>
              <div style={{ fontSize: 14, color: 'var(--text)' }}>Sem lotes disponíveis no estoque</div>
              <div style={{ fontSize: 12, marginTop: 4 }}>Não há lotes deste item com saldo no armazém</div>
            </div>
          ) : (
            <table style={{ width: '100%' }}>
              <thead><tr>
                <th>Lote</th><th>Armazém</th><th>Peneira</th>
                <th className="num">Germ.</th><th className="num">Fab.</th>
                <th className="num">Disp.</th><th className="num" style={{ width: 140 }}>Alocar</th>
              </tr></thead>
              <tbody>
                {lotesDisponiveis.map(l => {
                  const alocadoLote = alocacao[l.lote_codigo] || 0;
                  const capacidadeReal = l.qtd_disponivel + reservaAnterior(l.lote_codigo);
                  const noLimite = alocadoLote >= capacidadeReal;
                  return (
                    <tr key={l.lote_codigo} style={{ background: alocadoLote > 0 ? 'var(--accent-glow)' : 'transparent' }}>
                      <td className="mono" style={{ color: 'var(--accent-light)', fontWeight: 700, fontSize: 12 }}>{l.lote_codigo}</td>
                      <td style={{ fontSize: 12 }}>{l.armazem}</td>
                      <td className="mono cell-muted" style={{ fontSize: 12 }}>{l.peneira}</td>
                      <td className="num mono">{l.germinacao}%</td>
                      <td className="num mono cell-muted" style={{ fontSize: 11 }}>{fmtDate(l.data_fabricacao)}</td>
                      <td className="num mono cell-primary" style={{ color: noLimite ? 'var(--orange)' : 'var(--green)' }}>{capacidadeReal}</td>
                      <td>
                        <div style={{ display: 'flex', gap: 4, alignItems: 'center', justifyContent: 'flex-end' }}>
                          <button
                            type="button"
                            onClick={() => atualizarLote(l.lote_codigo, alocadoLote - 1)}
                            disabled={alocadoLote <= 0}
                            style={{
                              width: 28, height: 28, background: 'var(--bg-card)', border: '1px solid var(--border-strong)',
                              borderRadius: 4, color: 'var(--text)', cursor: alocadoLote <= 0 ? 'not-allowed' : 'pointer',
                              display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 700,
                              opacity: alocadoLote <= 0 ? 0.3 : 1, fontFamily: 'inherit'
                            }}>−</button>
                          <input
                            type="number"
                            min="0"
                            max={capacidadeReal}
                            value={alocadoLote}
                            onChange={(e) => atualizarLote(l.lote_codigo, e.target.value)}
                            onFocus={(e) => e.target.select()}
                            style={{
                              width: 54, padding: '4px 6px',
                              background: 'var(--bg-card)',
                              border: '1px solid ' + (noLimite && alocadoLote > 0 ? 'var(--orange)' : 'var(--border-strong)'),
                              borderRadius: 3,
                              color: noLimite && alocadoLote > 0 ? 'var(--orange)' : 'var(--text)',
                              fontFamily: 'JetBrains Mono, monospace', fontSize: 13, textAlign: 'center', outline: 'none',
                              fontWeight: 700
                            }}
                          />
                          <button
                            type="button"
                            onClick={() => atualizarLote(l.lote_codigo, alocadoLote + 1)}
                            disabled={noLimite}
                            style={{
                              width: 28, height: 28, background: 'var(--bg-card)', border: '1px solid var(--border-strong)',
                              borderRadius: 4, color: 'var(--text)', cursor: noLimite ? 'not-allowed' : 'pointer',
                              display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 700,
                              opacity: noLimite ? 0.3 : 1, fontFamily: 'inherit'
                            }}
                            title={noLimite ? `Máximo do lote: ${capacidadeReal} ${item.unidade || 'un'}` : ''}
                          >+</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>

        <div className="modal-footer">
          <div style={{ fontSize: 11, color: 'var(--text-muted)', display: 'flex', alignItems: 'center', gap: 6, flex: 1 }}>
            <i className="ti ti-info-circle" style={{ fontSize: 14 }}></i>
            Lotes ordenados por antiguidade (FIFO). Use "Alocar FIFO" para preencher automaticamente.
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
            <button className="btn btn-primary" onClick={handleConfirm} disabled={!pode}>
              <i className="ti ti-check"></i> Confirmar {totalAlocado} {item.unidade || 'un'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

// CONFIRMAÇÃO TRIANGULAR (DIÁLOGO)
// ============================================================

      <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 560 }}>
        <div className="modal-header" style={{ borderBottom: '1px solid var(--border)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>

              <i className="ti ti-alert-triangle" style={{ fontSize: 22, color: 'var(--orange)' }}></i>

              <div style={{ fontSize: 15, fontWeight: 700 }}>Operação triangular detectada</div>

            </div>
          </div>

            <div style={{ marginBottom: 10, display: 'flex', gap: 8, alignItems: 'flex-start' }}>
              <i className="ti ti-info-circle" style={{ color: 'var(--blue)', fontSize: 16, flexShrink: 0, marginTop: 1 }}></i>

                <strong style={{ color: 'var(--text)' }}>Esta operação NÃO movimenta o estoque do SAP.</strong> Os lotes informados aqui têm finalidade exclusivamente operacional, para rastreabilidade durante o transporte e conferência no destino.
              </div>
            </div>
            <div style={{ marginBottom: 10, display: 'flex', gap: 8, alignItems: 'flex-start' }}>

            </div>

              <i className="ti ti-package-off" style={{ color: 'var(--text-muted)', fontSize: 16, flexShrink: 0, marginTop: 1 }}></i>
              <div>Você também pode prosseguir <strong style={{ color: 'var(--text)' }}>sem informar lotes</strong> — a OE será emitida com a quantidade total e os lotes ficarão inteiramente a cargo do fornecedor.</div>
            </div>
          </div>
        </div>
        <div className="modal-footer" style={{ flexWrap: 'wrap', gap: 8 }}>
          <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>

            className="btn btn-ghost"
            onClick={onSkip}
            style={{ borderColor: 'var(--border-strong)' }}
            title="Marca o item com a quantidade total do saldo, sem alocar nenhum lote"
          >
            <i className="ti ti-package-off"></i> Continuar sem lotes
          </button>
          <button className="btn btn-primary" onClick={onAccept}>
            <i className="ti ti-edit"></i> Sim, informar lotes manualmente
          </button>
        </div>
      </div>
    </div>
  );
};

// ============================================================
// MODAL DE LOTES MANUAIS (TRIANGULAR — CONTROLE PARALELO)
// ============================================================
const LotesManual = ({ item, lotesAlocadosAtual, onClose, onConfirm }) => {
  // Estado: array de { lote_codigo, qtd_bb, origem_fornecedor }
  const [lotes, setLotes] = useState(() => {
    if (lotesAlocadosAtual.length > 0) {
      return lotesAlocadosAtual.map(la => ({
        lote_codigo: la.lote_codigo || '',
        qtd_bb: la.qtd_bb || 0,
        origem_fornecedor: la.origem_fornecedor || ''
      }));
    }
    return [{ lote_codigo: '', qtd_bb: 0, origem_fornecedor: '' }];
  });

  const saldoPedido = item.saldo;
  const totalAlocado = lotes.reduce((sum, l) => sum + (Number(l.qtd_bb) || 0), 0);
  const lotesValidos = lotes.filter(l => l.lote_codigo.trim() && Number(l.qtd_bb) > 0);
  const podeConfirmar = lotesValidos.length > 0 && totalAlocado > 0 && totalAlocado <= saldoPedido;

  const atualizar = (idx, campo, valor) => {
    setLotes(prev => prev.map((l, i) => i === idx ? { ...l, [campo]: valor } : l));
  };

  const adicionarLinha = () => {
    setLotes(prev => [...prev, { lote_codigo: '', qtd_bb: 0, origem_fornecedor: '' }]);
  };

  const removerLinha = (idx) => {
    setLotes(prev => prev.filter((_, i) => i !== idx));
  };

  const distribuirTudo = () => {
    // Se só tem uma linha, atribui todo o saldo
    if (lotes.length === 1) {
      atualizar(0, 'qtd_bb', saldoPedido);
    }
  };

  const handleConfirm = () => {
    const finais = lotes
      .filter(l => l.lote_codigo.trim() && Number(l.qtd_bb) > 0)
      .map(l => ({
        lote_codigo: l.lote_codigo.trim().toUpperCase(),
        qtd_bb: Number(l.qtd_bb),
        origem_fornecedor: l.origem_fornecedor.trim(),
        controle_paralelo: true  // FLAG IMPORTANTE: não toca no SAP
      }));
    onConfirm(finais);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 720 }}>
        <div className="modal-header">
          <div style={{ flex: 1 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span className="chip chip-blue" style={{ fontSize: 10 }}>
                <i className="ti ti-arrows-shuffle"></i> TRIANGULAR
              </span>
              <span className="chip chip-orange" style={{ fontSize: 10 }}>
                <i className="ti ti-edit"></i> CONTROLE PARALELO
              </span>
            </div>
            <div style={{ fontSize: 15, fontWeight: 700, marginTop: 6 }}>Informar lotes manualmente</div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }} className="mono">
              {item.codigo} · {item.descricao} · Saldo: <strong style={{ color: 'var(--accent-light)' }}>{saldoPedido} {item.unidade || 'un'}</strong>
            </div>
          </div>
          <button className="btn btn-ghost" style={{ padding: '4px 8px' }} onClick={onClose}>
            <i className="ti ti-x"></i>
          </button>
        </div>

        <div style={{ padding: '10px 20px', background: 'var(--orange-bg)', borderBottom: '1px solid var(--orange)', display: 'flex', gap: 10, alignItems: 'flex-start' }}>
          <i className="ti ti-shield-lock" style={{ color: 'var(--orange)', fontSize: 16, flexShrink: 0, marginTop: 1 }}></i>
          <div style={{ fontSize: 11, color: 'var(--orange)', lineHeight: 1.5 }}>
            <strong>NÃO movimenta o estoque do SAP.</strong> Lotes registrados aqui têm finalidade exclusivamente operacional (rastreabilidade, conferência no destino). Baixa contábil ocorre apenas após entrega com NF do fornecedor.
          </div>
        </div>

        <div style={{ padding: '12px 20px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, flexWrap: 'wrap', background: 'var(--bg-card)' }}>
          <button className="btn btn-ghost" style={{ fontSize: 11, padding: '5px 10px' }} onClick={adicionarLinha}>
            <i className="ti ti-plus"></i> Adicionar lote
          </button>
          <div style={{ display: 'flex', gap: 14, alignItems: 'center' }}>
            <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>
              Informado: <strong style={{ color: totalAlocado > saldoPedido ? 'var(--red)' : 'var(--blue)', fontFamily: 'JetBrains Mono, monospace', fontSize: 14 }}>{totalAlocado}</strong> / {saldoPedido} {item.unidade || 'un'}
            </div>
            <div style={{ width: 120, height: 6, background: 'var(--bg-elev)', borderRadius: 3, overflow: 'hidden' }}>
              <div style={{
                height: '100%',
                width: Math.min(100, (totalAlocado / saldoPedido) * 100) + '%',
                background: totalAlocado > saldoPedido ? 'var(--red)' : totalAlocado === saldoPedido ? 'var(--green)' : 'var(--blue)',
                transition: 'all 0.2s'
              }}></div>
            </div>
          </div>
        </div>

        <div className="modal-body" style={{ padding: '14px 20px' }}>
          <div style={{ fontSize: 11, color: 'var(--text-muted)', marginBottom: 10, lineHeight: 1.5 }}>
            Informe os códigos de lote do fornecedor (se conhecidos) e a quantidade. Você pode adicionar quantos lotes precisar.
          </div>
          {lotes.map((l, idx) => (
            <div key={idx} style={{
              display: 'grid',
              gridTemplateColumns: '1.4fr 1.2fr 80px 32px',
              gap: 8,
              padding: 10,
              background: 'var(--bg-card)',
              border: '1px solid var(--border)',
              borderRadius: 6,
              marginBottom: 8,
              alignItems: 'end'
            }}>
              <div>
                <label className="field-label" style={{ marginBottom: 4, fontSize: 10 }}>Código do lote *</label>
                <input
                  className="input mono"
                  value={l.lote_codigo}
                  onChange={e => atualizar(idx, 'lote_codigo', e.target.value)}
                  placeholder="Ex: NEO2026123456"
                  style={{ textTransform: 'uppercase', padding: '7px 9px' }}
                />
              </div>
              <div>
                <label className="field-label" style={{ marginBottom: 4, fontSize: 10 }}>Origem (fornecedor / armazém)</label>
                <input
                  className="input"
                  value={l.origem_fornecedor}
                  onChange={e => atualizar(idx, 'origem_fornecedor', e.target.value)}
                  placeholder="Ex: Eliane LEM, lote interno"
                  style={{ padding: '7px 9px' }}
                />
              </div>
              <div>
                <label className="field-label" style={{ marginBottom: 4, fontSize: 10 }}>QTD *</label>
                <input
                  type="number"
                  min="0"
                  className="input mono"
                  value={l.qtd_bb || ''}
                  onChange={e => atualizar(idx, 'qtd_bb', e.target.value)}
                  onFocus={e => e.target.select()}
                  placeholder="0"
                  style={{ textAlign: 'right', padding: '7px 9px', fontWeight: 700 }}
                />
              </div>
              <button
                type="button"
                onClick={() => removerLinha(idx)}
                disabled={lotes.length === 1}
                style={{
                  width: 32, height: 34, background: 'var(--bg-elev)', border: '1px solid var(--border-strong)',
                  borderRadius: 4, color: 'var(--red)', cursor: lotes.length === 1 ? 'not-allowed' : 'pointer',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  opacity: lotes.length === 1 ? 0.3 : 1
                }}
                title={lotes.length === 1 ? 'Mantém ao menos uma linha' : 'Remover lote'}
              >
                <i className="ti ti-trash" style={{ fontSize: 14 }}></i>
              </button>
            </div>
          ))}

          {lotes.length === 1 && totalAlocado === 0 && (
            <button
              className="btn btn-ghost"
              style={{ fontSize: 11, padding: '6px 12px', marginTop: 4 }}
              onClick={distribuirTudo}
              disabled={!lotes[0].lote_codigo.trim()}
            >
              <i className="ti ti-equal"></i> Atribuir todo o saldo ({saldoPedido} {item.unidade || 'un'})
            </button>
          )}

          {totalAlocado > saldoPedido && (
            <div style={{ marginTop: 10, padding: 10, background: 'var(--red-bg)', borderRadius: 6, fontSize: 11, color: 'var(--red)', display: 'flex', gap: 8, alignItems: 'center' }}>
              <i className="ti ti-alert-circle" style={{ fontSize: 14 }}></i>
              Quantidade informada ({totalAlocado} {item.unidade || 'un'}) excede o saldo do pedido ({saldoPedido} {item.unidade || 'un'})
            </div>
          )}
        </div>

        <div className="modal-footer">
          <div style={{ fontSize: 11, color: 'var(--text-muted)', display: 'flex', alignItems: 'center', gap: 6, flex: 1 }}>
            <i className="ti ti-info-circle" style={{ fontSize: 14 }}></i>
            Você pode prosseguir sem lotes — basta cancelar e marcar o item de outra forma.
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
            <button className="btn btn-primary" onClick={handleConfirm} disabled={!podeConfirmar}>
              <i className="ti ti-check"></i> Confirmar {totalAlocado} {item.unidade || 'un'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

const DetalheOE = ({ ctx }) => {
  const oe = ctx.viewingOE;
  if (!oe) return <div className="empty"><i className="ti ti-alert-circle"></i><div>OE não encontrada</div></div>;

  const oeAtual = ctx.state.ordens.find(o => o.id === oe.id) || oe;

  const totais = useMemo(() => {
    const bb = totalBBs(oeAtual);
    const valor = totalValor(oeAtual);
    return { bb, valor, peso: bb * PESO_BB_KG };
  }, [oeAtual]);

  const handlePrint = () => window.print();
  const handleCancelar = () => ctx.cancelarOE(oeAtual.id);

  const avancarStatus = (novoStatus) => {
    ctx.atualizarOE(oeAtual.id, { status: novoStatus, [`${novoStatus.toLowerCase()}_em`]: new Date().toISOString() });
    ctx.showToast(`Status atualizado para ${novoStatus.replace('_',' ')}`, oeAtual.numero);
  };

  const proxStatus = {
    'PROGRAMADA': 'EM_CONFERENCIA',
    'EM_CONFERENCIA': 'EMBARCADA',
    'EMBARCADA': 'EM_TRANSITO',
    'EM_TRANSITO': 'ENTREGUE'
  }[oeAtual.status];

  const labelProx = {
    'EM_CONFERENCIA': 'Enviar para conferência',
    'EMBARCADA': 'Marcar como embarcada',
    'EM_TRANSITO': 'Marcar em trânsito',
    'ENTREGUE': 'Marcar como entregue'
  };

  return (
    <div>
      <div className="page-header no-print">
        <div>
          <div className="crumb">
            <i className="ti ti-home"></i>
            <span style={{cursor:'pointer', color:'var(--accent-light)'}} onClick={() => ctx.setScreen('agendamentos')}>Agendamentos</span>
            <span>·</span>
            <span>{oeAtual.numero}</span>
          </div>
          <h1 className="page-title">{oeAtual.numero}</h1>
          <p className="page-subtitle">
            {getParadas(oeAtual).length > 1
              ? `${getParadas(oeAtual).length} paradas (multi-cliente) · ${oeAtual.motorista_nome} · ${oeAtual.veiculo_placa}`
              : `${oeAtual.cliente} · ${oeAtual.motorista_nome} · ${oeAtual.veiculo_placa}`}
          </p>
        </div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button className="btn btn-ghost" onClick={() => ctx.setScreen('agendamentos')}><i className="ti ti-arrow-left"></i> Voltar</button>
          <button className="btn btn-ghost" onClick={handlePrint}><i className="ti ti-printer"></i> Imprimir</button>
          {ctx.podeEditar && oeAtual.status !== 'CANCELADA' && oeAtual.status !== 'ENTREGUE' && (
            <button className="btn btn-ghost" style={{ borderColor: 'var(--blue)', color: 'var(--blue)' }} onClick={() => {
              ctx.setEditingOE(oeAtual);
              ctx.setScreen('editar-oe');
            }}><i className="ti ti-edit"></i> Editar OE</button>
          )}
          {ctx.podeEditar && oeAtual.status !== 'CANCELADA' && oeAtual.status !== 'ENTREGUE' && proxStatus && (
            <button className="btn btn-primary" onClick={() => avancarStatus(proxStatus)}>
              <i className="ti ti-arrow-right"></i> {labelProx[proxStatus]}
            </button>
          )}
          {/* FATURAR — disponível quando OE já foi embarcada (ou além) e ainda não faturada */}
          {ctx.podeEditar && !oeAtual.faturada && ['EMBARCADA', 'EM_TRANSITO', 'ENTREGUE'].includes(oeAtual.status) && (
            <button
              className="btn"
              style={{ background: 'var(--green)', color: 'white', borderColor: 'var(--green)' }}
              onClick={() => {
                const nf = prompt(
                  'Número da NF-e (opcional):\n\n' +
                  'Ao faturar, o saldo dos pedidos vinculados será BAIXADO permanentemente. ' +
                  'Use isso quando a NF for emitida no SAP.\n\n' +
                  'Pressione OK para confirmar ou Cancelar para abortar.',
                  ''
                );
                if (nf === null) return; // cancelou
                ctx.faturarOE(oeAtual.id, nf.trim());
              }}
            >
              <i className="ti ti-receipt"></i> Marcar como faturada
            </button>
          )}
          {/* DESFATURAR — só se já está faturada */}
          {ctx.podeEditar && oeAtual.faturada && (
            <button
              className="btn btn-ghost"
              style={{ borderColor: 'var(--orange)', color: 'var(--orange)' }}
              onClick={() => {
                if (!confirm(
                  'Desfazer faturamento desta OE?\n\n' +
                  'O saldo dos pedidos será DEVOLVIDO. Use apenas em caso de erro de emissão.'
                )) return;
                ctx.desfaturarOE(oeAtual.id);
              }}
            >
              <i className="ti ti-receipt-off"></i> Desfaturar
            </button>
          )}
          {ctx.podeEditar && oeAtual.status !== 'CANCELADA' && oeAtual.status !== 'ENTREGUE' && (
            <button className="btn btn-danger" onClick={handleCancelar}><i className="ti ti-x"></i> Cancelar OE</button>
          )}
        </div>
      </div>

      {/* INFO BOX */}
      <div className="no-print" style={{ background: 'var(--bg-elev)', border: '1px solid var(--border)', borderLeft: '4px solid ' + (oeAtual.status === 'CANCELADA' ? 'var(--red)' : 'var(--accent)'), borderRadius: 8, padding: '14px 18px', marginBottom: 20, display: 'flex', gap: 12, alignItems: 'flex-start' }}>
        <i className="ti ti-info-circle" style={{ color: 'var(--accent-light)', fontSize: 22, marginTop: 2 }}></i>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 4, display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
            Status atual: <StatusChip status={oeAtual.status} />
            {oeAtual.faturada && (
              <span className="chip" style={{ background: 'var(--green)', color: 'white', fontSize: 11, fontWeight: 700 }}>
                <i className="ti ti-receipt"></i> FATURADA
                {oeAtual.nf_numero && <span style={{ marginLeft: 5, opacity: 0.85 }}>NF {oeAtual.nf_numero}</span>}
              </span>
            )}
          </div>
          <div style={{ fontSize: 12, color: 'var(--text-muted)', lineHeight: 1.6 }}>
            Criada em {fmtDateTime(oeAtual.criado_em)} por {oeAtual.criado_por}.
            {oeAtual.status === 'PROGRAMADA' && ' Envie para conferência quando o veículo chegar à doca.'}
            {oeAtual.status === 'EM_CONFERENCIA' && ' Aguardando conferência física no tablet do conferente.'}
            {oeAtual.status === 'EMBARCADA' && ' Carga embarcada. Marque como em trânsito quando o veículo sair.'}
            {oeAtual.status === 'EM_TRANSITO' && ' Veículo a caminho do cliente.'}
            {oeAtual.status === 'ENTREGUE' && oeAtual.modalidade === 'TRIANGULAR' && ' Entrega concluída. Documentos fiscais serão lançados após NF do fornecedor.'}
            {oeAtual.status === 'ENTREGUE' && oeAtual.modalidade !== 'TRIANGULAR' && ' Entrega concluída. Delivery Note registrada no SAP.'}
            {oeAtual.status === 'CANCELADA' && ' Esta OE foi cancelada. O saldo dos itens foi restituído ao pedido.'}
            {oeAtual.faturada && oeAtual.faturada_em && (
              <span style={{ display: 'block', marginTop: 4, color: 'var(--green)' }}>
                <i className="ti ti-check" style={{ fontSize: 12, verticalAlign: -1 }}></i>
                {' '}Faturada em {fmtDateTime(oeAtual.faturada_em)}. Saldo dos pedidos foi baixado.
              </span>
            )}
          </div>
        </div>
      </div>

      {/* AVISO DE TRIANGULAR */}
      {oeAtual.modalidade === 'TRIANGULAR' && oeAtual.status !== 'CANCELADA' && (
        <div className="no-print" style={{ background: 'var(--blue-bg)', border: '1px solid var(--blue)', borderLeft: '4px solid var(--blue)', borderRadius: 8, padding: '12px 18px', marginBottom: 20, display: 'flex', gap: 12, alignItems: 'flex-start' }}>
          <i className="ti ti-shield-lock" style={{ color: 'var(--blue)', fontSize: 20, marginTop: 2, flexShrink: 0 }}></i>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 12, marginBottom: 4, color: 'var(--blue)' }}>
              Operação triangular · estoque do SAP NÃO afetado
            </div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', lineHeight: 1.6 }}>
              Esta OE move mercadoria diretamente do fornecedor <strong style={{ color: 'var(--text)' }}>{oeAtual.fornecedor_nome || '—'}</strong> ao cliente.
              Lotes informados servem apenas para controle paralelo e rastreabilidade — o Pedido de Compra e a baixa contábil
              serão lançados no SAP somente após a entrega, com base na NF do fornecedor.
            </div>
          </div>
        </div>
      )}

      {/* DOCUMENTO IMPRIMÍVEL */}
      <DocumentoOE oe={oeAtual} totais={totais} />

      <div className="no-print" style={{ display: 'flex', justifyContent: 'center', gap: 8, marginTop: 12 }}>
        <button className="btn btn-ghost" onClick={() => ctx.setScreen('agendamentos')}><i className="ti ti-list"></i> Voltar à lista</button>
        <button className="btn btn-ghost" onClick={handlePrint}><i className="ti ti-printer"></i> Imprimir A4</button>
      </div>
    </div>
  );
};

                              )}
                            </td>
                            <td style={{ textAlign: 'right', fontWeight: 700, fontSize: 13 }} className="mono">{it.qtd_bb}</td>
                            <td className="mono" style={{ fontSize: 11 }}>{it.embalagem || it.unidade || 'un'}</td>
                            <td style={{ textAlign: 'right' }} className="mono">~ {fmtNum(it.qtd_bb * PESO_BB_KG)} kg</td>
                          </tr>
                        ))}
                        <tr style={{ background: '#FFFAEC' }}>
                          <td colSpan="3" style={{ textAlign: 'right', fontWeight: 700, fontSize: 11, color: '#1A1A1A' }}>SUBTOTAL PARADA {p.ordem_carga}</td>
                          <td style={{ textAlign: 'right', fontWeight: 700, fontSize: 13, color: '#1A1A1A' }} className="mono">{totalBBParada}</td>
                          <td></td>
                          <td style={{ textAlign: 'right', fontWeight: 700, color: '#1A1A1A' }} className="mono">~ {fmtNum(totalBBParada * PESO_BB_KG)} kg</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                );
              })}

              {/* Total geral */}
              <div className="doc-block-wide">
                <table className="doc-table-v2">
                  <tbody>
                    <tr className="doc-table-total">
                      <td colSpan="3" style={{ textAlign: 'right', width: 'auto' }}>TOTAL GERAL DA CARGA ({paradas.length} PARADAS)</td>
                      <td style={{ textAlign: 'right', width: 70 }} className="mono">{totais.bb}</td>
                      <td style={{ textAlign: 'right', width: 100 }} className="mono">~ {fmtNum(totais.peso)} kg</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </>
          );
        }

        // Caso uma única parada: layout original
        return (
          <div className="doc-block-wide">
            <div className="doc-block-header"><i className="ti ti-package"></i> ITENS A EMBARCAR</div>
            <table className="doc-table-v2">
              <thead><tr>
                <th style={{ width: 90 }}>Código</th>
                <th>Descrição</th>
                <th>Lotes</th>
                <th style={{ width: 60, textAlign: 'right' }}>QTD</th>
                <th style={{ width: 70 }}>UND</th>
                <th style={{ width: 100, textAlign: 'right' }}>Peso bruto</th>
              </tr></thead>
              <tbody>
                {oe.itens.map((it,idx) => (
                  <tr key={idx}>
                    <td className="mono">{it.codigo}</td>
                    <td>
                      <strong>{it.descricao}</strong>
                      {it.obtentor && <div style={{ fontSize: 9, color: '#777' }}>{it.obtentor}{it.tsi ? ` · ${it.tsi}` : ''}</div>}
                    </td>
                    <td style={{ fontSize: 9 }}>
                      {it.lotes_alocados && it.lotes_alocados.length > 0 ? (
                        (() => {
                          const isSemLotes = it.lotes_alocados.length === 1 && it.lotes_alocados[0].sem_lotes_triangular;
                          if (isSemLotes) {
                            return (
                              <div style={{ fontFamily: 'JetBrains Mono, monospace', color: '#666', fontStyle: 'italic' }}>
                                A definir pelo fornecedor
                                <div style={{ fontSize: 8, color: '#B85A1A', fontWeight: 700, fontStyle: 'normal', marginTop: 2 }}>
                                  ⚠ Triangular sem lotes informados
                                </div>
                              </div>
                            );
                          }
                          return (
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                              {it.lotes_alocados.map(la => (
                                <div key={la.lote_codigo} style={{ fontFamily: 'JetBrains Mono, monospace', color: '#1A1A1A' }}>
                                  <strong>{la.lote_codigo}</strong>
                                  <span style={{ color: '#777' }}> · {la.qtd_bb} {it.unidade || it.embalagem || 'un'}</span>
                                  {la.controle_paralelo && <span style={{ color: '#B85A1A', fontSize: 8, marginLeft: 4, fontWeight: 700 }}>(CTRL PAR.)</span>}
                                </div>
                              ))}
                              {it.lotes_alocados.some(la => la.controle_paralelo) && (
                                <div style={{ fontSize: 8, color: '#B85A1A', fontWeight: 700, fontStyle: 'italic', marginTop: 2 }}>
                                  ⚠ Não vinculado ao SAP
                                </div>
                              )}
                            </div>
                          );
                        })()
                      ) : (
                        <span style={{ color: '#B85A1A', fontWeight: 600 }}>
                          <i className="ti ti-alert-circle" style={{ fontSize: 10, verticalAlign: -1 }}></i> Lote não informado
                        </span>
                      )}
                    </td>
                    <td style={{ textAlign: 'right', fontWeight: 700, fontSize: 13 }} className="mono">{it.qtd_bb}</td>
                    <td className="mono" style={{ fontSize: 11 }}>{it.embalagem || it.unidade || 'un'}</td>
                    <td style={{ textAlign: 'right' }} className="mono">~ {fmtNum(it.qtd_bb * PESO_BB_KG)} kg</td>
                  </tr>
                ))}
                <tr className="doc-table-total">
                  <td colSpan="3" style={{ textAlign: 'right' }}>TOTAL DA CARGA</td>
                  <td style={{ textAlign: 'right' }} className="mono">{totais.bb}</td>
                  <td></td>
                  <td style={{ textAlign: 'right' }} className="mono">~ {fmtNum(totais.peso)} kg</td>
                </tr>
              </tbody>
            </table>
          </div>
        );
      })()}

      {/* OBSERVAÇÕES */}
      {oe.observacoes && (
        <div className="doc-block-wide">
          <div className="doc-block-header"><i className="ti ti-message"></i> OBSERVAÇÕES E INSTRUÇÕES</div>
          <div className="doc-block-body" style={{ background: '#FFFAEC' }}>
            <div style={{ fontSize: 12, lineHeight: 1.6, color: '#333' }}>{oe.observacoes}</div>
          </div>
        </div>
      )}

      {/* MAPA DE CARGA (se existir) */}
      {oe.mapa_carga && bbsMarcadosNoMapa(migrarMapa(oe.mapa_carga)) > 0 && (
        <MapaCargaPrint oe={oe} mapa={oe.mapa_carga} />
      )}

      {/* FOTOS DA CARGA */}
      {oe.fotos_carga && oe.fotos_carga.length > 0 && (() => {
        const fotosValidas = oe.fotos_carga.filter(f => typeof f !== 'string' && f.dataUrl);
        if (fotosValidas.length === 0) return null;
        return (
          <div className="doc-block-wide" style={{ pageBreakInside: 'avoid' }}>
            <div className="doc-block-header">
              <i className="ti ti-camera"></i> FOTOS DA CARGA · {fotosValidas.length} {fotosValidas.length === 1 ? 'foto' : 'fotos'}
            </div>
            <div style={{ padding: 10, background: 'white' }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 8 }}>
                {fotosValidas.map((f, idx) => (
                  <div key={idx} style={{ border: '1px solid #CCC', borderRadius: 3, overflow: 'hidden' }}>
                    <img src={f.dataUrl} alt={`Foto ${idx+1}`} style={{ width: '100%', height: 'auto', display: 'block', maxHeight: 200, objectFit: 'cover' }} />
                    <div style={{ padding: '3px 6px', background: '#F5F5F2', fontSize: 8, color: '#555', display: 'flex', justifyContent: 'space-between' }}>
                      <span>Foto {idx + 1}</span>
                      {f.timestamp && <span className="mono">{fmtDateTime(f.timestamp)}</span>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      })()}

      {/* ASSINATURAS */}
      <div className="doc-signatures-v2">
        <div className="sig-block">
          <div className="sig-line-v2"></div>
          <div className="sig-name-v2">{oe.criado_por}</div>
          <div className="sig-role-v2">Responsável pela expedição</div>
        </div>
        <div className="sig-block">
          <div className="sig-line-v2"></div>
          <div className="sig-name-v2">{oe.motorista_nome}</div>
          <div className="sig-role-v2">Motorista{oe.motorista_cpf ? ` · CPF ${oe.motorista_cpf}` : ''}</div>
        </div>
      </div>

      <div className="doc-footer-v2">
        <div><strong>DNLog · {oe.numero}</strong> · Gerado em {fmtDateTime(oe.criado_em)} por {oe.criado_por}</div>
        <div>Página 1 de 1</div>
      </div>
    </div>
  );
};
