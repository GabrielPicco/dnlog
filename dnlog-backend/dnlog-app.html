              {filtroAba === 'AGUARDA_LIB' && 'Nenhuma triangular aguardando liberação'}
              {filtroAba === 'LIBERADAS_HOJE' && 'Nenhuma triangular liberada hoje'}
              {filtroAba === 'ATIVAS' && 'Nenhuma triangular ativa'}
            </div>
            <div style={{ fontSize: 12 }}>Quando uma OE triangular for criada, ela aparece aqui.</div>

          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', minWidth: 1000 }}>

                  <th>OE</th>

                      <td className="mono cell-muted" style={{ fontSize: 11 }}>

                        </button>

                    <span style={{
                      width: 22, height: 22, borderRadius: 11,
                      background: s.concluida ? 'var(--green)' : etapaForm === s.num ? 'var(--accent)' : 'var(--bg-card)',
                      color: s.concluida || etapaForm === s.num ? 'white' : 'var(--text-muted)',
                      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                      fontSize: 11, fontWeight: 700, fontFamily: 'JetBrains Mono, monospace'
                    }}>
                      {s.bloqueada ? <i className="ti ti-lock" style={{ fontSize: 11 }}></i> : s.concluida ? <i className="ti ti-check" style={{ fontSize: 12 }}></i> : s.num}
                    </span>
                    <span style={{ fontSize: 12, color: etapaForm === s.num ? 'var(--text)' : 'var(--text-muted)', fontWeight: etapaForm === s.num ? 700 : 500 }}>
                      {s.label}
                    </span>
                  </button>
                  {i < arr.length - 1 && <i className="ti ti-chevron-right" style={{ color: 'var(--text-dim)', fontSize: 14 }}></i>}
                </React.Fragment>
              ))}
            </div>

            {/* Conteúdo da etapa */}
            <div style={{ padding: 20, flex: 1 }}>

              {/* ETAPA 1 — AGENDAMENTO (read-only, info da OE) */}
              {etapaForm === 1 && (
                <div>
                  <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10, color: 'var(--accent-light)' }}>
                    <i className="ti ti-calendar-event"></i> 1. Agendamento (informações da OE)
                  </div>
                  <div style={{ background: 'var(--bg-card)', padding: 14, borderRadius: 6, fontSize: 12, lineHeight: 1.7 }}>
                    <div><strong>Cliente:</strong> {getParadas(oeAberta)[0]?.cliente}</div>
                    <div><strong>Fornecedor (carga):</strong> {oeAberta.fornecedor_nome}</div>
                    {oeAberta.fornecedor_endereco && <div><strong>Endereço:</strong> {oeAberta.fornecedor_endereco}</div>}
                    <div><strong>Motorista:</strong> {oeAberta.motorista_nome} · CPF <span className="mono">{oeAberta.motorista_cpf}</span></div>
                    <div><strong>Veículo:</strong> <span className="mono">{oeAberta.veiculo_placa}/{oeAberta.veiculo_placa_uf}</span> {oeAberta.veiculo_tipo}</div>
                    <div><strong>Data prevista:</strong> <span className="mono">{fmtDate(oeAberta.data_prevista)} {oeAberta.hora_prevista}</span></div>
                    <div><strong>Volume:</strong> {totalBBs(oeAberta)} un. · {fmtMoney(totalValor(oeAberta))}</div>
                  </div>
                  <div style={{ marginTop: 16, textAlign: 'right' }}>
                    <button className="btn btn-primary" onClick={() => setEtapaForm(2)}>
                      Próxima etapa <i className="ti ti-chevron-right"></i>
                    </button>
                  </div>
                </div>
              )}

              {/* ETAPA 2 — TROCA DE NOTA */}
              {etapaForm === 2 && (
                <div>
                  <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10, color: 'var(--orange)' }}>
                    <i className="ti ti-file-invoice"></i> 2. Troca de nota
                  </div>
                  <div style={{ background: 'var(--orange-bg)', borderLeft: '3px solid var(--orange)', padding: 10, marginBottom: 14, fontSize: 11, lineHeight: 1.5, color: 'var(--orange)' }}>
                    <i className="ti ti-info-circle"></i> Registre os dados da nota fiscal que o fornecedor emitiu para esta operação.
                    {oeAberta.status !== 'PROGRAMADA' && <strong> · NF já registrada — você pode revisar.</strong>}
                  </div>
                  <div className="field" style={{ marginBottom: 12 }}>
                    <label className="field-label" style={{ color: 'var(--orange)' }}>Chave de acesso da NF-e (44 dígitos)</label>
                    <input
                      className="input mono"
                      value={nfChave}
                      onChange={e => {
                        const v = e.target.value;
                        setNfChave(v);
                        const r = validarChaveNFe(v, fornCnpjTriang);
                        if (r.valido && r.info.numero && !nfFornecedor.trim()) setNfFornecedor(r.info.numero);
                      }}
                      placeholder="Cole/digite os 44 dígitos da chave de acesso"
                      maxLength={60}
                      style={{ borderColor: chaveInfo.vazio ? 'var(--border-strong)' : (chaveInfo.valido ? 'var(--green)' : 'var(--red)') }}
                    />
                    {!chaveInfo.vazio && (
                      <div style={{ marginTop: 6, fontSize: 12, lineHeight: 1.5 }}>
                        {chaveInfo.valido ? (
                          <div style={{ color: 'var(--green)' }}>
                            <i className="ti ti-circle-check"></i> <strong>Chave válida</strong>
                            <div className="cell-muted" style={{ marginTop: 2 }}>
                              NF-e nº <strong className="mono">{chaveInfo.info.numero}</strong> · série {chaveInfo.info.serie} · {chaveInfo.info.uf} · emissão {chaveInfo.info.emissao} · CNPJ <span className="mono">{chaveInfo.info.cnpjFmt}</span>
                              {chaveInfo.info.cnpjConfere === true && <span style={{ color: 'var(--green)' }}> · ✓ confere com o fornecedor</span>}
                            </div>
                          </div>
                        ) : (
                          <div style={{ color: 'var(--red)' }}>
                            <i className="ti ti-alert-triangle"></i> {chaveInfo.erros.join(' · ')}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                  <div className="field-row" style={{ display: 'flex', gap: 12 }}>
                    <div className="field" style={{ flex: 2, marginBottom: 12 }}>
                      <label className="field-label" style={{ color: 'var(--orange)' }}>Nº da NF do fornecedor *</label>
                      <input
                        className="input mono"
                        value={nfFornecedor}
                        onChange={e => setNfFornecedor(e.target.value)}
                        placeholder="Ex: 123456"
                        style={{ borderColor: !nfFornecedor ? 'var(--orange)' : 'var(--border-strong)' }}
                      />
                    </div>
                    <div className="field" style={{ flex: 1, marginBottom: 12 }}>
                      <label className="field-label">Data de emissão</label>
                      <input type="date" className="input mono" value={nfData} onChange={e => setNfData(e.target.value)} />
                    </div>
                    <div className="field" style={{ flex: 1, marginBottom: 12 }}>
                      <label className="field-label">Valor da NF</label>
                      <input
                        className="input mono"
                        value={nfValor}
                        onChange={e => setNfValor(e.target.value.replace(/[^\d,.-]/g, ''))}
                        placeholder="R$ 0,00"
                      />
                    </div>
                  </div>
                  <div style={{
                    padding: 12, background: qtdsConferem ? 'var(--green-bg)' : 'var(--red-bg)',
                    border: '1px solid ' + (qtdsConferem ? 'var(--green)' : 'var(--red)'),
                    borderRadius: 6, marginBottom: 12
                  }}>
                    <label style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', fontSize: 13 }}>
                      <input
                        type="checkbox"
                        checked={qtdsConferem}
                        onChange={e => setQtdsConferem(e.target.checked)}
                        style={{ width: 18, height: 18, accentColor: qtdsConferem ? 'var(--green)' : 'var(--red)' }}
                      />
                      <span>
                        <strong style={{ color: qtdsConferem ? 'var(--green)' : 'var(--red)' }}>
                          {qtdsConferem ? '✓ Quantidades conferem com o pedido' : '⚠ Quantidades NÃO conferem'}
                        </strong>
                        <div style={{ fontSize: 11, color: 'var(--text-muted)', marginTop: 2 }}>
                          Confirme que os volumes na NF do fornecedor batem com as {totalBBs(oeAberta)} un. solicitadas na OE.
                        </div>
                      </span>
                    </label>
                  </div>
                  <div className="field">
                    <label className="field-label">Observações (opcional)</label>
                    <textarea className="input" rows="2" value={obsNF} onChange={e => setObsNF(e.target.value)}
                      placeholder="Ex: NF emitida com peso bruto X, lacre Y..." />
                  </div>
                  <div style={{ marginTop: 16, display: 'flex', justifyContent: 'space-between', gap: 8 }}>
                    <button className="btn btn-ghost" onClick={() => setEtapaForm(1)}>
                      <i className="ti ti-chevron-left"></i> Voltar
                    </button>
                    <button className="btn btn-primary" onClick={confirmarNF}>
                      {oeAberta.status === 'PROGRAMADA' ? 'Confirmar NF e avançar' : 'Atualizar NF'} <i className="ti ti-chevron-right"></i>
                    </button>
                  </div>
                </div>
              )}

              {/* ETAPA 3 — LIBERAÇÃO */}
              {etapaForm === 3 && (
                <div>
                  <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10, color: 'var(--blue)' }}>
                    <i className="ti ti-truck"></i> 3. Liberação do veículo
                  </div>
                  {oeAberta.status === 'PROGRAMADA' ? (
                    <div style={{ background: 'var(--red-bg)', borderLeft: '3px solid var(--red)', padding: 10, marginBottom: 14, fontSize: 11, lineHeight: 1.5, color: 'var(--red)' }}>
                      <i className="ti ti-alert-triangle"></i> A NF do fornecedor ainda não foi registrada. Volte à etapa 2 antes de liberar.
                    </div>
                  ) : (
                    <>
                      {/* Resumo NF */}
                      {oeAberta.nf_fornecedor && (
                        <div style={{ background: 'var(--bg-card)', padding: 10, borderRadius: 6, marginBottom: 14, fontSize: 11, lineHeight: 1.6 }}>
                          <div style={{ color: 'var(--text-muted)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', fontSize: 9, marginBottom: 4 }}>NF DO FORNECEDOR</div>
                          <div>Nº <strong className="mono">{oeAberta.nf_fornecedor}</strong> · emitida em <strong className="mono">{fmtDate(oeAberta.nf_fornecedor_data)}</strong></div>
                          {oeAberta.nf_fornecedor_valor && <div>Valor: <strong>{oeAberta.nf_fornecedor_valor}</strong></div>}
                          <div>Quantidades: {oeAberta.nf_qtds_conferem !== false
                            ? <strong style={{ color: 'var(--green)' }}>✓ Conferem</strong>
                            : <strong style={{ color: 'var(--red)' }}>⚠ Não conferem</strong>}
                          </div>
                        </div>
                      )}
                      <div style={{ background: 'var(--blue-bg)', borderLeft: '3px solid var(--blue)', padding: 10, marginBottom: 14, fontSize: 11, lineHeight: 1.5, color: 'var(--blue)' }}>
                        <i className="ti ti-info-circle"></i> Confirme a saída do veículo. Após liberar, a OE migra para "Embarcada".
                      </div>
                      <div className="field-row" style={{ display: 'flex', gap: 12 }}>
                        <div className="field" style={{ flex: 1, marginBottom: 12 }}>
                          <label className="field-label" style={{ color: 'var(--orange)' }}>Horário de saída *</label>
                          <input
                            type="time"
                            className="input mono"
                            value={horaSaida}
                            onChange={e => setHoraSaida(e.target.value)}
                            style={{ borderColor: !horaSaida ? 'var(--orange)' : 'var(--border-strong)' }}
                          />
                        </div>
                        <div className="field" style={{ flex: 2, marginBottom: 12 }}>
                          <label className="field-label">Observações da liberação</label>
                          <input
                            className="input"
                            value={obsLiberacao}
                            onChange={e => setObsLiberacao(e.target.value)}
                            placeholder="Ex: Veículo lacrado, motorista alertado..."
                          />
                        </div>
                      </div>
                    </>
                  )}
                  <div style={{ marginTop: 16, display: 'flex', justifyContent: 'space-between', gap: 8 }}>
                    <button className="btn btn-ghost" onClick={() => setEtapaForm(2)}>
                      <i className="ti ti-chevron-left"></i> Voltar
                    </button>
                    {oeAberta.status === 'NOTA_TROCADA' && (
                      <button className="btn btn-primary" onClick={confirmarLiberacao} style={{ background: 'var(--green)' }}>
                        <i className="ti ti-check"></i> Liberar veículo
                      </button>
                    )}
                    {['EMBARCADA','EM_TRANSITO','ENTREGUE'].includes(oeAberta.status) && (
                      <span className="chip" style={{ background: 'var(--green-bg)', color: 'var(--green)', fontSize: 12, padding: '6px 10px', fontWeight: 700 }}>
                        <i className="ti ti-check"></i> Veículo já liberado em {oeAberta.embarcada_em ? fmtDateTime(oeAberta.embarcada_em) : '—'}
                      </span>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

</script>
</body>
</html>
