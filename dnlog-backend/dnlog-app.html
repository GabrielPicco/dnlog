// ============================================================
// ORDENAÇÃO POR CLIQUE NO CABEÇALHO (reutilizável entre tabelas)
// ============================================================
// useSort guarda coluna + direção; SortTh é o <th> clicável com a setinha;
// sortRows ordena por um accessor genérico (vazios/null sempre vão pro fim).
const useSort = (defCol, defDir) => {
  const [sortCol, setSortCol] = useState(defCol);
  const [sortDir, setSortDir] = useState(defDir || 'asc');
  const onSort = (col, colDefDir) => {
    if (sortCol === col) setSortDir(d => (d === 'asc' ? 'desc' : 'asc'));
    else { setSortCol(col); setSortDir(colDefDir || 'asc'); }
  };
  return { sortCol, sortDir, onSort };
};
const SortTh = ({ col, sortCol, sortDir, onSort, defDir, className, style, children }) => (
  <th className={className}
      style={{ cursor: 'pointer', userSelect: 'none', whiteSpace: 'nowrap', ...(style || {}) }}
      onClick={() => onSort(col, defDir)}>
    {children}{' '}
    <i className={'ti ' + (sortCol === col ? (sortDir === 'asc' ? 'ti-arrow-up' : 'ti-arrow-down') : 'ti-arrows-sort')}
       style={{ fontSize: 11, marginLeft: 2, opacity: sortCol === col ? 1 : 0.35 }}></i>
  </th>
);
const sortRows = (rows, sortCol, sortDir, getVal) => {
  const dir = sortDir === 'asc' ? 1 : -1;
  return [...rows].sort((a, b) => {
    const va = getVal(a, sortCol), vb = getVal(b, sortCol);
    const ea = va === '' || va == null, eb = vb === '' || vb == null;
    if (ea && eb) return 0;
    if (ea) return 1;   // vazio sempre por último
    if (eb) return -1;
    if (typeof va === 'number' && typeof vb === 'number') return dir * (va - vb);
    return dir * String(va).localeCompare(String(vb), 'pt');
  });
};

const Pedidos = ({ ctx }) => {
  const [q, setQ] = useState('');
  const [statusSel, setStatusSel] = useState(['aberto']);
  const [filtroPrazo, setFiltroPrazo] = useState('todos'); // todos, atrasado, hoje, 7d, 30d, sem_prazo
  const [filtroVendedor, setFiltroVendedor] = useState('todos');
  const [filtroGrupo, setFiltroGrupo] = useState('todos');
  const [filtroCultivar, setFiltroCultivar] = useState('todos');
  const [filtroItem, setFiltroItem] = useState('todos');
  const { sortCol, sortDir, onSort } = useSort('entrega', 'asc'); // ordenação por clique no cabeçalho
  const sortProps = { sortCol, sortDir, onSort };

  // Filtros iguais aos da tela de Estoque (grupo/cultivar/item), + vendedor.
  // Item é nível-linha; um pedido "casa" se tiver pelo menos um item que passe.
  const temItemFiltro = filtroGrupo !== 'todos' || filtroCultivar !== 'todos' || filtroItem !== 'todos';
  const itemMatch = (i) =>
    (filtroGrupo === 'todos' || i.grupo_nome === filtroGrupo) &&
    (filtroCultivar === 'todos' || (i.descricao || i.cultivar_nome) === filtroCultivar) &&
    (filtroItem === 'todos' || i.codigo === filtroItem);
  const filtrandoPedidos = filtroVendedor !== 'todos' || temItemFiltro;
  const limparFiltrosPedidos = () => { setFiltroVendedor('todos'); setFiltroGrupo('todos'); setFiltroCultivar('todos'); setFiltroItem('todos'); };
  // Opções (da carteira inteira, para sempre poder escolher qualquer valor).
  const optVendedores = useMemo(() => Array.from(new Set((ctx.pedidos || []).map(p => p.vendedor).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'pt')), [ctx.pedidos]);
  const optGrupos = useMemo(() => Array.from(new Set((ctx.pedidos || []).flatMap(p => (p.itens || []).map(i => i.grupo_nome)).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'pt')), [ctx.pedidos]);
  const optCultivares = useMemo(() => Array.from(new Set((ctx.pedidos || []).flatMap(p => (p.itens || []).map(i => i.descricao || i.cultivar_nome)).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'pt')), [ctx.pedidos]);
  const optItens = useMemo(() => Array.from(new Map((ctx.pedidos || []).flatMap(p => (p.itens || [])).filter(i => i.codigo).map(i => [i.codigo, i.descricao || ''])).entries()).sort((a, b) => a[0].localeCompare(b[0])), [ctx.pedidos]);

  // Helpers de cálculo de urgência
  const calcUrgencia = (dataEntrega) => {
    if (!dataEntrega) return { categoria: 'sem_prazo', dias: null, label: 'Sem prazo', cor: 'var(--text-muted)', bgCor: 'transparent' };
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const entrega = new Date(dataEntrega); entrega.setHours(0, 0, 0, 0);
    const diffMs = entrega - hoje;
    const dias = Math.round(diffMs / (1000 * 60 * 60 * 24));
    // Atrasado mantém vermelho destacado (crítico).
    // Demais categorias usam cinza claro para não poluir visualmente — diferença vem por ícone e peso da fonte.
    if (dias < 0) return { categoria: 'atrasado', dias, label: `${Math.abs(dias)}d atrasado`, cor: 'var(--red)', bgCor: 'var(--red-bg)' };
    if (dias === 0) return { categoria: 'hoje', dias, label: 'Hoje', cor: 'var(--text)', bgCor: 'var(--bg-elev)' };
    if (dias <= 3) return { categoria: 'urgente', dias, label: `${dias}d`, cor: 'var(--text)', bgCor: 'var(--bg-elev)' };
    if (dias <= 7) return { categoria: '7d', dias, label: `${dias}d`, cor: 'var(--text-muted)', bgCor: 'var(--bg-elev)' };
    if (dias <= 30) return { categoria: '30d', dias, label: `${dias}d`, cor: 'var(--text-muted)', bgCor: 'transparent' };
    return { categoria: 'futuro', dias, label: `${dias}d`, cor: 'var(--text-dim)', bgCor: 'transparent' };
  };

  const lista = useMemo(() => {
    let l = ctx.pedidos;
    if (statusSel.length) l = l.filter(p => statusSel.includes(p.status_sap));
    if (q) {
      const ql = q.toLowerCase();
      l = l.filter(p =>
        p.numero.toLowerCase().includes(ql) ||
        p.cliente.toLowerCase().includes(ql) ||
        (p.vendedor||'').toLowerCase().includes(ql)
      );
    }
    // Filtro de prazo
    if (filtroPrazo !== 'todos') {
      l = l.filter(p => {
        const u = calcUrgencia(p.data_entrega);
        if (filtroPrazo === 'atrasado') return u.categoria === 'atrasado';
        if (filtroPrazo === 'hoje') return u.categoria === 'hoje' || u.categoria === 'urgente';
        if (filtroPrazo === '7d') return ['atrasado','hoje','urgente','7d'].includes(u.categoria);
        if (filtroPrazo === '30d') return ['atrasado','hoje','urgente','7d','30d'].includes(u.categoria);
        if (filtroPrazo === 'sem_prazo') return u.categoria === 'sem_prazo';
        return true;
      });
    }
    // Filtros estilo Estoque
    if (filtroVendedor !== 'todos') l = l.filter(p => (p.vendedor || '') === filtroVendedor);
    if (temItemFiltro) l = l.filter(p => (p.itens || []).some(itemMatch));
    // Ordenação por clique no cabeçalho
    const getVal = (p, col) => {
      switch (col) {
        case 'numero': return p.numero || '';
        case 'cliente': return p.cliente || '';
        case 'vendedor': return p.vendedor || '';
        case 'emissao': return p.data_emissao || '';
        case 'entrega': return p.data_entrega || '';
        case 'itens': return p.itens.length;
        case 'saldo': return p.qtd_saldo_bb || 0;
        case 'saldoaberto': return p.saldo_aberto || 0;
        case 'status': return p.status_sap || '';
        default: return '';
      }
    };
    return sortRows(l, sortCol, sortDir, getVal);
  }, [ctx.pedidos, q, statusSel, filtroPrazo, filtroVendedor, filtroGrupo, filtroCultivar, filtroItem, sortCol, sortDir]);

  // Totalizador — reflete o que está filtrado (lista). Com filtro de item ativo,
  // soma só os itens que casam; senão, todos os itens dos pedidos filtrados.
  const tot = useMemo(() => {
    let unid = 0, valor = 0, saldoAb = 0;
    lista.forEach(p => {
      const its = (p.itens || []).filter(i => (temItemFiltro ? itemMatch(i) : true));
      unid += its.reduce((a, i) => a + (i.qtd_bb || 0), 0);
      valor += its.reduce((a, i) => a + (i.valor_total != null ? i.valor_total : (i.qtd_bb || 0) * (i.valor_unitario || 0)), 0);
      saldoAb += its.reduce((a, i) => a + (i.saldo || 0) * (i.valor_unitario || 0), 0);
    });
    return { nPed: lista.length, unid, valor, saldoAb };
  }, [lista, filtroGrupo, filtroCultivar, filtroItem]);

  // Stats por urgência
  const statsPrazo = useMemo(() => {
    const stats = { atrasado: 0, hoje: 0, urgente: 0, '7d': 0, '30d': 0, sem_prazo: 0, futuro: 0 };
    ctx.pedidos.filter(p => p.tem_saldo).forEach(p => {
      const u = calcUrgencia(p.data_entrega);
      stats[u.categoria] = (stats[u.categoria] || 0) + 1;
    });
    return stats;
  }, [ctx.pedidos]);

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb"><i className="ti ti-home"></i> Operação · Pedidos SAP</div>
          <h1 className="page-title">Pedidos do SAP B1</h1>
          <p className="page-subtitle">Espelho em tempo real · {ctx.pedidos.length} pedidos · {ctx.pedidos.filter(p => p.tem_saldo).length} com saldo aberto</p>
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          <TogglePedidos ctx={ctx} ativo="pedidos" />
          <button
            className="btn btn-ghost"
            onClick={() => {
              // Exporta CSV com saldo atual de cada pedido + linha por item
              const linhas = ['Pedido;Cliente;Vendedor;Data emissao;Data entrega;Item;Descricao;Cultivar;Peneira;Embalagem;Qtd total;Qtd entregue;Saldo;Valor unitario;Saldo valor;Status pedido'];
              ctx.pedidos.forEach(p => {
                p.itens.forEach(it => {
                  const status = p.tem_saldo ? 'ABERTO' : 'ATENDIDO';
                  const linha = [
                    p.numero, p.cliente, p.vendedor || '',
                    p.data_emissao || '', p.data_entrega || '',
                    it.codigo, it.descricao, it.cultivar_nome || '', it.peneira || '',
                    it.embalagem || it.unidade || '',
                    it.qtd_bb, (it.qtd_entregue_total || it.qtd_entregue || 0),

                    status
                  ].map(c => String(c == null ? '' : c).replace(/;/g, ',')).join(';');
                  linhas.push(linha);
                });
              });
              const csv = linhas.join('\n');
              const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });

// Painel de ESTOQUE REAL do SAP (saldo por item x armazém). Vem do backend
// (/api/estoque) no bootstrap. Se não houver dados (backend offline/mock sem
// estoque), o painel não aparece. NÃO é por lote — lotes seguem no mock.
const EstoqueSAP = () => {
  const [q, setQ] = useState('');
  const [filtroArmazem, setFiltroArmazem] = useState('todos');
  const dados = DADOS_ESTOQUE || [];

  const armazens = useMemo(
    () => Array.from(new Set(dados.map(l => l.armazem))).sort(),
    [dados]
  );

  const lista = useMemo(() => {
    let l = [...dados];
    if (filtroArmazem !== 'todos') l = l.filter(x => x.armazem === filtroArmazem);
    if (q) {
      const ql = q.toLowerCase();
      l = l.filter(x =>
        (x.item_codigo || '').toLowerCase().includes(ql) ||
        (x.descricao || '').toLowerCase().includes(ql) ||
        (x.armazem || '').toLowerCase().includes(ql)
      );
    }
    return l.sort((a, b) => (b.disponivel || 0) - (a.disponivel || 0));
  }, [dados, q, filtroArmazem]);

  const stats = useMemo(() => ({
    em_estoque: dados.reduce((a, l) => a + (l.em_estoque || 0), 0),
    disponivel: dados.reduce((a, l) => a + (l.disponivel || 0), 0),
    n_itens: new Set(dados.map(l => l.item_codigo)).size,
  }), [dados]);

  if (dados.length === 0) return null; // sem estoque real → não mostra o painel

  return (
    <div className="panel" style={{ marginBottom: 16 }}>
      <div className="panel-header">
        <div>
          <div style={{ fontSize: 14, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 8 }}>
            <i className="ti ti-building-warehouse"></i> Estoque SAP · saldo por item × armazém
            <span className="chip chip-green"><span className="status-dot"></span> dados reais · SAP B1</span>
          </div>
          <div className="cell-muted" style={{ fontSize: 12, marginTop: 4 }}>
            {stats.n_itens} itens · {fmtNum(stats.em_estoque)} em estoque · {fmtNum(stats.disponivel)} disponível · {armazens.length} armazém(ns)
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
          <select className="input" style={{ width: 'auto', padding: '6px 10px', fontSize: 12 }} value={filtroArmazem} onChange={e => setFiltroArmazem(e.target.value)}>
            <option value="todos">Todos os armazéns</option>
            {armazens.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
          <div className="search-box">
            <i className="ti ti-search"></i>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Buscar item, descrição, armazém..." />
          </div>
        </div>
      </div>
      {lista.length === 0 ? (
        <div className="empty"><i className="ti ti-box-off"></i><div>Nenhum item encontrado</div></div>
      ) : (
        <table>
          <thead><tr>
            <th>Item</th><th>Descrição</th><th>Armazém</th>
            <th className="num">Em estoque</th><th className="num">Comprometido</th><th className="num">Disponível</th>
          </tr></thead>
          <tbody>{lista.map((l, i) => (
            <tr key={`${l.item_codigo}_${l.armazem}_${i}`}>
              <td className="mono cell-primary" style={{ fontSize: 12, color: 'var(--accent-light)' }}>{l.item_codigo}</td>
              <td style={{ fontSize: 12 }}>{l.descricao}</td>
              <td style={{ fontSize: 12 }}>{l.armazem_nome || l.armazem}</td>
              <td className="num mono">{fmtNum(l.em_estoque)}</td>
              <td className="num mono" style={{ color: l.comprometido > 0 ? 'var(--orange)' : 'var(--text-dim)' }}>{l.comprometido ? fmtNum(l.comprometido) : '—'}</td>
              <td className="num mono cell-primary" style={{ color: l.disponivel > 0 ? 'var(--green)' : 'var(--red)', fontWeight: 700 }}>{fmtNum(l.disponivel)}</td>
            </tr>
          ))}</tbody>
        </table>
      )}
    </div>
  );
};

const Estoque = ({ ctx }) => {
  // A view CALCULOSALDOITENS traz DOIS tipos de linha:
  //  • COM lote  → estoque FÍSICO no armazém (aba "Lotes").
  //  • SEM lote  → total por ITEM, com o comprometido em pedidos de venda e o a
  //    receber de compra (aba "Compromissos"). Somar as duas juntas contaria o
  //    saldo em dobro — por isso ficam em abas separadas.
  const [aba, setAba] = useState('lotes'); // 'lotes' | 'compromissos' | 'terceiros'
  const [q, setQ] = useState('');
  const [filtroArmazem, setFiltroArmazem] = useState('todos');
  const [filtroGrupo, setFiltroGrupo] = useState('todos');
  const [filtroCultivar, setFiltroCultivar] = useState('todos');
  const [filtroItem, setFiltroItem] = useState('todos');
  const [sortBy, setSortBy] = useState('saldo');   // 'saldo' | 'descricao'
  const [sortDir, setSortDir] = useState('desc');  // 'asc' | 'desc'
  const toggleSort = (col) => {
    if (sortBy === col) setSortDir(d => (d === 'asc' ? 'desc' : 'asc'));
    else { setSortBy(col); setSortDir(col === 'descricao' ? 'asc' : 'desc'); }
  };
  const SortArrow = ({ col }) => (
    <i className={'ti ' + (sortBy === col ? (sortDir === 'asc' ? 'ti-arrow-up' : 'ti-arrow-down') : 'ti-arrows-sort')}
       style={{ fontSize: 11, marginLeft: 3, opacity: sortBy === col ? 1 : 0.35 }}></i>
  );
  const thSort = { cursor: 'pointer', userSelect: 'none', whiteSpace: 'nowrap' };
  const lotesRaw = DADOS_ESTOQUE_LOTES || [];
  const terceirosRaw = DADOS_ESTOQUE_TERCEIROS || [];
  // disponível: usa o já calculado (terceiros) ou saldo − comprometido (lotes).
  const disp = (l) => (l.disponivel != null ? l.disponivel : (l.saldo || 0) - (l.comprometido_venda || 0));

  const hoje = todayISO();
  const lim60 = addDays(hoje, 60);
  const statusValidade = (v) => {
    if (!v) return null;
    const d = String(v).slice(0, 10);
    if (d < hoje) return 'vencido';
    if (d <= lim60) return 'avencer';
    return 'ok';
  };

  // Lotes/Compromissos = estoque PRÓPRIO (DN_EST). Terceiros vem à parte, já com
  // lote/validade dos armazéns DN_EMTER/DN_DETER.
  const proprio = lotesRaw.filter(l => l.armazem === 'DN_EST');
  const nLotes = proprio.filter(l => l.lote).length;
  const nItens = proprio.filter(l => !l.lote).length;
  const nTerc = terceirosRaw.length;

  const base = useMemo(() => {
    if (aba === 'terceiros') return terceirosRaw;
    return proprio.filter(l => (aba === 'lotes' ? l.lote : !l.lote));
  }, [lotesRaw, terceirosRaw, aba]);
  const armazens = useMemo(() =>
    Array.from(new Set(base.map(l => l.armazem_nome || l.armazem).filter(Boolean))).sort(),
  [base]);
  const grupos = useMemo(() =>
    Array.from(new Set(base.map(l => l.grupo_nome).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'pt')),
  [base]);
  // Cultivar = descrição do item. Item = código. Opções sempre vêm da aba inteira
  // (base), para o usuário poder escolher qualquer valor mesmo com outro filtro ativo.
  const cultivares = useMemo(() =>
    Array.from(new Set(base.map(l => l.descricao).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'pt')),
  [base]);
  const itens = useMemo(() =>
    Array.from(new Map(base.filter(l => l.item_codigo).map(l => [l.item_codigo, l.descricao || ''])).entries())
      .sort((a, b) => a[0].localeCompare(b[0])),
  [base]);

  const lista = useMemo(() => {
    let l = base.map(x => ({ ...x, disponivel: disp(x) }));
    if (filtroArmazem !== 'todos') l = l.filter(x => (x.armazem_nome || x.armazem) === filtroArmazem);
    if (filtroGrupo !== 'todos') l = l.filter(x => x.grupo_nome === filtroGrupo);
    if (filtroCultivar !== 'todos') l = l.filter(x => x.descricao === filtroCultivar);
    if (filtroItem !== 'todos') l = l.filter(x => x.item_codigo === filtroItem);
    if (q) {
      const ql = q.toLowerCase();
      l = l.filter(x =>
        (x.lote || '').toLowerCase().includes(ql) ||
        (x.item_codigo || '').toLowerCase().includes(ql) ||
        (x.descricao || '').toLowerCase().includes(ql)
      );
    }
    const dir = sortDir === 'asc' ? 1 : -1;
    return l.sort((a, b) => sortBy === 'descricao'
      ? dir * String(a.descricao || '').localeCompare(String(b.descricao || ''), 'pt')
      : dir * ((a.saldo || 0) - (b.saldo || 0)));
  }, [base, q, filtroArmazem, filtroGrupo, filtroCultivar, filtroItem, sortBy, sortDir]);

  // Totalizador reflete o que está FILTRADO (lista), não a aba inteira.
  const stats = useMemo(() => ({
    saldo: lista.reduce((a, l) => a + (l.saldo || 0), 0),
    comprometido: lista.reduce((a, l) => a + (l.comprometido_venda || l.comprometido || 0), 0),
    disponivel: lista.reduce((a, l) => a + disp(l), 0),
    areceber: lista.reduce((a, l) => a + (l.a_receber_compra || 0), 0),
    n: lista.length,
    avencer: lista.filter(l => ['vencido', 'avencer'].includes(statusValidade(l.validade))).length,
    negativos: lista.filter(l => disp(l) < 0).length,
    em: lista.filter(l => l.tipo === 'em').reduce((a, l) => a + (l.saldo || 0), 0),
    de: lista.filter(l => l.tipo === 'de').reduce((a, l) => a + (l.saldo || 0), 0),
    narmazens: new Set(lista.map(l => l.armazem_nome || l.armazem).filter(Boolean)).size,
  }), [lista]);
  const filtrado = filtroArmazem !== 'todos' || filtroGrupo !== 'todos' || filtroCultivar !== 'todos' || filtroItem !== 'todos' || !!q;
  const limparFiltros = () => { setFiltroArmazem('todos'); setFiltroGrupo('todos'); setFiltroCultivar('todos'); setFiltroItem('todos'); setQ(''); };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb"><i className="ti ti-home"></i> Operação · Estoque</div>
          <h1 className="page-title">Estoque</h1>
          <p className="page-subtitle">
            {aba === 'lotes'
              ? `${stats.n} lotes físicos · saldo por lote (SAP)`
              : aba === 'compromissos'
              ? `${stats.n} itens · saldo, comprometido e a receber (SAP)`
              : `${stats.n} linha(s) em armazéns de terceiros (SAP)`}
          </p>
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          <div style={{ display: 'flex', gap: 4, background: 'var(--bg-card)', border: '1px solid var(--border-strong)', borderRadius: 6, padding: 2 }}>
            {[['lotes', 'Lotes (físico)', 'ti-building-warehouse', nLotes], ['compromissos', 'Compromissos', 'ti-clipboard-list', nItens], ['terceiros', 'Terceiros', 'ti-arrows-exchange', nTerc]].map(([k, l, ic, n]) => (
              <button key={k} onClick={() => { setAba(k); limparFiltros(); setSortBy('saldo'); setSortDir('desc'); }} style={{
                background: aba === k ? 'var(--bg-hover)' : 'none',
                color: aba === k ? 'var(--text)' : 'var(--text-muted)',
                border: 'none', padding: '6px 12px', borderRadius: 4, fontSize: 12,
                fontFamily: 'inherit', cursor: 'pointer', fontWeight: 600, display: 'flex', alignItems: 'center', gap: 6,
              }}><i className={'ti ' + ic}></i> {l} <span style={{ opacity: 0.55 }}>{n}</span></button>
            ))}
          </div>
          <span className="chip chip-green"><span className="status-dot"></span> SAP</span>
        </div>
      </div>

      {aba === 'lotes' ? (
        <div className="metrics">
          <div className="metric"><div className="metric-label"><i className="ti ti-package"></i> Estoque físico</div><div className="metric-value">{fmtNum(stats.saldo)}</div><div className="metric-delta">un. em lotes</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-hash"></i> Lotes</div><div className="metric-value">{stats.n}</div><div className="metric-delta">com saldo</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-alarm"></i> A vencer</div><div className="metric-value" style={{ color: stats.avencer ? 'var(--orange)' : 'var(--text)' }}>{stats.avencer}</div><div className="metric-delta">vencidos ou ≤ 60 dias</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-building-warehouse"></i> Armazéns</div><div className="metric-value">{stats.narmazens}</div><div className="metric-delta">com estoque</div></div>
        </div>
      ) : aba === 'compromissos' ? (
        <div className="metrics">
          <div className="metric"><div className="metric-label"><i className="ti ti-package"></i> Saldo</div><div className="metric-value">{fmtNum(stats.saldo)}</div><div className="metric-delta">un. por item</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-lock"></i> Comprometido</div><div className="metric-value" style={{ color: 'var(--orange)' }}>{fmtNum(stats.comprometido)}</div><div className="metric-delta">Em pedidos de venda</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-basket"></i> Disponível</div><div className="metric-value" style={{ color: stats.disponivel < 0 ? 'var(--red)' : 'var(--green)' }}>{fmtNum(stats.disponivel)}</div><div className="metric-delta">{stats.negativos} item(ns) negativo(s)</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-truck-loading"></i> A receber</div><div className="metric-value">{fmtNum(stats.areceber)}</div><div className="metric-delta">De pedidos de compra</div></div>
        </div>
      ) : (
        <div className="metrics">
          <div className="metric"><div className="metric-label"><i className="ti ti-arrows-exchange"></i> Total em terceiros</div><div className="metric-value">{fmtNum(stats.saldo)}</div><div className="metric-delta">un. nos armazéns de terceiros</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-building-warehouse"></i> EM terceiros</div><div className="metric-value" style={{ color: 'var(--blue)' }}>{fmtNum(stats.em)}</div><div className="metric-delta">Nosso, guardado fora</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-users"></i> DE terceiros</div><div className="metric-value" style={{ color: 'var(--orange)' }}>{fmtNum(stats.de)}</div><div className="metric-delta">De clientes, conosco</div></div>
          <div className="metric"><div className="metric-label"><i className="ti ti-list"></i> Linhas</div><div className="metric-value">{stats.n}</div><div className="metric-delta">item × armazém</div></div>
        </div>
      )}

      <div className="panel">
        <div className="panel-header">
          <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
            <select className="input" style={{ width: 'auto', padding: '6px 10px', fontSize: 12 }} value={filtroArmazem} onChange={e => setFiltroArmazem(e.target.value)}>
              <option value="todos">Todos os armazéns</option>
              {armazens.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
            <select className="input" style={{ width: 'auto', padding: '6px 10px', fontSize: 12 }} value={filtroGrupo} onChange={e => setFiltroGrupo(e.target.value)}>
              <option value="todos">Todos os grupos</option>
              {grupos.map(g => <option key={g} value={g}>{g}</option>)}
            </select>
            <select className="input" style={{ width: 'auto', maxWidth: 220, padding: '6px 10px', fontSize: 12 }} value={filtroCultivar} onChange={e => setFiltroCultivar(e.target.value)}>
              <option value="todos">Todas as cultivares</option>
              {cultivares.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <select className="input" style={{ width: 'auto', maxWidth: 220, padding: '6px 10px', fontSize: 12 }} value={filtroItem} onChange={e => setFiltroItem(e.target.value)}>
              <option value="todos">Todos os itens</option>
              {itens.map(([cod, desc]) => <option key={cod} value={cod}>{cod}{desc ? ' — ' + desc : ''}</option>)}
            </select>
            {filtrado && (
              <button onClick={limparFiltros} style={{ background: 'none', border: '1px solid var(--border-strong)', color: 'var(--text-muted)', cursor: 'pointer', fontSize: 12, fontFamily: 'inherit', borderRadius: 6, padding: '6px 10px', display: 'flex', alignItems: 'center', gap: 4 }}>
                <i className="ti ti-x"></i> Limpar
              </button>
            )}
          </div>
          <div className="search-box">
            <i className="ti ti-search"></i>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Buscar lote, item, descrição..." />
          </div>
        </div>
        {lista.length === 0 ? (
          <div className="empty">
            <i className="ti ti-building-warehouse"></i>
            <div>{base.length === 0
              ? (aba === 'terceiros' ? 'Sem estoque em terceiros no momento' : 'Sem estoque carregado')
              : 'Nada com esse filtro'}</div>
            <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>
              {base.length === 0
                ? (aba === 'terceiros'
                    ? 'Nenhum saldo nos armazéns EM/DE Terceiros agora. Aparece aqui automaticamente quando houver mercadoria.'
                    : 'O backend do DNLog precisa estar no ar (consulta CALCULOSALDOITENS no SAP).')
                : 'Ajuste a busca ou o armazém.'}
            </div>
          </div>
        ) : aba === 'lotes' ? (
          <table>
            <thead><tr>
              <th>Lote</th><th>Item</th>
              <th style={thSort} onClick={() => toggleSort('descricao')}>Descrição <SortArrow col="descricao" /></th>
              <th>Armazém</th><th>Validade</th>
              <th className="num" style={thSort} onClick={() => toggleSort('saldo')}>Saldo físico <SortArrow col="saldo" /></th>
            </tr></thead>
            <tbody>{lista.map((l, i) => {
              const sv = statusValidade(l.validade);
              return (
                <tr key={(l.item_codigo || '') + '|' + (l.lote || '') + '|' + i}>
                  <td className="cell-primary mono" style={{ fontSize: 12, color: 'var(--accent-light)' }}>{l.lote}</td>
                  <td className="mono cell-muted" style={{ fontSize: 11 }}>{l.item_codigo}</td>
                  <td><div className="cell-primary" style={{ fontSize: 13 }}>{l.descricao}</div></td>
                  <td style={{ fontSize: 12 }}>{l.armazem_nome || l.armazem}</td>
                  <td className="mono" style={{ fontSize: 12, color: sv === 'vencido' ? 'var(--red)' : sv === 'avencer' ? 'var(--orange)' : 'var(--text-muted)' }}>{fmtDate(l.validade)}{sv === 'vencido' ? ' ⚠' : ''}</td>
                  <td className="num mono cell-primary" style={{ fontWeight: 700, color: 'var(--green)' }}>{fmtNum(l.saldo || 0)}</td>
                </tr>
              );
            })}</tbody>
          </table>
        ) : aba === 'compromissos' ? (
          <table>
            <thead><tr>
              <th>Item</th>
              <th style={thSort} onClick={() => toggleSort('descricao')}>Descrição <SortArrow col="descricao" /></th>
              <th>Armazém</th>
              <th className="num" style={thSort} onClick={() => toggleSort('saldo')}>Saldo <SortArrow col="saldo" /></th>
              <th className="num">Compr.</th><th className="num">A receber</th><th className="num">Disp.</th><th>Status</th>
            </tr></thead>
            <tbody>{lista.map((l, i) => (
              <tr key={(l.item_codigo || '') + '|' + i}>
                <td className="cell-primary mono" style={{ fontSize: 12 }}>{l.item_codigo}</td>
                <td><div className="cell-primary" style={{ fontSize: 13 }}>{l.descricao}</div></td>
                <td style={{ fontSize: 12 }}>{l.armazem_nome || l.armazem}</td>
                <td className="num mono cell-primary" style={{ fontWeight: 700 }}>{fmtNum(l.saldo || 0)}</td>
                <td className="num mono" style={{ color: (l.comprometido_venda || 0) > 0 ? 'var(--orange)' : 'var(--text-dim)' }}>{(l.comprometido_venda || 0) > 0 ? fmtNum(l.comprometido_venda) : '—'}</td>
                <td className="num mono" style={{ color: (l.a_receber_compra || 0) > 0 ? 'var(--blue)' : 'var(--text-dim)' }}>{(l.a_receber_compra || 0) > 0 ? fmtNum(l.a_receber_compra) : '—'}</td>
                <td className="num mono cell-primary" style={{ color: l.disponivel < 0 ? 'var(--red)' : 'var(--green)', fontWeight: 700 }}>{fmtNum(l.disponivel)}</td>
                <td>
                  {l.disponivel < 0 ?
                    <span className="chip chip-red"><i className="ti ti-arrow-down"></i> Negativo</span> :
                    (l.comprometido_venda || 0) > 0 ?
                      <span className="chip chip-orange"><i className="ti ti-lock"></i> Comprometido</span> :
                      <span className="chip chip-green"><i className="ti ti-check"></i> Livre</span>
                  }
                </td>
              </tr>
            ))}</tbody>
          </table>
        ) : (
          <table>
            <thead><tr>
              <th>Tipo</th><th>Lote</th><th>Item</th>
              <th style={thSort} onClick={() => toggleSort('descricao')}>Descrição <SortArrow col="descricao" /></th>
              <th>Armazém</th><th>Validade</th>
              <th className="num" style={thSort} onClick={() => toggleSort('saldo')}>Saldo <SortArrow col="saldo" /></th>
              <th className="num">Compr.</th><th className="num">Disp.</th>
            </tr></thead>
            <tbody>{lista.map((l, i) => {
              const sv = statusValidade(l.validade);
              return (
                <tr key={(l.item_codigo || '') + '|' + (l.lote || '') + '|' + (l.armazem || '') + '|' + i}>
                  <td>
                    {l.tipo === 'em'
                      ? <span className="chip" style={{ background: 'var(--blue-bg)', color: 'var(--blue)' }}>Em terceiros</span>
                      : <span className="chip chip-orange">De terceiros</span>}
                  </td>
                  <td className="cell-primary mono" style={{ fontSize: 12, color: l.lote ? 'var(--accent-light)' : 'var(--text-dim)' }}>{l.lote || '—'}</td>
                  <td className="mono cell-muted" style={{ fontSize: 11 }}>{l.item_codigo}</td>
                  <td><div className="cell-primary" style={{ fontSize: 13 }}>{l.descricao}</div></td>
                  <td style={{ fontSize: 12 }}>{l.armazem_nome || l.armazem}</td>
                  <td className="mono" style={{ fontSize: 12, color: sv === 'vencido' ? 'var(--red)' : sv === 'avencer' ? 'var(--orange)' : 'var(--text-muted)' }}>{fmtDate(l.validade)}{sv === 'vencido' ? ' ⚠' : ''}</td>
                  <td className="num mono cell-primary" style={{ fontWeight: 700 }}>{fmtNum(l.saldo || 0)}</td>
                  <td className="num mono" style={{ color: (l.comprometido || 0) > 0 ? 'var(--orange)' : 'var(--text-dim)' }}>{(l.comprometido || 0) > 0 ? fmtNum(l.comprometido) : '—'}</td>
                  <td className="num mono cell-primary" style={{ color: l.disponivel < 0 ? 'var(--red)' : 'var(--green)', fontWeight: 700 }}>{fmtNum(l.disponivel)}</td>
                </tr>
              );
            })}</tbody>
          </table>
        )}
      </div>
    </div>
  );
};

// EMBARQUE · RETIRADA EM FORNECEDORES (OE de entrada)
// ============================================================
// Lista as OEs de retirada (state.ordensCompra) e permite criar uma nova a
// partir de um pedido de compra do SAP. Fluxo espelha a OE de vendas, mas de
// entrada: escolhe o pedido de compra, os itens/quantidades e o motorista.
const EmbarquesFornecedores = ({ ctx }) => {
  const [aba, setAba] = useState('retirada'); // 'retirada' | 'agendamentos'
  const [q, setQ] = useState('');
  const dados = ctx.state.ordensCompra || [];
  const lista = useMemo(() => {
    let l = [...dados].sort((a, b) => new Date(b.criado_em) - new Date(a.criado_em));
    if (q) {
      const ql = q.toLowerCase();
      l = l.filter(o =>
        (o.numero || '').toLowerCase().includes(ql) ||
        (o.fornecedor || '').toLowerCase().includes(ql) ||
        (o.pedido_compra_numero || '').toLowerCase().includes(ql));
    }
    return l;
  }, [dados, q]);
  const ativos = dados.filter(o => o.status !== 'CANCELADA').length;
  const nAg = (ctx.state.agendamentos || []).length;
  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb"><i className="ti ti-home"></i> Operação · Embarque Fornecedores</div>
          <h1 className="page-title">Embarque · Fornecedores</h1>
          <p className="page-subtitle">
            {aba === 'retirada'
              ? `OEs de entrada (retirar produto no fornecedor) · ${ativos} ativas`
              : `Agendamentos avulsos de retirada · ${nAg} salvo(s) no banco`}
          </p>
        </div>
        <div style={{ display: 'flex', gap: 4, background: 'var(--bg-card)', border: '1px solid var(--border-strong)', borderRadius: 6, padding: 2 }}>
          {[['retirada', 'OEs de retirada', 'ti-truck-loading', ativos], ['agendamentos', 'Agendamentos', 'ti-calendar-event', nAg]].map(([k, l, ic, n]) => (
            <button key={k} onClick={() => setAba(k)} style={{
              background: aba === k ? 'var(--bg-hover)' : 'none',
              color: aba === k ? 'var(--text)' : 'var(--text-muted)',
              border: 'none', padding: '6px 12px', borderRadius: 4, fontSize: 12,
              fontFamily: 'inherit', cursor: 'pointer', fontWeight: 600, display: 'flex', alignItems: 'center', gap: 6,
            }}><i className={'ti ' + ic}></i> {l} <span style={{ opacity: 0.55 }}>{n}</span></button>
          ))}
        </div>
      </div>

      {aba === 'retirada' ? (
        <div>
          <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 10 }}>
            <button className="btn btn-primary" onClick={() => ctx.setScreen('nova-oe-fornecedor')}>
              <i className="ti ti-plus"></i> Nova OE de retirada
            </button>
          </div>
          <div className="panel">
            <div className="panel-header">
              <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{dados.length} OE(s) no total</div>
              <div className="search-box"><i className="ti ti-search"></i>
                <input value={q} onChange={e => setQ(e.target.value)} placeholder="Buscar OE, fornecedor, pedido..." /></div>
            </div>
            {lista.length === 0 ? (
              <div className="empty">
                <i className="ti ti-truck-loading"></i>
                <div>Nenhuma OE de retirada ainda</div>
                <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>
                  Clique em "Nova OE de retirada" para criar a primeira (a partir de um pedido de compra do SAP).
                </div>
              </div>
            ) : (
              <table>
                <thead><tr>
                  <th>OE</th><th>Fornecedor</th><th>Pedido compra</th><th className="num">Itens</th>
                  <th className="num">Volumes</th><th>Motorista</th><th>Placa</th><th>Prevista</th><th>Status</th><th></th>
                </tr></thead>
                <tbody>{lista.map(o => {
                  const vol = (o.itens || []).reduce((a, it) => a + (Number(it.qtd) || 0), 0);
                  return (
                    <tr key={o.id}>
                      <td className="cell-primary mono" style={{ fontSize: 12, color: 'var(--accent-light)' }}>{o.numero}</td>
                      <td style={{ fontSize: 13 }}>{o.fornecedor}</td>
                      <td className="mono cell-muted" style={{ fontSize: 12 }}>{o.pedido_compra_numero || '—'}</td>
                      <td className="num mono">{(o.itens || []).length}</td>
                      <td className="num mono">{fmtNum(vol)}</td>
                      <td style={{ fontSize: 12 }}>{o.motorista_nome || '—'}</td>
                      <td className="mono" style={{ fontSize: 12 }}>{o.veiculo_placa || '—'}</td>
                      <td className="mono" style={{ fontSize: 12 }}>{fmtDate(o.data_prevista)}</td>
                      <td><StatusChip status={o.status} /></td>
                      <td>
                        <div style={{ display: 'flex', gap: 2, justifyContent: 'flex-end' }}>
                          <button className="btn btn-ghost" style={{ padding: '4px 8px', fontSize: 11 }} title="Imprimir"
                            onClick={() => imprimirAgendamento({
                              num: o.numero,
                              campos: { fornecedor: o.fornecedor, data_prevista_do_embarque: o.data_prevista, motorista: o.motorista_nome, placa: o.veiculo_placa, local_de_retirada: o.local_retirada || '' },
                              produtos: (o.itens || []).map(it => ({ produto: it.descricao || it.codigo, embalagem: it.embalagem || it.unidade || '', qtd: it.qtd })),
                            }, 'OE de Retirada · Fornecedor')}>
                            <i className="ti ti-printer"></i>
                          </button>
                          {ctx.podeEditar && o.status !== 'CANCELADA' && (
                            <button className="btn btn-ghost" style={{ padding: '4px 8px', fontSize: 11 }} title="Cancelar OE"
                              onClick={() => { if (confirm(`Cancelar a OE ${o.numero}?`)) ctx.cancelarOECompra(o.id); }}>
                              <i className="ti ti-x"></i>
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}</tbody>
              </table>
            )}
          </div>
        </div>
      ) : (
        <AgendamentosFornecedor ctx={ctx} />
      )}
    </div>
  );
};

// Gera um documento A4 limpo (janela própria) e manda imprimir. Independe do
// CSS do app. Usado pelo Agendamento e pela OE de retirada (mesmo layout).
const imprimirAgendamento = (ag, titulo) => {
  const c = ag.campos || {};
  const prods = ag.produtos || [];
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
  const dataFmt = (d) => { try { return d ? new Date(d + 'T00:00:00').toLocaleDateString('pt-BR') : ''; } catch (e) { return d || ''; } };
  const fld = (label, val) => `<div class="fld"><span class="lbl">${esc(label)}</span><span class="val">${esc(val) || '&nbsp;'}</span></div>`;
  const secoes = AG_SECOES.map(sec => `
    <div class="sec"><div class="sec-h"><b>${sec.num}</b> ${esc(sec.titulo)}</div>
      <div class="grid">${sec.campos.map(f => fld(f.label, f.tipo === 'date' ? dataFmt(c[f.k]) : c[f.k])).join('')}</div>
    </div>`).join('');
  const prodRows = prods.length
    ? prods.map(p => `<tr><td>${esc(p.produto)}</td><td>${esc(p.embalagem)}</td><td class="num">${esc(p.qtd)}</td></tr>`).join('')
    : '<tr><td colspan="3" style="color:#999">—</td></tr>';
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(titulo || 'Agendamento')} ${esc(ag.num || ag.numero || '')}</title>
  <style>
    @page { size: A4 portrait; margin: 12mm; }
    *{box-sizing:border-box} body{font-family:-apple-system,Segoe UI,Arial,sans-serif;color:#1a1a1a;margin:0;font-size:12px}
    .head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1E5C3F;padding-bottom:8px;margin-bottom:14px}
    .brand{font-size:22px;font-weight:800;color:#1E5C3F;letter-spacing:.5px}
    .brand-sub{font-size:10px;color:#555;margin-top:2px}
    .meta{text-align:right;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.05em}
    .meta b{display:block;font-size:18px;color:#1E5C3F;letter-spacing:0}
    .sec{margin-bottom:12px}
    .sec-h{font-size:11px;font-weight:700;color:#1E5C3F;border-bottom:1px solid #ddd;padding-bottom:3px;margin-bottom:6px}
    .sec-h b{color:#aaa;margin-right:4px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px}
    .fld{display:flex;gap:8px;font-size:12px;padding:2px 0;border-bottom:1px dotted #eee}
    .fld .lbl{color:#666;min-width:135px}
    .fld .val{font-weight:600}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{border:1px solid #ccc;padding:5px 7px;text-align:left}
    th{background:#f2f0e9}
    .num{text-align:right}
    .obs{white-space:pre-wrap;border:1px solid #ddd;padding:8px;border-radius:4px;min-height:38px;font-size:12px}
    .foot{margin-top:22px;font-size:10px;color:#999;text-align:center}
  </style></head><body>
    <div class="head">
      <div><div class="brand">DN SEEDS</div><div class="brand-sub">DNSEEDS Agronegócios · CNPJ 62.255.734/0001-79</div></div>
      <div class="meta">${esc(titulo || 'Agendamento de Embarque')}<b>Nº ${esc(ag.num || ag.numero || '—')}</b>${c.data_prevista_do_embarque ? dataFmt(c.data_prevista_do_embarque) : ''}</div>
    </div>
    ${secoes}
    <div class="sec"><div class="sec-h"><b>04</b> Produtos a retirar</div>
      <table><thead><tr><th>Produto</th><th style="width:180px">Embalagem</th><th class="num" style="width:110px">Qtd</th></tr></thead><tbody>${prodRows}</tbody></table>
    </div>
    <div class="sec"><div class="sec-h"><b>05</b> Observações</div><div class="obs">${esc(c.instrucoes_para_o_fornecedor) || '&nbsp;'}</div></div>
    <div class="foot">Documento gerado pelo DNLog · DN Seeds</div>
  </body></html>`;
  const w = window.open('', '_blank');
  if (!w) { alert('Não consegui abrir a janela de impressão. Habilite pop-ups para este site e tente de novo.'); return; }
  w.document.open(); w.document.write(html); w.document.close(); w.focus();
  setTimeout(() => { try { w.print(); } catch (e) {} }, 350);
};

const AgendamentosFornecedor = ({ ctx }) => {
  const [q, setQ] = useState('');
  const [editando, setEditando] = useState(null); // objeto do agendamento (ou {} novo) | null
  const dados = ctx.state.agendamentos || [];
  const lista = useMemo(() => {
    let l = [...dados].sort((a, b) => (b.num || 0) - (a.num || 0));
    if (q) {
      const ql = q.toLowerCase();
      l = l.filter(a =>
        String(a.num || '').includes(ql) ||
        (a.fornecedor || '').toLowerCase().includes(ql) ||
        ((a.campos && a.campos.motorista) || '').toLowerCase().includes(ql));
    }
    return l;
  }, [dados, q]);

  const recebidas = dados.filter(a => a.recebida).length;
  const freteTotal = dados.reduce((s, a) => s + (Number(a.valor_frete) || 0), 0);

  const exportarCSV = () => {
    const cab = ['Num', 'Fornecedor', 'Data prevista', 'Motorista', 'Placa', 'Produtos', 'Volumes', 'Recebida', 'Valor frete'];
    const linhas = [cab.join(';')];
    dados.forEach(a => {
      const c = a.campos || {};
      const vol = (a.produtos || []).reduce((s, p) => s + (Number(p.qtd) || 0), 0);
      linhas.push([
        a.num, a.fornecedor || c.fornecedor || '', c.data_prevista_do_embarque || '',
        c.motorista || '', c.placa || '', (a.produtos || []).length, vol,
        a.recebida ? 'SIM' : 'NAO', (Number(a.valor_frete) || 0).toFixed(2),
      ].map(x => String(x == null ? '' : x).replace(/;/g, ',')).join(';'));
    });
    const blob = new Blob(['﻿' + linhas.join('\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const el = document.createElement('a'); el.href = url; el.download = `agendamentos_${new Date().toISOString().slice(0,10)}.csv`; el.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      <div className="metrics" style={{ gridTemplateColumns: 'repeat(4, 1fr)' }}>
        <div className="metric"><div className="metric-label"><i className="ti ti-calendar-event"></i> Agendamentos</div><div className="metric-value">{dados.length}</div><div className="metric-delta">salvos no banco</div></div>
        <div className="metric"><div className="metric-label"><i className="ti ti-package-import"></i> Recebidas</div><div className="metric-value" style={{ color: 'var(--green)' }}>{recebidas}</div><div className="metric-delta">de {dados.length}</div></div>
        <div className="metric"><div className="metric-label"><i className="ti ti-clock"></i> Pendentes</div><div className="metric-value" style={{ color: dados.length - recebidas ? 'var(--orange)' : 'var(--text)' }}>{dados.length - recebidas}</div><div className="metric-delta">a receber</div></div>
        <div className="metric"><div className="metric-label"><i className="ti ti-cash"></i> Frete pago</div><div className="metric-value" style={{ fontSize: 22 }}>{fmtMoney(freteTotal)}</div><div className="metric-delta">soma dos fretes</div></div>
      </div>

      <div className="panel">
        <div className="panel-header">
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn btn-primary" onClick={() => setEditando({})}>
              <i className="ti ti-plus"></i> Novo agendamento
            </button>
            <button className="btn btn-ghost" onClick={exportarCSV} disabled={dados.length === 0}>
              <i className="ti ti-file-export"></i> CSV
            </button>
          </div>
          <div className="search-box"><i className="ti ti-search"></i>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Buscar nº, fornecedor, motorista..." /></div>
        </div>
        {lista.length === 0 ? (
          <div className="empty">
            <i className="ti ti-calendar-event"></i>
            <div>{dados.length === 0 ? 'Nenhum agendamento salvo ainda' : 'Nada com essa busca'}</div>
            <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>
              Clique em "Novo agendamento" para registrar uma retirada avulsa no fornecedor.
            </div>
          </div>
        ) : (
          <table>
            <thead><tr>
              <th className="num">Nº</th><th>Fornecedor</th><th>Data</th><th>Motorista</th><th>Placa</th>
              <th className="num">Volumes</th><th style={{ textAlign: 'center' }}>Recebida</th>
              <th className="num">Valor frete</th><th></th>
            </tr></thead>
            <tbody>{lista.map(a => (
              <LinhaAgendamento key={a.id} ag={a} ctx={ctx} onEditar={() => setEditando(a)} />
            ))}</tbody>
          </table>
        )}
      </div>

      {editando && (
        <AgendamentoForm
          ctx={ctx}
          inicial={editando}
          onFechar={() => setEditando(null)}
        />
      )}
    </div>
  );
};

// Linha da lista com Recebida (checkbox) e Valor do frete (editável), que salvam
// direto no banco. O frete usa estado local + onBlur para não gravar a cada tecla.
const LinhaAgendamento = ({ ag, ctx, onEditar }) => {
  const c = ag.campos || {};
  const vol = (ag.produtos || []).reduce((s, p) => s + (Number(p.qtd) || 0), 0);
  const [frete, setFrete] = useState(ag.valor_frete == null ? '' : String(ag.valor_frete));
  useEffect(() => { setFrete(ag.valor_frete == null ? '' : String(ag.valor_frete)); }, [ag.valor_frete]);

  const salvarFrete = () => {
    const novo = frete === '' ? null : Number(String(frete).replace(',', '.'));
    if ((novo == null ? null : novo) === (ag.valor_frete == null ? null : ag.valor_frete)) return; // sem mudança
    ctx.salvarAgendamento({ ...ag, valor_frete: novo });
  };
  const toggleRecebida = () => ctx.salvarAgendamento({ ...ag, recebida: !ag.recebida });

  return (
    <tr>
      <td className="num mono cell-primary" style={{ color: 'var(--accent-light)', fontWeight: 700 }}>{ag.num}</td>
      <td style={{ fontSize: 13 }}>{ag.fornecedor || c.fornecedor || '—'}</td>
      <td className="mono" style={{ fontSize: 12 }}>{fmtDate(c.data_prevista_do_embarque)}</td>
      <td style={{ fontSize: 12 }}>{c.motorista || '—'}</td>
      <td className="mono" style={{ fontSize: 12 }}>{c.placa || '—'}</td>
      <td className="num mono">{vol ? fmtNum(vol) : '—'}</td>
      <td style={{ textAlign: 'center' }}>
        <input type="checkbox" checked={!!ag.recebida} onChange={toggleRecebida}
          title={ag.recebida ? 'Recebida' : 'Marcar como recebida'}
          style={{ width: 18, height: 18, cursor: 'pointer', accentColor: 'var(--green)' }} />
      </td>
      <td className="num">
        <div style={{ display: 'flex', alignItems: 'center', gap: 4, justifyContent: 'flex-end' }}>
          <span style={{ fontSize: 11, color: 'var(--text-dim)' }}>R$</span>
          <input value={frete} onChange={e => setFrete(e.target.value)} onBlur={salvarFrete}
            onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
            inputMode="decimal" placeholder="0,00"
            style={{ width: 90, padding: '4px 6px', textAlign: 'right', background: 'var(--bg-card)', border: '1px solid var(--border-strong)', borderRadius: 4, color: 'var(--text)', fontFamily: 'JetBrains Mono, monospace', fontSize: 12 }} />
        </div>
      </td>
      <td>
        <div style={{ display: 'flex', gap: 2 }}>
          <button className="btn btn-ghost" style={{ padding: '4px 8px', fontSize: 11 }} onClick={() => imprimirAgendamento(ag, 'Agendamento de Embarque')} title="Imprimir">
            <i className="ti ti-printer"></i>
          </button>
          <button className="btn btn-ghost" style={{ padding: '4px 8px', fontSize: 11 }} onClick={onEditar} title="Editar">
            <i className="ti ti-edit"></i>
          </button>
          <button className="btn btn-ghost" style={{ padding: '4px 8px', fontSize: 11 }} onClick={() => ctx.removerAgendamento(ag.id)} title="Remover">
            <i className="ti ti-trash"></i>
          </button>
        </div>
      </td>
    </tr>
  );
};

// Formulário (modal) de criação/edição de agendamento avulso.
const AgendamentoForm = ({ ctx, inicial, onFechar }) => {
  const editar = !!(inicial && inicial.id);
  const [campos, setCampos] = useState(() => ({ ...(inicial.campos || {}) }));
  const [produtos, setProdutos] = useState(() =>
    (inicial.produtos && inicial.produtos.length) ? inicial.produtos.map(p => ({ ...p })) : [{ produto: '', embalagem: '', qtd: '' }]
  );
  const [recebida, setRecebida] = useState(!!inicial.recebida);
  const [valorFrete, setValorFrete] = useState(inicial.valor_frete == null ? '' : String(inicial.valor_frete));
  const [salvando, setSalvando] = useState(false);

  const setCampo = (k, v) => setCampos(c => ({ ...c, [k]: v }));
  const setProd = (i, k, v) => setProdutos(ps => ps.map((p, j) => j === i ? { ...p, [k]: v } : p));
  const addProd = () => setProdutos(ps => [...ps, { produto: '', embalagem: '', qtd: '' }]);
  const rmProd = (i) => setProdutos(ps => ps.length > 1 ? ps.filter((_, j) => j !== i) : ps);

  const salvar = async () => {
    if (!(campos.fornecedor || '').trim()) { ctx.showToast('Informe o fornecedor', ''); return; }
    const prods = produtos.filter(p => (p.produto || '').trim() || (p.qtd || '').toString().trim());
    const rec = {
      ...(inicial.id ? { id: inicial.id, num: inicial.num } : {}),
      campos,
      produtos: prods,
      fornecedor: (campos.fornecedor || '').trim(),
      data: campos.data_prevista_do_embarque || null,
      recebida,
      valor_frete: valorFrete === '' ? null : Number(String(valorFrete).replace(',', '.')),
    };
    setSalvando(true);
    try { await ctx.salvarAgendamento(rec); onFechar(); }
    catch (e) { /* toast já exibido */ }
    finally { setSalvando(false); }
  };

  const lbl = { fontSize: 11, color: 'var(--text-muted)', display: 'block', marginBottom: 4 };
  const inp = { width: '100%', padding: '7px 9px', background: 'var(--bg-card)', border: '1px solid var(--border-strong)', borderRadius: 5, color: 'var(--text)', fontFamily: 'inherit', fontSize: 13 };

  return (
    <div className="modal-backdrop" onClick={onFechar}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 820, maxHeight: '90vh', display: 'flex', flexDirection: 'column' }}>
        <div className="modal-header">
          <div>
            <div style={{ fontSize: 11, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 600 }}>Agendamento de embarque</div>
            <div style={{ fontSize: 15, fontWeight: 700, marginTop: 2 }}>{editar ? `Editar #${inicial.num}` : 'Novo agendamento (retirada avulsa)'}</div>
          </div>
          <button className="btn btn-ghost" style={{ padding: '4px 8px' }} onClick={onFechar}><i className="ti ti-x"></i></button>
        </div>

        <div className="modal-body" style={{ padding: 20, overflowY: 'auto' }}>
          {AG_SECOES.map(sec => (
            <div key={sec.num} style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--accent-light)', marginBottom: 8, display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ opacity: 0.6 }}>{sec.num}</span> {sec.titulo}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 }}>
                {sec.campos.map(f => {
                  const isForn = f.k === 'fornecedor';
                  const fornecedoresSap = (typeof DADOS_FORNECEDORES !== 'undefined' ? DADOS_FORNECEDORES : []);
                  return (
                    <div key={f.k} style={{ gridColumn: f.w === 2 ? 'span 2' : 'span 1' }}>
                      <label style={lbl}>{f.label}{isForn && fornecedoresSap.length > 0 && <span style={{ color: 'var(--text-dim)', fontWeight: 400 }}> · cadastrados no SAP</span>}</label>
                      <input
                        type={f.tipo || 'text'}
                        list={isForn ? 'ag-fornec-sap' : undefined}
                        value={campos[f.k] || ''}
                        maxLength={f.max}
                        onChange={e => {
                          const v = f.up ? e.target.value.toUpperCase() : e.target.value;
                          if (isForn) {
                            const match = fornecedoresSap.find(fo => (fo.nome || '').toLowerCase() === v.toLowerCase());
                            setCampos(c => ({ ...c, fornecedor: v, ...(match ? { cnpj_do_fornecedor: match.cnpj || c.cnpj_do_fornecedor || '', _fornecedor_codigo: match.codigo } : {}) }));
                          } else setCampo(f.k, v);
                        }}
                        placeholder={isForn ? 'Digite p/ buscar no SAP ou preencha à mão' : (f.ph || '')}
                        style={{ ...inp, ...(f.mono ? { fontFamily: 'JetBrains Mono, monospace' } : {}) }}
                      />
                      {isForn && (
                        <datalist id="ag-fornec-sap">
                          {fornecedoresSap.map(fo => (
                            <option key={fo.codigo} value={fo.nome}>{fo.cnpj ? 'CNPJ ' + fo.cnpj : (fo.codigo || '')}</option>
                          ))}
                        </datalist>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}

          {/* 04 Produtos */}
          <div style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--accent-light)', marginBottom: 8 }}>
              <span style={{ opacity: 0.6 }}>04</span> Produtos a retirar
            </div>
            <table style={{ width: '100%' }}>
              <thead><tr>
                <th>Produto</th><th style={{ width: 160 }}>Embalagem</th><th className="num" style={{ width: 110 }}>Qtd</th><th style={{ width: 40 }}></th>
              </tr></thead>
              <tbody>{produtos.map((p, i) => (
                <tr key={i}>
                  <td><input value={p.produto} onChange={e => setProd(i, 'produto', e.target.value)} placeholder="Cultivar / descrição" style={inp} /></td>
                  <td><input value={p.embalagem} onChange={e => setProd(i, 'embalagem', e.target.value)} placeholder="BB / Saca..." style={inp} /></td>
                  <td><input value={p.qtd} onChange={e => setProd(i, 'qtd', e.target.value)} inputMode="numeric" placeholder="0" style={{ ...inp, textAlign: 'right', fontFamily: 'JetBrains Mono, monospace' }} /></td>
                  <td style={{ textAlign: 'center' }}>
                    <button className="btn btn-ghost" style={{ padding: '4px 6px' }} onClick={() => rmProd(i)} disabled={produtos.length <= 1}><i className="ti ti-x"></i></button>
                  </td>
                </tr>
              ))}</tbody>
            </table>
            <button className="btn btn-ghost" style={{ marginTop: 6, fontSize: 12 }} onClick={addProd}><i className="ti ti-plus"></i> Adicionar produto</button>
          </div>

          {/* 05 Observações */}
          <div style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--accent-light)', marginBottom: 8 }}>
              <span style={{ opacity: 0.6 }}>05</span> Observações
            </div>
            <textarea value={campos.instrucoes_para_o_fornecedor || ''} onChange={e => setCampo('instrucoes_para_o_fornecedor', e.target.value)}
              placeholder="Instruções para o fornecedor" rows={3} style={{ ...inp, resize: 'vertical' }} />
          </div>

          {/* Controle */}
          <div style={{ display: 'flex', gap: 20, alignItems: 'center', flexWrap: 'wrap', padding: '12px 14px', background: 'var(--bg-card)', borderRadius: 8, border: '1px solid var(--border)' }}>
            <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, cursor: 'pointer' }}>
              <input type="checkbox" checked={recebida} onChange={e => setRecebida(e.target.checked)} style={{ width: 18, height: 18, cursor: 'pointer', accentColor: 'var(--green)' }} />
              Carga recebida
            </label>
            <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13 }}>
              Valor do frete pago (R$)
              <input value={valorFrete} onChange={e => setValorFrete(e.target.value)} inputMode="decimal" placeholder="0,00"
                style={{ width: 110, padding: '6px 8px', textAlign: 'right', background: 'var(--bg-elev)', border: '1px solid var(--border-strong)', borderRadius: 5, color: 'var(--text)', fontFamily: 'JetBrains Mono, monospace', fontSize: 13 }} />
            </label>
          </div>
        </div>

        <div className="modal-footer" style={{ display: 'flex', justifyContent: 'space-between', gap: 8, padding: '12px 20px', borderTop: '1px solid var(--border)' }}>
          <button className="btn btn-ghost" onClick={() => imprimirAgendamento({ num: inicial.num, campos, produtos }, 'Agendamento de Embarque')}>
            <i className="ti ti-printer"></i> Imprimir
          </button>
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="btn btn-ghost" onClick={onFechar}>Cancelar</button>
            <button className="btn btn-primary" onClick={salvar} disabled={salvando}>
              <i className="ti ti-device-floppy"></i> {salvando ? 'Salvando...' : (editar ? 'Salvar alterações' : 'Salvar no banco')}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

const NovaOEFornecedor = ({ ctx }) => {
  const pedidos = (typeof DADOS_PEDIDOS_COMPRA !== 'undefined' ? DADOS_PEDIDOS_COMPRA : []).filter(p => p.tem_saldo);
  const [pcNumero, setPcNumero] = useState('');
  const pc = useMemo(() => pedidos.find(p => p.numero === pcNumero) || null, [pedidos, pcNumero]);
  const [sel, setSel] = useState({}); // { [codigo]: { incluir, qtd, it } }
  const [mot, setMot] = useState({ nome: '', cpf: '', placa: '', uf: '' });
  const [dataPrev, setDataPrev] = useState('');
  const [obs, setObs] = useState('');

  // Ao trocar de pedido, pré-marca todos os itens com a quantidade do saldo.
  useEffect(() => {
    if (!pc) { setSel({}); return; }
    const init = {};
    (pc.itens || []).forEach(it => {
      init[it.codigo] = { incluir: true, qtd: (it.saldo != null ? it.saldo : it.qtd_bb) || 0, it };
    });
    setSel(init);
  }, [pcNumero]);

  const escolhidos = Object.values(sel).filter(x => x.incluir && Number(x.qtd) > 0);
  const totalVol = escolhidos.reduce((a, x) => a + Number(x.qtd), 0);
  const lbl = { fontSize: 11, color: 'var(--text-muted)', display: 'block', marginBottom: 4 };

  const salvar = () => {
    if (!pc) { ctx.showToast('Escolha um pedido de compra', ''); return; }
    if (escolhidos.length === 0) { ctx.showToast('Selecione ao menos um item com quantidade', ''); return; }
    if (!mot.nome.trim() || !mot.placa.trim()) { ctx.showToast('Informe o motorista e a placa', ''); return; }
    ctx.criarOECompra({
      fornecedor: pc.fornecedor,
      fornecedor_codigo: pc.fornecedor_codigo,
      pedido_compra_numero: pc.numero,
      pedido_compra_doc_entry: pc.doc_entry,
      itens: escolhidos.map(x => ({
        codigo: x.it.codigo,
        descricao: x.it.descricao,
        embalagem: x.it.embalagem || '',
        unidade: x.it.embalagem || 'un',
        qtd: Number(x.qtd),
        saldo_pedido: x.it.saldo,
        valor_unitario: x.it.valor_unitario,
        grupo_nome: x.it.grupo_nome,
      })),
      motorista_nome: mot.nome.trim(),
      motorista_cpf: mot.cpf.trim(),
      veiculo_placa: mot.placa.trim().toUpperCase(),
      veiculo_placa_uf: mot.uf.trim().toUpperCase(),
      data_prevista: dataPrev || null,
      observacoes: obs.trim(),
    });
    ctx.setScreen('embarque-fornecedores');
  };

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="crumb"><i className="ti ti-home"></i> Operação · Nova OE de Retirada</div>
          <h1 className="page-title">Nova OE · Retirada em Fornecedor</h1>
          <p className="page-subtitle">Escolha o pedido de compra, os itens e informe motorista/veículo</p>
        </div>
        <button className="btn btn-ghost" onClick={() => ctx.setScreen('embarque-fornecedores')}><i className="ti ti-arrow-left"></i> Voltar</button>
      </div>

      <div className="panel" style={{ marginBottom: 16 }}>
        <div className="panel-header"><div><div className="panel-title">1 · Pedido de compra</div><div className="panel-sub">Fornecedor de onde vamos retirar</div></div></div>
        <div style={{ padding: 18 }}>
          <select className="input" value={pcNumero} onChange={e => setPcNumero(e.target.value)} style={{ maxWidth: 560 }}>
            <option value="">— Selecione o pedido de compra —</option>
            {pedidos.map(p => <option key={p.numero} value={p.numero}>{p.numero} · {p.fornecedor} · saldo {fmtNum(p.qtd_saldo_bb || 0)}</option>)}
          </select>
          {pedidos.length === 0 && <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 8 }}>Nenhum pedido de compra com saldo em aberto no SAP.</div>}
          {pc && <div style={{ marginTop: 12, fontSize: 13 }}><strong>{pc.fornecedor}</strong> <span className="cell-muted mono" style={{ fontSize: 12 }}>({pc.fornecedor_codigo})</span></div>}
        </div>
      </div>

      {pc && (
        <div className="panel" style={{ marginBottom: 16 }}>
          <div className="panel-header">
            <div><div className="panel-title">2 · Itens a retirar</div><div className="panel-sub">Marque os itens e ajuste as quantidades (padrão: saldo do pedido)</div></div>
            <span className="chip chip-green"><span className="status-dot"></span> {escolhidos.length} item(ns) · {fmtNum(totalVol)} vol.</span>
          </div>
          <table>
            <thead><tr><th style={{ width: 40 }}></th><th>Item</th><th>Descrição</th><th>Embalagem</th><th className="num">Saldo</th><th className="num">Qtd a retirar</th></tr></thead>
            <tbody>{(pc.itens || []).map(it => {
              const s = sel[it.codigo] || { incluir: false, qtd: 0 };
              return (
                <tr key={it.codigo} style={{ opacity: s.incluir ? 1 : 0.5 }}>
                  <td><input type="checkbox" checked={!!s.incluir} onChange={e => setSel(prev => ({ ...prev, [it.codigo]: { ...(prev[it.codigo] || {}), it, incluir: e.target.checked } }))} /></td>
                  <td className="mono cell-muted" style={{ fontSize: 11 }}>{it.codigo}</td>
                  <td><div className="cell-primary" style={{ fontSize: 13 }}>{it.descricao}</div></td>
                  <td className="mono cell-muted" style={{ fontSize: 12 }}>{it.embalagem || '—'}</td>
                  <td className="num mono">{fmtNum(it.saldo != null ? it.saldo : it.qtd_bb)}</td>
                  <td className="num">
                    <input className="input" type="number" min="0" value={s.qtd != null ? s.qtd : ''} disabled={!s.incluir}
                      onChange={e => setSel(prev => ({ ...prev, [it.codigo]: { ...(prev[it.codigo] || {}), it, qtd: e.target.value } }))}
                      style={{ width: 110, textAlign: 'right' }} />
                  </td>
                </tr>
              );
            })}</tbody>
          </table>
        </div>
      )}

      {pc && (
        <div className="panel" style={{ marginBottom: 16 }}>
          <div className="panel-header"><div><div className="panel-title">3 · Motorista e veículo</div><div className="panel-sub">Quem vai buscar</div></div></div>
          <div style={{ padding: 18, display: 'grid', gridTemplateColumns: '2fr 1fr 1fr 90px', gap: 12 }}>
            <div><label style={lbl}>Motorista *</label><input className="input" value={mot.nome} onChange={e => setMot({ ...mot, nome: e.target.value })} placeholder="Nome do motorista" /></div>
            <div><label style={lbl}>CPF</label><input className="input" value={mot.cpf} onChange={e => setMot({ ...mot, cpf: e.target.value })} placeholder="CPF" /></div>
            <div><label style={lbl}>Placa *</label><input className="input" value={mot.placa} onChange={e => setMot({ ...mot, placa: e.target.value })} placeholder="ABC1D23" /></div>
            <div><label style={lbl}>UF</label><input className="input" value={mot.uf} onChange={e => setMot({ ...mot, uf: e.target.value })} placeholder="UF" maxLength={2} /></div>
          </div>
          <div style={{ padding: '0 18px 18px', display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 12 }}>
            <div><label style={lbl}>Data prevista</label><input className="input" type="date" value={dataPrev} onChange={e => setDataPrev(e.target.value)} /></div>
            <div><label style={lbl}>Observações</label><input className="input" value={obs} onChange={e => setObs(e.target.value)} placeholder="Observações da retirada" /></div>
          </div>
        </div>
      )}

      <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
        <button className="btn btn-ghost" onClick={() => ctx.setScreen('embarque-fornecedores')}>Cancelar</button>
        <button className="btn btn-primary" onClick={salvar} disabled={!pc || escolhidos.length === 0}><i className="ti ti-check"></i> Criar OE de retirada</button>
      </div>
    </div>
  );
};

const Toast = ({ title, msg }) => (
  <div className="toast">
    <i className="ti ti-circle-check"></i>
    <div>
      <div className="toast-title">{title}</div>
      <div className="toast-msg">{msg}</div>
    </div>
